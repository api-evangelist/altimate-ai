components:
  schemas:
    UserQueryBreakdownResponse:
      properties:
        breakdown:
          items:
            $ref: '#/components/schemas/UserQueryStats'
          type: array
          title: Breakdown
      type: object
      required:
      - breakdown
      title: UserQueryBreakdownResponse
      description: Response for user query breakdown.
    QueryRecord:
      properties:
        statement_id:
          type: string
          title: Statement Id
        statement_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Statement Type
        execution_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Execution Status
        start_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start Time
        end_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End Time
        total_duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Duration Ms
        read_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Read Bytes
        spilled_local_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Spilled Local Bytes
        workspace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
        workspace_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Name
        warehouse_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Warehouse Id
        user_name:
          anyOf:
          - type: string
          - type: 'null'
          title: User Name
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
      type: object
      required:
      - statement_id
      title: QueryRecord
      description: A single query record.
    QueryCostTrendsByUserResponse:
      properties:
        trends:
          items:
            $ref: '#/components/schemas/QueryCostTrendByUserPoint'
          type: array
          title: Trends
        granularity:
          type: string
          title: Granularity
        users:
          items:
            type: string
          type: array
          title: Users
          description: List of unique users in the data (for chart legend)
      type: object
      required:
      - trends
      - granularity
      title: QueryCostTrendsByUserResponse
      description: Response for query cost trends broken down by user.
    StatementTypeBreakdownResponse:
      properties:
        breakdown:
          items:
            $ref: '#/components/schemas/StatementTypeStats'
          type: array
          title: Breakdown
      type: object
      required:
      - breakdown
      title: StatementTypeBreakdownResponse
      description: Response for statement type breakdown.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    QueryCostTrendByUserPoint:
      properties:
        period:
          type: string
          title: Period
        user_name:
          type: string
          title: User Name
        estimated_cost_usd:
          type: number
          title: Estimated Cost Usd
          default: 0
      type: object
      required:
      - period
      - user_name
      title: QueryCostTrendByUserPoint
      description: A single point in query cost trends by user.
    FullScanQueriesResponse:
      properties:
        queries:
          items:
            $ref: '#/components/schemas/QueryRecord'
          type: array
          title: Queries
        min_read_bytes:
          type: integer
          title: Min Read Bytes
        total_count:
          type: integer
          title: Total Count
      type: object
      required:
      - queries
      - min_read_bytes
      - total_count
      title: FullScanQueriesResponse
      description: Response for queries with full scans.
    SpillQueriesResponse:
      properties:
        queries:
          items:
            $ref: '#/components/schemas/QueryRecord'
          type: array
          title: Queries
        min_spill_bytes:
          type: integer
          title: Min Spill Bytes
        total_count:
          type: integer
          title: Total Count
      type: object
      required:
      - queries
      - min_spill_bytes
      - total_count
      title: SpillQueriesResponse
      description: Response for queries with memory spills.
    QueriesResponse:
      properties:
        queries:
          items:
            $ref: '#/components/schemas/QueryRecord'
          type: array
          title: Queries
        total_count:
          type: integer
          title: Total Count
          description: Total number of queries returned
      type: object
      required:
      - queries
      - total_count
      title: QueriesResponse
      description: Response for listing queries.
    StatementTypeStats:
      properties:
        statement_type:
          type: string
          title: Statement Type
        query_count:
          type: integer
          title: Query Count
        avg_duration_ms:
          type: number
          title: Avg Duration Ms
        total_read_bytes:
          type: integer
          title: Total Read Bytes
      type: object
      required:
      - statement_type
      - query_count
      - avg_duration_ms
      - total_read_bytes
      title: StatementTypeStats
      description: Statistics for a statement type.
    FailedQueriesResponse:
      properties:
        queries:
          items:
            $ref: '#/components/schemas/QueryRecord'
          type: array
          title: Queries
        total_count:
          type: integer
          title: Total Count
      type: object
      required:
      - queries
      - total_count
      title: FailedQueriesResponse
      description: Response for failed queries.
    app__schemas__databricks__query__QuerySqlLineageResponse:
      properties:
        tableEdges:
          items:
            items: {}
            type: array
          type: array
          title: Tableedges
          description: List of [source, target] table edges
        details:
          additionalProperties: true
          type: object
          title: Details
          description: Details about each node (tables/CTEs) in the lineage
        nodePositions:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Nodepositions
          description: Positions for each node in the visualization
        is_lineage:
          type: boolean
          title: Is Lineage
          description: Whether lineage data is available
          default: false
        is_error:
          type: boolean
          title: Is Error
          description: Whether there was an error parsing the SQL
          default: false
      type: object
      title: QuerySqlLineageResponse
      description: Response for SQL lineage visualization.
    SlowQueriesResponse:
      properties:
        queries:
          items:
            $ref: '#/components/schemas/QueryRecord'
          type: array
          title: Queries
        min_duration_ms:
          type: integer
          title: Min Duration Ms
        total_count:
          type: integer
          title: Total Count
      type: object
      required:
      - queries
      - min_duration_ms
      - total_count
      title: SlowQueriesResponse
      description: Response for slow queries.
    UserQueryStats:
      properties:
        user_name:
          type: string
          title: User Name
        query_count:
          type: integer
          title: Query Count
        avg_duration_ms:
          type: number
          title: Avg Duration Ms
        total_read_bytes:
          type: integer
          title: Total Read Bytes
      type: object
      required:
      - user_name
      - query_count
      - avg_duration_ms
      - total_read_bytes
      title: UserQueryStats
      description: Query statistics for a user.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
