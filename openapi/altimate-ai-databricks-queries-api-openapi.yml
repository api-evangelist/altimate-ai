          type: string
          title: Statement Id
        statement_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Statement Text
        statement_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Statement Type
        execution_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Execution Status
        start_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start Time
        end_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End Time
        total_duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Duration Ms
        read_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Read Bytes
        spilled_local_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Spilled Local Bytes
        workspace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
        workspace_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Name
        warehouse_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Warehouse Id
