openapi: 3.2.0
info:
  title: Fast Databricks Queries API
  version: 0.1.0
tags:
- name: Databricks Queries
paths:
  /api/v1/databricks/queries/trends/cost-by-user:
    get:
      tags:
      - Databricks Queries
      summary: Get query cost trends by user
      description: Get query cost trends over time broken down by user.
      operationId: get_query_cost_trends_by_user_api_v1_databricks_queries_trends_cost_by_user_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Start date
          title: Start Date
        description: Start date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
          description: End date
          title: End Date
        description: End date
      - name: granularity
        in: query
        required: false
        schema:
          type: string
          description: 'Time granularity: ''day'', ''week'', or ''month'''
          default: day
          title: Granularity
        description: 'Time granularity: ''day'', ''week'', or ''month'''
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by workspace ID
          title: Workspace Id
        description: Filter by workspace ID
      - name: top_n
        in: query
        required: false
        schema:
          type: integer
          maximum: 10
          minimum: 1
          description: Number of top users to show
          default: 5
          title: Top N
        description: Number of top users to show
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryCostTrendsByUserResponse'
        '403':
          description: Not authorized
        '404':
          description: No ClickHouse database configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
