components:
  schemas:
    SlowQueriesResponse:
      properties:
        queries:
          items:
            $ref: '#/components/schemas/QueryRecord'
          type: array
          title: Queries
        min_duration_ms:
          type: integer
          title: Min Duration Ms
        total_count:
          type: integer
          title: Total Count
      type: object
      required:
      - queries
      - min_duration_ms
      - total_count
      title: SlowQueriesResponse
      description: Response for slow queries.
    QueryStatementIdsResponse:
      properties:
        statement_ids:
          items:
            type: string
          type: array
          title: Statement Ids
          default: []
        total_pages:
          type: integer
          title: Total Pages
          description: 'Forward-looking page upper bound for the FE filter dropdown''s ``page < pages`` check. NOT a true total (no COUNT runs): equals the current page when no further results remain, current page + 1 while more do. The FE''s ``FilterInput`` reads this field by convention (same name as other paginated dropdowns) — renaming it would break shared dropdown pagination wiring.'
          default: 1
      type: object
      title: QueryStatementIdsResponse
      description: Statement IDs matching a Query ID filter search (server-side, paged).
    QueryRecord:
      properties:
        statement_id:
          type: string
          title: Statement Id
        statement_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Statement Type
        execution_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Execution Status
        start_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start Time
        end_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End Time
        total_duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Duration Ms
        read_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Read Bytes
        spilled_local_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Spilled Local Bytes
        workspace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
        workspace_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Name
        warehouse_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Warehouse Id
        user_name:
          anyOf:
          - type: string
          - type: 'null'
          title: User Name
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
      type: object
      required:
      - statement_id
      title: QueryRecord
      description: A single query record.
