          description: The occurrence the edit was launched from. The edit applies to it and every later occurrence; earlier ones keep the schedule they already have. Omit to apply from now.
      type: object
      required:
      - schedule_type
      - start_time_local
      - duration_minutes
      title: SeriesUpdateRequest
      description: 'Edit a recurring series'' template ("all future events").


        ``warehouse_name``, ``instance_id``, and ``timezone`` are fixed to the

        existing series and cannot change. ``days_of_week`` / ``end_date`` are

        optional: absent means unchanged; sending either reschedules the series —

        its occurrences from ``from_schedule_id`` onward are replaced with a set

        materialized from the new cadence (occurrences a user individually deleted

        stay deleted). Time/config-only edits update those occurrences in place on

        their own dates. Conflicting occurrences are skipped and reported either

        way.'
