  /warehouse/schedules/bulk-approve:
    post:
      tags:
      - WAREHOUSE_SCHEDULE
      summary: Bulk Approve Schedules
      description: 'Approve pending schedules in a date range, reporting skipped conflicts.


        Successor of /approve-recommendations: conflicted schedules (e.g. inside

        an approved Blocked window) are skipped and returned with user-readable

        conflict details instead of being silently approved.'
      operationId: bulk_approve_schedules_warehouse_schedules_bulk_approve_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRecommendedEventsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkApprovalResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Bulk Approve Schedules Warehouse Schedules Bulk Approve Post
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Bulk Approve Schedules Warehouse Schedules Bulk Approve Post
        '404':
          description: Schedule not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Bulk Approve Schedules Warehouse Schedules Bulk Approve Post
        '422':
