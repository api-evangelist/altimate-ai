  /warehouse/schedules/series:
    post:
      tags:
      - WAREHOUSE_SCHEDULE
      summary: Create Series
      description: 'Create a recurring schedule series and materialize its occurrences.


        The configuration is resolved the same way a one-off schedule''s is (caller

        size or warehouse default, plus any QAS override, and the requested-axes

        marker), so occurrences conflict-check against existing schedules on the

        same axes they touch. Occurrences whose windows conflict are reported in

        ``skipped`` — they never fail the series.'
      operationId: create_series_warehouse_schedules_series_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesCreateRequest'
      responses:
