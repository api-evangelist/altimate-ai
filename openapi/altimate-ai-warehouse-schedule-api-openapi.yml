components:
  schemas:
    ApplyRecommendedEventsRequest:
      properties:
        warehouse_name:
          type: string
          title: Warehouse Name
        instance_id:
          type: string
          title: Instance Id
        start_time:
          type: string
          format: date-time
          title: Start Time
        end_time:
          type: string
          format: date-time
          title: End Time
      type: object
      required:
      - warehouse_name
      - instance_id
      - start_time
      - end_time
      title: ApplyRecommendedEventsRequest
    ScheduleApprovalRequest:
      properties:
        reason:
          type: string
          title: Reason
          description: Reason for approval/rejection
      type: object
      required:
      - reason
      title: ScheduleApprovalRequest
    RecommendationResponse:
      properties:
        recommendation_id:
          type: integer
          title: Recommendation Id
        applied_schedule_id:
          type: integer
          title: Applied Schedule Id
        recommendation_data:
          additionalProperties: true
          type: object
          title: Recommendation Data
        created_at:
          type: string
          format: date-time
          title: Created At
        metrics:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metrics
      type: object
      required:
      - recommendation_id
      - applied_schedule_id
      - recommendation_data
      - created_at
      title: RecommendationResponse
    ScheduleType:
      type: string
      enum:
      - recommendation
      - manual
      - block
      - auto_resize
      - backoff
      title: ScheduleType
    ActionType:
      type: string
      enum:
      - upsize
      - downsize
      - no_change
      title: ActionType
    app__schemas__warehouse_schedules__ScheduleListResponse:
      properties:
        schedule_id:
          type: integer
          title: Schedule Id
        warehouse_name:
          type: string
          title: Warehouse Name
        configuration:
          $ref: '#/components/schemas/WarehouseConfig'
        start_time:
          type: string
          format: date-time
          title: Start Time
        end_time:
          type: string
          format: date-time
          title: End Time
        schedule_type:
          $ref: '#/components/schemas/ScheduleType'
        status:
          $ref: '#/components/schemas/ScheduleStatus'
        reason:
          type: string
          title: Reason
        created_by:
          type: integer
          title: Created By
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_by:
          anyOf:
          - type: integer
          - type: 'null'
          title: Updated By
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        recurrence_pattern:
          anyOf:
          - {}
          - type: 'null'
          title: Recurrence Pattern
        resize_mode:
          anyOf:
          - $ref: '#/components/schemas/app__schemas__warehouse_schedules__AutoResizingMode'
          - type: 'null'
        recommendation:
          anyOf:
          - $ref: '#/components/schemas/RecommendationResponse'
          - type: 'null'
        defaults:
          anyOf:
          - $ref: '#/components/schemas/WarehouseDefaultsResponse'
          - type: 'null'
      type: object
      required:
      - schedule_id
      - warehouse_name
      - configuration
      - start_time
      - end_time
      - schedule_type
      - status
      - reason
      - created_by
      - created_at
      title: ScheduleListResponse
    app__schemas__warehouse_schedules__ScheduleUpdateRequest:
      properties:
        warehouse_configuration:
          anyOf:
          - $ref: '#/components/schemas/WarehouseConfig'
          - type: 'null'
        start_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start Time
        end_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End Time
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        recurrence_pattern:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Recurrence Pattern
        schedule_type:
          type: string
          title: Schedule Type
          description: 'One of: manual, recommendation, block'
      type: object
      required:
