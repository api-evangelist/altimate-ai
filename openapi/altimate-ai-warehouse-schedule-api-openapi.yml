  /warehouse/schedules/series/{series_id}:
    patch:
      tags:
      - WAREHOUSE_SCHEDULE
      summary: Update Series
      description: 'Edit a recurring series'' template ("this and following events").


        ``from_schedule_id`` scopes the edit: that occurrence and every later one

        change, everything before it is left as it is. Omitting it scopes the edit

        from the current instant instead.


        Time/config-only edits update the in-scope approved occurrences in place on

        their own dates. Sending ``days_of_week`` and/or ``end_date`` reschedules

        the series: the in-scope approved occurrences are replaced with a set

        materialized from the new cadence (user-deleted occurrences stay deleted).

        ``timezone`` is immutable. Occurrences whose window conflicts are skipped

        and reported in ``skipped``.'
      operationId: update_series_warehouse_schedules_series__series_id__patch
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: series_id
        in: path
        required: true
        schema:
          type: integer
          title: Series Id
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesUpdateResponse'
        '400':
          description: Invalid request data
