              schema:
                $ref: '#/components/schemas/SeriesCreateResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Create Series Warehouse Schedules Series Post
        '403':
