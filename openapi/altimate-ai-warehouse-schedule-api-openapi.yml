      - warehouse_name
      - configuration
      - start_time
      - end_time
      - schedule_type
      - status
      - reason
      - created_by
      - created_at
      title: ScheduleListResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    SeriesCreateRequest:
      properties:
        warehouse_name:
          type: string
          title: Warehouse Name
        instance_id:
          type: string
          title: Instance Id
        warehouse_configuration:
          anyOf:
          - $ref: '#/components/schemas/WarehouseConfig'
          - type: 'null'
        schedule_type:
          type: string
          enum:
          - manual
          - block
          title: Schedule Type
          description: 'One of: manual, block'
        days_of_week:
          items:
            type: string
          type: array
          title: Days Of Week
        start_time_local:
          type: string
          title: Start Time Local
          description: Local wall-clock "HH:MM"
        duration_minutes:
          type: integer
          exclusiveMinimum: 0.0
          title: Duration Minutes
        timezone:
          type: string
          title: Timezone
          description: IANA timezone, e.g. America/Los_Angeles
        end_date:
          type: string
          format: date
          title: End Date
          description: Required; at most 90 days from today
        start_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Start Date
          description: Anchor date (local calendar date in `timezone`) — always materializes an occurrence at create time, regardless of `days_of_week`. Not persisted; the occurrence set is fully materialized up front.
      type: object
      required:
      - warehouse_name
      - instance_id
      - schedule_type
      - days_of_week
      - start_time_local
      - duration_minutes
      - timezone
      - end_date
      title: SeriesCreateRequest
      description: 'A recurring warehouse schedule.


        ``warehouse_configuration`` matches the one-off create request: a caller may

        pin a size, toggle query acceleration, or both. Days are lowercase IANA

        weekday names; ``start_time_local`` is "HH:MM" wall-clock in ``timezone``.

        ``end_date`` is required and must be at most 90 days out — the series is

        fully materialized up-front through that date, so it has a hard bound.'
    SkippedScheduleResponse:
      properties:
        schedule_id:
          type: integer
          title: Schedule Id
        schedule_type:
          $ref: '#/components/schemas/ScheduleType'
