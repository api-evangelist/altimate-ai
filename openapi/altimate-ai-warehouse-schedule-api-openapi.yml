              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /warehouse/schedules/approve-recommendations:
    post:
      tags:
      - WAREHOUSE_SCHEDULE
      summary: Approve Recommendations
      description: 'Approve all recommended and pending manual schedules for a warehouse within a date
        range.


        Deprecated in favor of /bulk-approve, which also reports skipped

        conflicts. This endpoint keeps its original response shape (approved

        list only) but no longer approves schedules that conflict with an

        approved Blocked schedule — those are silently skipped.'
      operationId: approve_recommendations_warehouse_schedules_approve_recommendations_post
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
