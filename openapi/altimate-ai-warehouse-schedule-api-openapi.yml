    SeriesUpdateRequest:
      properties:
        warehouse_configuration:
          anyOf:
          - $ref: '#/components/schemas/WarehouseConfig'
          - type: 'null'
        schedule_type:
          type: string
          enum:
          - manual
          - block
          title: Schedule Type
          description: 'One of: manual, block'
        start_time_local:
          type: string
          title: Start Time Local
          description: Local wall-clock "HH:MM"
        duration_minutes:
          type: integer
          exclusiveMinimum: 0.0
          title: Duration Minutes
        days_of_week:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Days Of Week
          description: New weekday cadence; omit to keep the current days.
        end_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: End Date
          description: New end date (at most 90 days from today); omit to keep the current end date.
        from_schedule_id:
          anyOf:
          - type: integer
          - type: 'null'
