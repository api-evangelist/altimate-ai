        reason:
          type: string
          title: Reason
        created_by:
          type: integer
          title: Created By
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_by:
          anyOf:
          - type: integer
          - type: 'null'
          title: Updated By
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
        recurrence_pattern:
          anyOf:
          - {}
          - type: 'null'
          title: Recurrence Pattern
        series_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Series Id
        series_timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Series Timezone
        resize_mode:
          anyOf:
