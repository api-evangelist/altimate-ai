openapi: 3.2.0
info:
  title: Fast ALERTS V1 API
  version: 0.1.0
tags:
- name: Alerts V1
paths:
  /api/v1/alerts/rules:
    get:
      tags:
      - Alerts V1
      summary: List Rules
      description: Paginated list of alert/report rules.
      operationId: list_rules_api_v1_alerts_rules_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: rule_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '''alert'' or ''report'''
          title: Rule Type
        description: '''alert'' or ''report'''
      - name: platform
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '''snowflake'' or ''databricks'''
          title: Platform
        description: '''snowflake'' or ''databricks'''
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '''metric'' or ''playground_report'''
          title: Source
        description: '''metric'' or ''playground_report'''
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Page size
          default: 50
          title: Size
        description: Page size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_RuleResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Alerts V1
      summary: Create
      description: Create a new alert or report rule.
      operationId: create_api_v1_alerts_rules_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts/rules/summary:
    get:
      tags:
      - Alerts V1
      summary: Rules Summary
      description: Summary counts for the rules list page.
      operationId: rules_summary_api_v1_alerts_rules_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesListResponse'
      security:
      - HTTPBearer: []
      - HTTPBearer: []
  /api/v1/alerts/rules/filters:
    get:
      tags:
      - Alerts V1
      summary: Rules Filters
      description: Distinct filter values for the rules list page.
      operationId: rules_filters_api_v1_alerts_rules_filters_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
      - HTTPBearer: []
  /api/v1/alerts/rules/{rule_id}:
    get:
      tags:
      - Alerts V1
      summary: Get
      description: Get a single rule by ID.
      operationId: get_api_v1_alerts_rules__rule_id__get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: integer
          title: Rule Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Alerts V1
      summary: Update
      description: Update an existing rule.
      operationId: update_api_v1_alerts_rules__rule_id__post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: integer
          title: Rule Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Alerts V1
      summary: Delete
      description: Delete a rule and all its runs.
      operationId: delete_api_v1_alerts_rules__rule_id__delete
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: integer
          title: Rule Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts/rules/{rule_id}/clone:
    post:
      tags:
      - Alerts V1
      summary: Clone
      description: Clone a rule. Only the owner can clone their own rules.
      operationId: clone_api_v1_alerts_rules__rule_id__clone_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: integer
          title: Rule Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts/rules/{rule_id}/runs:
    get:
      tags:
      - Alerts V1
      summary: Get Runs
      description: 'Paginated execution history for a rule, optionally filtered by status

        and an ``executed_at`` date range (powers the history page''s date filter).'
      operationId: get_runs_api_v1_alerts_rules__rule_id__runs_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: integer
          title: Rule Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Size
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: start
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Only runs executed at/after this time (ISO-8601)
          title: Start
        description: Only runs executed at/after this time (ISO-8601)
      - name: end
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Only runs executed before this time (ISO-8601)
          title: End
        description: Only runs executed before this time (ISO-8601)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunsListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts/rules/{rule_id}/report-artifacts:
    get:
      tags:
      - Alerts V1
      summary: Get Report Artifacts
      description: List only artifacts whose frozen data scope still matches the reader.
      operationId: get_report_artifacts_api_v1_alerts_rules__rule_id__report_artifacts_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: integer
          title: Rule Id
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportArtifactListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts/rules/{rule_id}/report-artifacts/{artifact_id}:
    get:
      tags:
      - Alerts V1
      summary: Get Report Artifact
      operationId: get_report_artifact_api_v1_alerts_rules__rule_id__report_artifacts__artifact_id__get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: integer
          title: Rule Id
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Artifact Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportArtifactDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts/rules/{rule_id}/report-artifacts/{artifact_id}/download:
    get:
      tags:
      - Alerts V1
      summary: Download Report Artifact
      operationId: download_report_artifact_api_v1_alerts_rules__rule_id__report_artifacts__artifact_id__download_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: integer
          title: Rule Id
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Artifact Id
      responses:
        '200':
          description: Successful Response
          content:
            application/pdf: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts/rules/{rule_id}/evaluate:
    post:
      tags:
      - Alerts V1
      summary: Evaluate
      description: Evaluate a rule. dry_run=True for read-only, False to record the run.
      operationId: evaluate_api_v1_alerts_rules__rule_id__evaluate_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: integer
          title: Rule Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
              default:
                dry_run: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResultResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts/dry-run:
    post:
      tags:
      - Alerts V1
      summary: Dry Run
      description: 'Evaluate a rule config on-the-fly without persisting anything.


        Accepts the same JSON shape as RuleCreateRequest / the saved column,

        so the payload can be copy-pasted directly.'
      operationId: dry_run_api_v1_alerts_dry_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DryRunRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResultResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - HTTPBearer: []
  /api/v1/alerts/preview:
    post:
      tags:
      - Alerts V1
      summary: Preview
      description: Preview what a metric config would produce (chart + markdown).
      operationId: preview_api_v1_alerts_preview_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - HTTPBearer: []
  /api/v1/alerts/preview/playground-report:
    post:
      tags:
      - Alerts V1
      summary: Preview Playground Report
      description: 'Preview what a playground report would look like.


        Regenerates the session through the same ask pipeline a scheduled run uses,

        so the preview shows the content the next delivery would carry — it costs an

        LLM run and appends a new assistant turn to the session, but nothing is

        delivered and no run is recorded. Blocks for the length of that run.


        Distinct from ``/preview`` because playground reports have no metric_config

        and need no ClickHouse access.'
      operationId: preview_playground_report_api_v1_alerts_preview_playground_report_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaygroundReportPreviewRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroundReportPreviewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - HTTPBearer: []
  /api/v1/alerts/notifications/test/playground-report:
    post:
      tags:
      - Alerts V1
      summary: Test Playground Report Notification
      description: 'Send a playground report to one destination as a test.


        Distinct from ``/notifications/test``, which is metric-only (it requires

        entity_type + metric_config). Regenerates the session and delivers through

        the same helpers a scheduled run uses, so a passing test means the real

        delivery works. Records no run; blocks for the length of the LLM run.'
      operationId: test_playground_report_notification_api_v1_alerts_notifications_test_playground_report_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaygroundReportTestRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaygroundReportTestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - HTTPBearer: []
  /api/v1/alerts/notifications/test:
    post:
      tags:
      - Alerts V1
      summary: Test Notification
      description: 'Send a test notification using a draft rule config.


        Runs the same evaluator + chart pipeline as a real alert against real

        ClickHouse data, then dispatches via the chosen notifier (email / slack /

        webhook). Hard-fails on validation or chart-generation errors;

        returns 200 with `{ok: false, error}` for delivery failures.


        Rate limited to 10 requests/minute per tenant.'
      operationId: test_notification_api_v1_alerts_notifications_test_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationTestRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - HTTPBearer: []
  /api/v1/alerts/templates:
    get:
      tags:
      - Alerts V1
      summary: List Templates
      description: Flat template library for the alert creation UI.
      operationId: list_templates_api_v1_alerts_templates_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: platform
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by platform: ''snowflake'' or ''databricks'''
          title: Platform
        description: 'Filter by platform: ''snowflake'' or ''databricks'''
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter templates by tag, e.g. 'popular'
          title: Tag
        description: Filter templates by tag, e.g. 'popular'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts/templates/{template_id}:
    get:
      tags:
      - Alerts V1
      summary: Get Template
      description: Get a single template by ID. Returns a RuleCreateRequest-ready payload.
      operationId: get_template_api_v1_alerts_templates__template_id__get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          title: Template Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts/metrics/catalog:
    get:
      tags:
      - Alerts V1
      summary: Metrics Catalog
      description: Full metrics catalog for the alerts editor.
      operationId: metrics_catalog_api_v1_alerts_metrics_catalog_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by entity type / category
          title: Category
        description: Filter by entity type / category
      - name: platform
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by platform: ''snowflake'' or ''databricks'''
          title: Platform
        description: 'Filter by platform: ''snowflake'' or ''databricks'''
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts/metrics/filters/{filter_key}/options:
    get:
      tags:
      - Alerts V1
      summary: Get Filter Options
      description: 'Load filter options dynamically for a given filter key.


        For searchable filters (e.g. tags), supports ``search``, ``page``, and ``size``

        query parameters for paginated search-as-you-type.'
      operationId: get_filter_options_api_v1_alerts_metrics_filters__filter_key__options_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: filter_key
        in: path
        required: true
        schema:
          type: string
          title: Filter Key
      - name: metric_name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric Name
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search pattern (tags filter)
          title: Search
        description: Search pattern (tags filter)
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (tags filter)
          default: 1
          title: Page
        description: Page number (tags filter)
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          description: Page size (tags filter)
          default: 20
          title: Size
        description: Page size (tags filter)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/alerts/admin/rules/{rule_id}/execute:
    post:
      tags:
      - Alerts V1
      summary: Admin Execute
      description: 'Execute any alert/report rule on demand (admin only).


        Restricted to the service user (email matching SERVICE_USER_EMAIL).

        Bypasses schedule and active/inactive status checks.

        Delegates to the Celery task for actual execution.


        Requires a `reason` (logged for audit) and accepts an optional

        `reference_time` to evaluate as if "now" were a different timestamp.'
      operationId: admin_execute_api_v1_alerts_admin_rules__rule_id__execute_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: integer
          title: Rule Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminExecuteRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ReportArtifactListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ReportArtifactResponse'
          type: array
          title: Items
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - items
      title: ReportArtifactListResponse
    AdminExecuteRequest:
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 1
          title: Reason
          description: Why this manual execution is needed (logged for audit).
        reference_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Reference Time
          description: Evaluate as if 'now' were this timestamp (ISO-8601). Defaults to UTC now.
      type: object
      required:
      - reason
      title: AdminExecuteRequest
      description: Request body for admin on-demand rule execution.
    RunResultResponse:
      properties:
        display_context:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Display Context
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
        rule_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rule Id
        metric_name:
          type: string
          title: Metric Name
        current_value:
          type: number
          title: Current Value
        previous_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Previous Value
        change:
          anyOf:
          - type: number
          - type: 'null'
          title: Change
        change_percent:
          anyOf:
          - type: number
          - type: 'null'
          title: Change Percent
