        schema:
          type: string
          format: date-time
          title: End Date
      - name: aggregation_level
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SummaryAggregationType'
          default: day
      - name: dimension
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Dimension
      - name: instance_id
        in: query
        required: false
        schema:
          type: string
          default: all
          title: Instance Id
      - name: username
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
