components:
  schemas:
    AIServiceSummaryItem:
      properties:
        service_type:
          type: string
          title: Service Type
        service_name:
          type: string
          title: Service Name
        total_cost:
          type: number
          title: Total Cost
        total_credits:
          type: number
          title: Total Credits
        record_count:
          type: integer
          title: Record Count
        percentage_of_total:
          type: number
          title: Percentage Of Total
      type: object
      required:
      - service_type
      - service_name
      - total_cost
      - total_credits
      - record_count
      - percentage_of_total
      title: AIServiceSummaryItem
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AIServicesSummaryResponse:
      properties:
        services:
          items:
            $ref: '#/components/schemas/AIServiceSummaryItem'
          type: array
          title: Services
        total_cost:
          type: number
          title: Total Cost
        currency:
          type: string
          title: Currency
      type: object
      required:
      - services
      - total_cost
      - currency
      title: AIServicesSummaryResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    AIServiceGraphPoint:
      properties:
        date:
          type: string
          format: date-time
          title: Date
        cost:
          type: number
          title: Cost
        credits:
          type: number
          title: Credits
        record_count:
          type: integer
          title: Record Count
      type: object
      required:
      - date
      - cost
      - credits
      - record_count
      title: AIServiceGraphPoint
    AIServiceFilterValuesResponse:
      properties:
        column:
          type: string
          title: Column
        values:
          items:
            type: string
          type: array
          title: Values
        total:
          type: integer
          title: Total
      type: object
      required:
      - column
      - values
      - total
      title: AIServiceFilterValuesResponse
    AIServiceGraphResponse:
      properties:
        service_type:
          type: string
          title: Service Type
        service_name:
          type: string
          title: Service Name
        graph:
          items:
            $ref: '#/components/schemas/AIServiceGraphPoint'
          type: array
          title: Graph
        total_cost:
          type: number
          title: Total Cost
        total_credits:
          type: number
          title: Total Credits
        currency:
          type: string
          title: Currency
      type: object
      required:
      - service_type
      - service_name
      - graph
      - total_cost
      - total_credits
      - currency
      title: AIServiceGraphResponse
    ColumnDefinition:
      properties:
        key:
          type: string
          title: Key
        label:
          type: string
          title: Label
        sortable:
          type: boolean
          title: Sortable
        data_type:
          type: string
          title: Data Type
        link_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Link Type
        filterable:
          type: boolean
          title: Filterable
          default: false
      type: object
      required:
      - key
      - label
      - sortable
      - data_type
      title: ColumnDefinition
    app__schemas__ai_services_detail__PaginationInfo:
      properties:
        page:
          type: integer
          title: Page
        pages:
          type: integer
          title: Pages
        size:
          type: integer
          title: Size
        total:
          type: integer
          title: Total
      type: object
      required:
      - page
      - pages
      - size
      - total
      title: PaginationInfo
    AIServiceBreakdownPoint:
      properties:
        date:
          type: string
          format: date-time
          title: Date
        dimension_value:
          type: string
          title: Dimension Value
        cost:
          type: number
          title: Cost
        credits:
          type: number
          title: Credits
      type: object
      required:
      - date
      - dimension_value
      - cost
      - credits
      title: AIServiceBreakdownPoint
    AIServiceType:
      type: string
      enum:
      - cortex_analyst
      - cortex_document_processing
      - cortex_fine_tuning
      - cortex_functions
      - cortex_search
      - cortex_code_cli
      - cortex_code_snowsight
      - cortex_agent
      - snowflake_intelligence
      - cortex_code_desktop
      - reader_ai_services
      - reader_ai_inference
      - reader_cortex_code_snowsight
      - ai_inference
      - ai_services_other
      title: AIServiceType
    SummaryAggregationType:
      type: string
      enum:
      - day
      - week
      - month
      title: SummaryAggregationType
    AIServiceBreakdownResponse:
      properties:
        service_type:
          type: string
          title: Service Type
        dimension:
          type: string
          title: Dimension
        available_dimensions:
          items:
            type: string
          type: array
          title: Available Dimensions
        data:
          items:
            $ref: '#/components/schemas/AIServiceBreakdownPoint'
          type: array
          title: Data
        pivoted_data:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Pivoted Data
        dimension_keys:
          items:
            type: string
          type: array
          title: Dimension Keys
        currency:
          type: string
          title: Currency
      type: object
      required:
      - service_type
      - dimension
      - available_dimensions
      - data
      - currency
      title: AIServiceBreakdownResponse
    AIServiceUsageResponse:
      properties:
        service_type:
          type: string
          title: Service Type
        data:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Data
        pagination:
          $ref: '#/components/schemas/app__schemas__ai_services_detail__PaginationInfo'
        columns:
          items:
            $ref: '#/components/schemas/ColumnDefinition'
          type: array
          title: Columns
      type: object
      required:
      - service_type
      - data
      - pagination
      - columns
      title: AIServiceUsageResponse
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
