          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Database Name
      - name: schema_name
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Schema Name
      - name: service_name
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Service Name
      - name: consumption_type
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Consumption Type
      - name: user_name
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: User Name
      - name: agent_name
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Agent Name
      - name: agent_database_name
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Agent Database Name
      - name: agent_schema_name
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Agent Schema Name
      - name: snowflake_intelligence_name
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Snowflake Intelligence Name
      - name: warehouse_name
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Warehouse Name
      - name: cost_filter
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Numeric cost filter value
          title: Cost Filter
        description: Numeric cost filter value
      - name: cost_filter_mode
        in: query
        required: false
        schema:
          type: string
          description: 'Cost filter mode: gt (greater than) or lt (less than)'
          default: gt
          title: Cost Filter Mode
        description: 'Cost filter mode: gt (greater than) or lt (less than)'
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIServiceUsageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai_services/{service_type}/filter_values:
    get:
      tags:
      - AI_SERVICES
      summary: Get Ai Service Filter Values
      description: Get distinct values for a filterable column.
      operationId: get_ai_service_filter_values_ai_services__service_type__filter_values_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: service_type
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AIServiceType'
      - name: column
        in: query
        required: true
        schema:
          type: string
          description: Column name to get distinct values for
          title: Column
        description: Column name to get distinct values for
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date-time
          title: End Date
      - name: instance_id
        in: query
        required: false
        schema:
          type: string
          default: all
          title: Instance Id
      - name: prefix
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Prefix search for values
          title: Prefix
        description: Prefix search for values
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Size
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIServiceFilterValuesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ai_services/{service_type}/breakdown:
    get:
      tags:
      - AI_SERVICES
