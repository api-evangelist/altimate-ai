      - name: operation_name
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Operation Name
      - name: database_name
        in: query
        required: false
        schema:
          anyOf:
          - type: array
