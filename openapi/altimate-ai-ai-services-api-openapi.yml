        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date-time
          title: End Date
      - name: instance_id
        in: query
        required: false
        schema:
          type: string
          default: all
          title: Instance Id
      - name: service_type
        in: query
        required: false
        schema:
