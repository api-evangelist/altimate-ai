              type: string
          - type: 'null'
          title: Username
      - name: model_name
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          title: Model Name
      - name: function_name
        in: query
        required: false
