openapi: 3.1.0
info:
  title: Fast ACCOUNT_COSTS AI_SERVICES API
  version: 0.1.0
tags:
- name: AI_SERVICES
paths:
  /ai_services/summary:
    get:
      tags:
      - AI_SERVICES
      summary: Get Ai Services Summary
      description: List all AI services with aggregated costs.
      operationId: get_ai_services_summary_ai_services_summary_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date-time
          title: End Date
      - name: instance_id
        in: query
        required: false
        schema:
          type: string
          default: all
          title: Instance Id
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sort By
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          default: desc
          title: Sort Order
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIServicesSummaryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
