components:
  schemas:
    EstimateSegmentTotalItem:
      properties:
        product:
          type: string
          title: Product
          description: Segment label for this category
        estimated_cost:
          type: number
          title: Estimated Cost
          description: Combined actual + projected cost for the whole period
        pct_of_total:
          type: number
          title: Pct Of Total
          description: Share of the estimate ``total`` (0–100, one decimal). Sums to ~100 across the breakdown.
      type: object
      required:
      - product
      - estimated_cost
      - pct_of_total
      title: EstimateSegmentTotalItem
      description: 'One segment''s combined (actual + projected) cost in the total estimate.

        Cost-only — the projection does not forecast DBUs.'
    DeploymentTypeTrendsResponse:
      properties:
        trends:
          items:
            $ref: '#/components/schemas/DeploymentTypeTrendItem'
          type: array
          title: Trends
          description: List of trend data by deployment type
        deployment_types:
          items:
            type: string
          type: array
          title: Deployment Types
          description: Unique deployment types for chart legend
        granularity:
          type: string
          title: Granularity
          description: Time granularity (day/week/month)
      type: object
      required:
      - trends
      - deployment_types
      - granularity
      title: DeploymentTypeTrendsResponse
      description: Response model for deployment type trends endpoint.
    CostComparisonResponse:
      properties:
        current_period_dbus:
          type: number
          title: Current Period Dbus
          description: DBUs in current period
        previous_period_dbus:
          type: number
          title: Previous Period Dbus
          description: DBUs in previous period
        current_period_cost:
          type: number
          title: Current Period Cost
          description: Cost in current period
        previous_period_cost:
          type: number
          title: Previous Period Cost
          description: Cost in previous period
        delta_dbus:
          type: number
          title: Delta Dbus
          description: Change in DBUs
        delta_cost:
          type: number
          title: Delta Cost
          description: Change in cost
        delta_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Delta Pct
          description: Percentage change
      type: object
      required:
      - current_period_dbus
      - previous_period_dbus
      - current_period_cost
      - previous_period_cost
      - delta_dbus
      - delta_cost
      title: CostComparisonResponse
      description: Response model for period comparison.
    CostEstimateTrendsResponse:
      properties:
        graph:
          items:
            $ref: '#/components/schemas/CostEstimateGraphItem'
          type: array
          title: Graph
          description: Graph data with actual and projected costs
        products:
          items:
            type: string
          type: array
          title: Products
          description: Canonical segment legend for the requested ``category``, in display order — includes segments with no data so the legend stays stable across date ranges.
        currency:
          type: string
          title: Currency
          description: Currency code
          default: USD
        category:
          anyOf:
          - $ref: '#/components/schemas/CategoryName'
          - type: 'null'
          description: Category the estimate was computed for
      type: object
      required:
      - graph
      title: CostEstimateTrendsResponse
      description: Response model for cost estimate/projection endpoint.
    CostCategory:
      type: string
      enum:
      - Compute
      - SQL
      - AI/ML
      - Data Platform
      - Infrastructure
      title: CostCategory
      description: Cost category classification for Databricks SKUs.
    ComputeEfficiencyResponse:
      properties:
        jobs_pct:
          type: number
          title: Jobs Pct
          description: Percentage of compute used by Jobs
        all_purpose_pct:
          type: number
          title: All Purpose Pct
          description: Percentage of compute used by All-Purpose
        efficiency_score:
          type: string
          title: Efficiency Score
          description: 'Efficiency rating: healthy (>70% jobs), moderate (50-70%), unhealthy (<50%)'
        compute_types:
          items:
            $ref: '#/components/schemas/ComputeTypeBreakdown'
          type: array
          title: Compute Types
          description: Breakdown by compute type
        deployment_types:
          items:
            $ref: '#/components/schemas/DeploymentTypeBreakdown'
          type: array
          title: Deployment Types
          description: Breakdown by deployment type (serverless vs provisioned)
        engine_types:
          items:
            $ref: '#/components/schemas/EngineTypeBreakdown'
          type: array
          title: Engine Types
          description: Breakdown by engine type (photon vs standard)
        total_dbus:
          type: number
          title: Total Dbus
          description: Total DBU consumption
        total_cost:
          type: number
          title: Total Cost
          description: Total estimated cost
      type: object
      required:
      - jobs_pct
      - all_purpose_pct
      - efficiency_score
      - compute_types
      - deployment_types
      - engine_types
      - total_dbus
      - total_cost
      title: ComputeEfficiencyResponse
      description: Response model for compute efficiency breakdown.
    WorkspaceEfficiencyItem:
      properties:
        workspace_id:
          type: string
          title: Workspace Id
          description: Databricks workspace ID
        workspace_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Name
          description: Workspace display name
        total_dbus:
          type: number
          title: Total Dbus
          description: Total DBU consumption
        estimated_cost:
          type: number
          title: Estimated Cost
          description: Estimated cost
        jobs_pct:
          type: number
          title: Jobs Pct
          description: Percentage of compute used by Jobs
        all_purpose_pct:
          type: number
          title: All Purpose Pct
          description: Percentage of compute used by All-Purpose
        serverless_pct:
          type: number
          title: Serverless Pct
          description: Percentage of compute that is serverless
        efficiency_score:
          type: string
          title: Efficiency Score
          description: 'Efficiency rating: healthy (>70% jobs), moderate (50-70%), unhealthy (<50%)'
      type: object
      required:
      - workspace_id
      - total_dbus
      - estimated_cost
      - jobs_pct
      - all_purpose_pct
      - serverless_pct
      - efficiency_score
      title: WorkspaceEfficiencyItem
      description: Efficiency metrics for a single workspace.
    ComputeTypeBreakdown:
      properties:
        compute_type:
          type: string
          title: Compute Type
          description: 'Compute type: jobs, all_purpose, sql, other'
        total_dbus:
          type: number
          title: Total Dbus
          description: Total DBUs for this compute type
        estimated_cost:
          type: number
          title: Estimated Cost
          description: Estimated cost for this compute type
        pct_of_total:
          type: number
          title: Pct Of Total
          description: Percentage of total cost
      type: object
      required:
      - compute_type
      - total_dbus
      - estimated_cost
      - pct_of_total
      title: ComputeTypeBreakdown
      description: Breakdown by compute type (jobs, all_purpose, sql, other).
    ProductEstimateTrendsResponse:
      properties:
        graph:
          items:
            $ref: '#/components/schemas/ProductEstimateItem'
          type: array
          title: Graph
          description: Graph data with actual and projected costs by product
        products:
          items:
            type: string
          type: array
          title: Products
          description: Unique product names for chart legend
        currency:
          type: string
          title: Currency
          description: Currency code
          default: USD
      type: object
      required:
      - graph
      - products
      title: ProductEstimateTrendsResponse
      description: Response model for product-level cost projection endpoint.
    WorkspaceEfficiencyResponse:
      properties:
        workspaces:
          items:
            $ref: '#/components/schemas/WorkspaceEfficiencyItem'
          type: array
          title: Workspaces
          description: List of workspace efficiency metrics
        total_dbus:
          type: number
          title: Total Dbus
          description: Total DBUs across all workspaces
        total_cost:
          type: number
          title: Total Cost
          description: Total cost across all workspaces
      type: object
      required:
      - workspaces
      - total_dbus
      - total_cost
      title: WorkspaceEfficiencyResponse
      description: Response model for workspace efficiency endpoint.
    WorkspacesResponse:
      properties:
        workspaces:
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
          type: array
          title: Workspaces
          description: List of workspaces
      type: object
      required:
      - workspaces
      title: WorkspacesResponse
      description: Response model for workspaces list endpoint.
    app__schemas__databricks__cost__CostBreakdownResponse:
      properties:
        breakdown:
          items:
            $ref: '#/components/schemas/CostBreakdownItem'
          type: array
          title: Breakdown
          description: Cost breakdown items
        group_by:
          type: string
          title: Group By
          description: Grouping dimension (sku/workspace/product)
        total_dbus:
          type: number
          title: Total Dbus
          description: Total DBUs across all groups
        total_cost:
          type: number
          title: Total Cost
          description: Total estimated cost
      type: object
      required:
      - breakdown
      - group_by
      - total_dbus
      - total_cost
      title: CostBreakdownResponse
      description: Response model for cost breakdown endpoint.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    CategoryBreakdownItem:
      properties:
        category:
          $ref: '#/components/schemas/CostCategory'
          description: Cost category
        total_dbus:
          type: number
          title: Total Dbus
          description: Total DBUs for this category
        estimated_cost:
          type: number
          title: Estimated Cost
          description: Estimated cost for this category
        pct_of_total:
          type: number
          title: Pct Of Total
          description: Percentage of total cost
      type: object
      required:
      - category
      - total_dbus
      - estimated_cost
      - pct_of_total
      title: CategoryBreakdownItem
      description: 'Legacy 5-bucket cost breakdown item (``Compute`` / ``SQL`` / ``AI/ML`` /

        ``Data Platform`` / ``Infrastructure``). Used by ``/cost/total`` and the

        Future-state estimate. Prefer ``CostCategoryItem`` for new endpoints.'
    CostOverviewResponse:
      properties:
        total_dbus:
          type: number
