components:
  schemas:
    SourceTable:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: SourceTable
    DownloadSignedUrlRequest:
      properties:
        s3_path:
          type: string
          title: S3 Path
      type: object
      required:
      - s3_path
      title: DownloadSignedUrlRequest
    ProjectIntegrationRequest:
      properties:
        name:
          type: string
          title: Name
        environment:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
        integration_type:
          anyOf:
          - $ref: '#/components/schemas/app__schemas__dbt__IntegrationType'
          - type: 'null'
          default: dbt_core
      type: object
      required:
      - name
      title: ProjectIntegrationRequest
    ColumnDescription:
      properties:
        column_name:
          type: string
          title: Column Name
        column_description:
          type: string
          title: Column Description
        column_citations:
          anyOf:
          - items:
              $ref: '#/components/schemas/Citation'
            type: array
          - type: 'null'
          title: Column Citations
      type: object
      required:
      - column_name
      - column_description
      title: ColumnDescription
    Citation:
      properties:
        id:
          type: string
          title: Id
        content:
          type: string
          title: Content
        taskLabel:
          type: string
          title: Tasklabel
      type: object
      required:
      - id
      - content
      - taskLabel
      title: Citation
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    DBTModel-Input:
      properties:
        model_name:
          type: string
          title: Model Name
        adapter:
          anyOf:
          - type: string
          - type: 'null'
          title: Adapter
        model_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Description
        compiled_sql:
          anyOf:
          - type: string
          - type: 'null'
          title: Compiled Sql
        schedule:
          anyOf:
          - type: string
          - type: 'null'
          title: Schedule
        columns:
          anyOf:
          - items:
              $ref: '#/components/schemas/Column'
            type: array
          - type: 'null'
          title: Columns
        dependencies:
          anyOf:
          - items:
              $ref: '#/components/schemas/DBTModel-Input'
            type: array
          - type: 'null'
          title: Dependencies
      type: object
      required:
      - model_name
      title: DBTModel
    CreateProjectIntegrationResponse:
      properties:
        dbt_core_integration_id:
          type: integer
          title: Dbt Core Integration Id
        integration_type:
          anyOf:
          - $ref: '#/components/schemas/app__schemas__dbt__IntegrationType'
          - type: 'null'
          default: dbt_core
      type: object
      required:
      - dbt_core_integration_id
      title: CreateProjectIntegrationResponse
    ModelNode:
      properties:
        database:
          anyOf:
          - type: string
          - type: 'null'
          title: Database
        schema_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Schema Name
        package_name:
