      title: OpportunityFinding
      description: 'A draft finding — the fields a real opportunity carries.


        Mirrors the tissues cost_savings_ops shape a published opportunity actually

        stores: a title, a description, the target resource(s), a monthly savings

        estimate, an effort level, and the Issue/Goal/Context ``agent_instructions``

        markdown shown in the opportunity detail''s "Agent Instructions" tab.'
