      title: CreateAgentResponse
    EditStudioOpportunityRequest:
      properties:
        opportunity_id:
          type: string
          title: Opportunity Id
        instance_id:
          type: integer
          title: Instance Id
        finding:
          $ref: '#/components/schemas/OpportunityFinding'
      type: object
      required:
      - opportunity_id
      - instance_id
      - finding
      title: EditStudioOpportunityRequest
      description: 'Body for ``PUT /studio/opportunities`` — edit an ALREADY-PUBLISHED

        opportunity in place.


        Unlike submit, this carries no ``session_id``: you are editing a published

        opportunity, not a draft anchored to a conversation. The published

        ``opportunity_id`` is derived from the primary resource, and ClickHouse

        ``opportunity_comments`` is keyed on it, so an edit that would change the

        primary resource is rejected (``primary_resource_immutable``) rather than

        silently orphaning comments, audit rows and implemented-snapshots.'
    ValidateStudioOpportunityResponse:
      properties:
        valid:
          type: boolean
          title: Valid
          default: true
        errors:
          items:
            $ref: '#/components/schemas/StudioOpportunityValidationErrorItem'
          type: array
          title: Errors
        warnings:
          items:
            $ref: '#/components/schemas/StudioOpportunityValidationErrorItem'
          type: array
          title: Warnings
        savings:
          anyOf:
          - $ref: '#/components/schemas/SavingsValidationReport'
          - type: 'null'
      type: object
      title: ValidateStudioOpportunityResponse
      description: '200 body for the pre-submit smoke test (``POST /studio/opportunities/validate``).


        Runs the publish gates (the primary resource must verify against tenant

        inventory), the description checks, and the savings-plausibility checks

        WITHOUT inserting anything. Blocking failures come back as a 422 with the

        same ``{errors: [{code, message}]}`` shape as submit; a pass returns this

        body. ``errors`` is always empty on a 200; ``warnings`` carry the

        non-blocking findings, and ``savings`` reports the basis of the verdict.'
    StudioOpportunityDetailResponse:
      properties:
        opportunity_id:
          type: string
          title: Opportunity Id
        instance_id:
          type: integer
          title: Instance Id
        finding:
          $ref: '#/components/schemas/OpportunityFinding'
        studio_created:
          type: boolean
          title: Studio Created
          default: false
      type: object
      required:
      - opportunity_id
      - instance_id
      - finding
      title: StudioOpportunityDetailResponse
      description: '``GET /studio/opportunities/detail`` — the published opportunity read back

        as the editable finding the form needs to pre-fill the Edit flow.'
    GetAgentResponse:
      properties:
        name:
          type: string
          title: Name
        version:
          type: integer
          title: Version
        prompt:
          type: string
          title: Prompt
        config:
          additionalProperties: true
          type: object
          title: Config
        labels:
