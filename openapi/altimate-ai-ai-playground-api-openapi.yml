          description: Day of week for weekly frequency (0=Sunday … 6=Saturday). Only meaningful when
            the patched frequency is 'weekly'. When the patched frequency stays/becomes 'weekly' and this
            field is omitted, the existing weekday is preserved.
        day_of_month:
          anyOf:
