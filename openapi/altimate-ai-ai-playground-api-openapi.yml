        Distinct from ``status`` (last-turn ``SessionStatusEnum``) and from the

        lifecycle ``SessionLifecycleStatus`` — this is a coarse three-state view

        the frontend maps to a spinner (running) / green dot (succeeded) / red dot

        (failed). Derived at read time from the last turn; see

        ``AIPlaygroundRepository.derive_run_status``.'
    BaseResponse:
