      - instance_id
      title: DeleteStudioOpportunityResponse
      description: '``DELETE /studio/opportunities`` — unpublish a Studio-created opportunity.


        A real delete (a ClickHouse mutation on both opportunity tables), not a

        status change: ``global_opportunities_aggregated`` aggregates ``status`` with

        ``max()``, so a soft-delete could never be undone through the insert path.'
