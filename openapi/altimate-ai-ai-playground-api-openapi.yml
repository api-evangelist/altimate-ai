      - bash
      - read
      - tool_use
      - tool_call
      - agent_outcome
      - text
      - error
      - opportunity_draft
      title: ContentType
    DeleteStudioOpportunityResponse:
      properties:
        opportunity_id:
          type: string
          title: Opportunity Id
        instance_id:
          type: integer
          title: Instance Id
        deleted:
          type: boolean
          title: Deleted
          default: true
      type: object
      required:
