          default: ''
      type: object
      title: DiscardStudioOpportunityResponse
      description: '``{discarded, resource_name}`` for a discarded draft.


        Idempotent: discarding a draft that is already gone is not a failure — the

        client ends up in the state it asked for either way. ``discarded`` still

        distinguishes "a block was stamped" from "nothing matched", because

        collapsing the card to a terminal Rejected state on a no-match would strand

        a still-live draft behind a dead card.'
    SharedSessionResponse:
