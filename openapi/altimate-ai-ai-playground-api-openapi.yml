openapi: 3.2.0
info:
  title: Fast AI PLAYGROUND API
  version: 0.1.0
tags:
- name: AI_PLAYGROUND
paths:
  /playground/share/shared/{share_id}:
    get:
      tags:
      - AI_PLAYGROUND
      summary: View Shared Session
      description: 'View a shared playground session.


        This is the public endpoint for viewing shared content.

        - ''anyone'' links: No authentication required

        - ''specific_people'' links: User must be authenticated and in the allowed list'
      operationId: view_shared_session_playground_share_shared__share_id__get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: share_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Share Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/share:
    post:
      tags:
      - AI_PLAYGROUND
      summary: Create Share
      description: 'Create a new share link for a playground session.


        - **session_id**: The session to share

        - **access_type**: ''anyone'' (public) or ''specific_people'' (restricted)

        - **expires_in_days**: Optional expiration (1-365 days)

        - **user_ids**: Required for ''specific_people'' access type

        - **title**: Optional title for the share link'
      operationId: create_share_playground_share_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareLinkCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - AI_PLAYGROUND
      summary: List Shares
      description: 'List share links.


        - If session_id is provided, returns share links for that session

        - Otherwise, returns all share links created by the current user'
      operationId: list_shares_playground_share_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/share/session/{session_id}:
    get:
      tags:
      - AI_PLAYGROUND
      summary: List Shares For Session
      description: List share links for a specific session.
      operationId: list_shares_for_session_playground_share_session__session_id__get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/share/{share_id}:
    get:
      tags:
      - AI_PLAYGROUND
      summary: Get Share
      description: Get details of a specific share link.
      operationId: get_share_playground_share__share_id__get
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: share_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Share Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - AI_PLAYGROUND
      summary: Delete Share
      description: Delete a share link.
      operationId: delete_share_playground_share__share_id__delete
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: share_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Share Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/share/slack:
    post:
      tags:
      - AI_PLAYGROUND
      summary: Share To Slack
      description: Share a Studio session to Slack via incoming webhook.
      operationId: share_to_slack_playground_share_slack_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareToSlackRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareToSlackResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - HTTPBearer: []
  /playground/sessions:
    get:
      tags:
      - AI_PLAYGROUND
      summary: Get Sessions
      description: Get all AI playground sessions for a user with pagination support for infinite scroll
      operationId: get_sessions_playground_sessions_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: search_text
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search Text
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number starting from 1
          default: 1
          title: Page
        description: Page number starting from 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Number of items per page
          default: 20
          title: Page Size
        description: Number of items per page
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SessionLifecycleListFilter'
          description: active (default), archived, or all (active+archived)
          default: active
        description: active (default), archived, or all (active+archived)
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/sessions/{session_id}:
    patch:
      tags:
      - AI_PLAYGROUND
      summary: Update Session Status
      description: 'Archive (``archived``), restore (``active``), or soft-delete

        (``deleted``) a single session owned by the authenticated user.

        Soft-deleted sessions remain in the database. It will be backed

        into s3 later.'
      operationId: update_session_status_playground_sessions__session_id__patch
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionStatusUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatusUpdateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - AI_PLAYGROUND
      summary: Get Session By Id
      description: Get a specific AI playground session by ID with its turns
      operationId: get_session_by_id_playground_sessions__session_id__get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/ask:
    post:
      tags:
      - AI_PLAYGROUND
      summary: Ask Session
      description: 'Ask a question in an AI playground session and get streaming response.


        The actual pipeline (security scan, output guard, service invocation,

        streaming) lives in ``app.service.ai_playground.ask_pipeline.run_ask_pipeline``

        so it can be reused by the playground scheduler worker without an HTTP

        callback. This endpoint is now a thin transport wrapper.'
      operationId: ask_session_playground_ask_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionAskRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/prompt/enhance:
    post:
      tags:
      - AI_PLAYGROUND
      summary: Enhance Prompt
      description: Enhance a user prompt - Temporary proxy to actual prompt enhancer
      operationId: enhance_prompt_playground_prompt_enhance_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptEnhancementRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptEnhancementResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - HTTPBearer: []
  /playground/session_to_pdf:
    post:
      tags:
      - AI_PLAYGROUND
      summary: Session To Pdf
      description: 'Generate a PDF report from the full conversation thread of a session.

        Includes all user questions and assistant answers.'
      operationId: session_to_pdf_playground_session_to_pdf_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionToPdfRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/opportunities/submit:
    post:
      tags:
      - AI_PLAYGROUND
      summary: Submit Studio Opportunity
      description: 'Publish a Studio → User opportunity from an editable draft (AI-7498).


        This is the SOLE publish path: the agent only proposes a draft, and this

        endpoint runs the full server-side gate pipeline before inserting into the

        ClickHouse opportunity tables. Gate failures come back as HTTP 422 with

        per-field ``{code, message}`` so the FE surfaces them inline on the form.'
      operationId: submit_studio_opportunity_playground_opportunities_submit_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitStudioOpportunityRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStudioOpportunityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/opportunities/validate:
    post:
      tags:
      - AI_PLAYGROUND
      summary: Validate Studio Opportunity
      description: 'Pre-submit smoke test for a Studio → User opportunity draft (AI-7498).


        Runs the full publish gates WITHOUT inserting: the primary resource must

        verify against tenant inventory, the description must be a description

        rather than a placeholder, and the estimated savings must be bounded by the

        resource''s actual last-30-day spend — cross-checked against the anchoring

        analysis turn when the session has one, and against the resource''s measured

        spend when it does not.


        Blocking failures come back as HTTP 422 with the same per-field

        ``{code, message}`` shape as submit, so the form reuses its error parser. A

        pass returns the non-blocking warnings plus ``savings``: the looked-up

        monthly spend, which evidence source was used, and the claim as a share of

        spend. NO ClickHouse insert, no side effects.


        Submit runs the identical gate, so a client cannot bypass these checks by

        skipping validate.'
      operationId: validate_studio_opportunity_playground_opportunities_validate_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitStudioOpportunityRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateStudioOpportunityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/opportunities/detail:
    get:
      tags:
      - AI_PLAYGROUND
      summary: Get Studio Opportunity
      description: 'Read a published Studio opportunity back as an editable draft (AI-7498).


        Pre-fills the Edit form. ``opportunity_id`` is a query parameter, not a path

        segment, because the id embeds the resource key and can contain slashes

        (``priority/``). ``studio_created`` tells the client whether the

        edit and delete routes will accept this opportunity at all.'
      operationId: get_studio_opportunity_playground_opportunities_detail_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: opportunity_id
        in: query
        required: true
        schema:
          type: string
          title: Opportunity Id
      - name: instance_id
        in: query
        required: true
        schema:
          type: integer
          title: Instance Id
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioOpportunityDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/opportunities:
    put:
      tags:
      - AI_PLAYGROUND
      summary: Edit Studio Opportunity
      description: 'Edit a published Studio opportunity in place (AI-7498).


        Re-runs the same gates as validate and submit — an edit can introduce an

        implausible savings figure as easily as a first publish — then writes a new

        higher-version row to both opportunity tables. Gate failures, an attempt to

        change the primary resource (which the id and the comments are keyed on), and

        an opportunity that was not created in Studio all come back as HTTP 422 with

        the ``{errors: [{code, message}]}`` shape the form already parses.'
      operationId: edit_studio_opportunity_playground_opportunities_put
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditStudioOpportunityRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStudioOpportunityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - AI_PLAYGROUND
      summary: Delete Studio Opportunity
      description: 'Unpublish a Studio-created opportunity (AI-7498).


        A real ClickHouse delete on both opportunity tables, not a status change:

        the aggregated table takes ``max(status)``, so a soft-delete written through

        the insert path could never be reversed. Restricted to opportunities that

        carry Studio provenance, so a pipeline-detected opportunity cannot be removed

        here — that comes back as HTTP 422 ``not_studio_created``.'
      operationId: delete_studio_opportunity_playground_opportunities_delete
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: opportunity_id
        in: query
        required: true
        schema:
          type: string
          title: Opportunity Id
      - name: instance_id
        in: query
        required: true
        schema:
          type: integer
          title: Instance Id
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteStudioOpportunityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/opportunities/discard:
    post:
      tags:
      - AI_PLAYGROUND
      summary: Discard Studio Opportunity
      description: 'Reject an in-flight Studio opportunity DRAFT (AI-8316).


        The mirror of submit: same feature gate, same service-user-only dependency,

        same session-ownership check. It stamps the draft block on the turn so the

        half-finished form stops re-rendering on every session load. It never

        touches a published opportunity, so it needs no ClickHouse client — use

        ``DELETE /studio/opportunities`` to unpublish.


        Idempotent: discarding a draft that is already gone still returns 200 with

        ``discarded: false``, so the client can say "nothing to reject" instead of

        collapsing a still-live draft behind a terminal card.'
      operationId: discard_studio_opportunity_playground_opportunities_discard_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscardStudioOpportunityRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscardStudioOpportunityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/session_to_email_mailing_list:
    post:
      tags:
      - AI_PLAYGROUND
      summary: Session To Email Mailing List
      description: 'Generate a PDF from the full conversation thread and send via email.


        Recipients are resolved from ``recipient_type``:

        - ``specific_emails``: the explicit, regex-validated ``emails`` list (To)

        - ``all_altimate_users``: every active tenant user (BCC fan-out)

        - ``team``: active members of the selected teams (BCC fan-out)'
      operationId: session_to_email_mailing_list_playground_session_to_email_mailing_list_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionToEmailRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/cancel:
    post:
      tags:
      - AI_PLAYGROUND
      summary: Cancel Session
      description: Cancel an active AI playground session
      operationId: cancel_session_playground_cancel_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/agents:
    get:
      tags:
      - AI_PLAYGROUND
      summary: List Agents
      description: 'List all production agents from Langfuse.


        Service user only (public tenant): agent prompts live in one shared

        Langfuse project across all tenants, so they are neither readable nor

        writable by tenant users.


        Fetches the agent names from the ''agent-names'' prompt config,

        then retrieves full details (name, version, prompt, config, labels) for each agent.'
      operationId: list_agents_playground_agents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
      security:
      - HTTPBearer: []
      - HTTPBearer: []
    post:
      tags:
      - AI_PLAYGROUND
      summary: Create Or Update Agent
      description: 'Create or update an agent definition in Langfuse.


        Service user only (public tenant): this rewrites the system prompt driving

        the Copilot for every tenant.


        Note: We use create_prompt for both create and update because:

        - create_prompt automatically creates a new version if the name exists

        - update_prompt only modifies labels on existing versions, not content'
      operationId: create_or_update_agent_playground_agents_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
    delete:
      tags:
      - AI_PLAYGROUND
      summary: Delete Agent
      description: 'Deprecate an agent by removing it from production and marking as deprecated.


        Service user only (public tenant) — this retires an agent for every tenant.'
      operationId: delete_agent_playground_agents_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAgentRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
  /playground/agents/{agent_name}:
    get:
      tags:
      - AI_PLAYGROUND
      summary: Get Agent
      description: 'Get an agent definition from Langfuse.


        Service user only (public tenant) — see list_agents.'
      operationId: get_agent_playground_agents__agent_name__get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: agent_name
        in: path
        required: true
        schema:
          type: string
          title: Agent Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /playground/agents/production/add:
    post:
      tags:
      - AI_PLAYGROUND
      summary: Add Agent To Production
      description: 'Add an agent to the production agents list (agent-names config.agents).


        Service user only (public tenant) — this promotes an agent for every tenant.'
      operationId: add_agent_to_production_playground_agents_production_add_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAgentToProductionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
  /playground/agents/production/remove:
    post:
      tags:
      - AI_PLAYGROUND
      summary: Remove Agent From Production
      description: 'Remove an agent from the production agents list (agent-names config.agents).


        Service user only (public tenant) — this demotes an agent for every tenant.'
      operationId: remove_agent_from_production_playground_agents_production_remove_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveAgentFromProductionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - HTTPBearer: []
