      description: "Get comprehensive table metadata, statistics, and clustering information.\n\nThis\
        \ endpoint provides all data needed for table optimization analysis:\n- Table metadata (schema,\
        \ columns, data types)\n- Table statistics (storage, read/write counts, costs)\n- Clustering information\
        \ (if clustering keys exist)\n\nArgs:\n    request: Contains fully_qualified_names (list of database.schema.table)\n\
        \             and optional instance_id\n\nReturns:\n    Dictionary with table names as keys and\
        \ optimization data as values"
      operationId: get_table_metadata_endpoint_copilot_quickchat_table_metadata_post
