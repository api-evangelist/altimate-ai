openapi: 3.2.0
info:
  title: Fast Copilot API
  version: 0.1.0
tags:
- name: Copilot
paths:
  /copilot/tables:
    get:
      tags:
      - Copilot
      summary: Get Tables
      description: 'Gets all violations.

        - table_id: search parameter'
      operationId: get_tables_copilot_tables_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Get Tables Copilot Tables Get
        '400':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Get Tables Copilot Tables Get
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Get Tables Copilot Tables Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /copilot/session:
    get:
      tags:
      - Copilot
      summary: Get Session History
      description: 'Gets all violations.

        - table_id: search parameter'
      operationId: get_session_history_copilot_session_get
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Get Session History Copilot Session Get
        '400':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Get Session History Copilot Session Get
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Get Session History Copilot Session Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /copilot/quickchat/query-analysis/v2/{query_id}:
    post:
      tags:
      - Copilot
      summary: Analyze Query V2
      description: 'Analyze a SQL query and provide optimization recommendations


        Args:

        query_id: The query ID to analyze

        instance_id: The Snowflake instance ID'
      operationId: analyze_query_v2_copilot_quickchat_query_analysis_v2__query_id__post
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: query_id
        in: path
        required: true
        schema:
          type: string
          title: Query Id
      - name: instance_id
        in: query
        required: false
        schema:
          type: string
          title: Instance Id
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Analyze Query V2 Copilot Quickchat Query Analysis V2  Query Id  Post
        '400':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Analyze Query V2 Copilot Quickchat Query Analysis V2  Query Id  Post
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Analyze Query V2 Copilot Quickchat Query Analysis V2  Query Id  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /copilot/quickchat/table-analysis/v2/{table_name}:
    post:
      tags:
      - Copilot
      summary: Analyze Table V2
      description: 'Analyze a Snowflake table and provide optimization recommendations


        Args:

        table_name: The complete table name (db.schema.table)

        instance_id: The Snowflake instance ID'
      operationId: analyze_table_v2_copilot_quickchat_table_analysis_v2__table_name__post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: table_name
        in: path
        required: true
        schema:
          type: string
          title: Table Name
      - name: instance_id
        in: query
        required: false
        schema:
          type: string
          title: Instance Id
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Analyze Table V2 Copilot Quickchat Table Analysis V2  Table Name  Post
        '400':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Analyze Table V2 Copilot Quickchat Table Analysis V2  Table Name  Post
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Analyze Table V2 Copilot Quickchat Table Analysis V2  Table Name  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /copilot/quickchat/query-analysis/v2/plain/{query_id}:
    post:
      tags:
      - Copilot
      summary: Analyze Query V2
      description: 'Analyze a SQL query and provide optimization recommendations


        Args:

        query_id: The query ID to analyze

        instance_id: The Snowflake instance ID'
      operationId: analyze_query_v2_copilot_quickchat_query_analysis_v2_plain__query_id__post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: query_id
        in: path
        required: true
        schema:
          type: string
          title: Query Id
      - name: instance_id
        in: query
        required: false
        schema:
          type: string
          title: Instance Id
      - name: include_sql
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Include Sql
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Analyze Query V2 Copilot Quickchat Query Analysis V2 Plain  Query Id  Post
        '400':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Analyze Query V2 Copilot Quickchat Query Analysis V2 Plain  Query Id  Post
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Analyze Query V2 Copilot Quickchat Query Analysis V2 Plain  Query Id  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /copilot/quickchat/table-analysis/v2/plain/{table_name}:
    post:
      tags:
      - Copilot
      summary: Analyze Table V2
      description: 'Analyze a SQL query and provide optimization recommendations


        Args:

        query_id: The query ID to analyze

        instance_id: The Snowflake instance ID'
      operationId: analyze_table_v2_copilot_quickchat_table_analysis_v2_plain__table_name__post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: table_name
        in: path
        required: true
        schema:
          type: string
          title: Table Name
      - name: instance_id
        in: query
        required: false
        schema:
          type: string
          title: Instance Id
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Analyze Table V2 Copilot Quickchat Table Analysis V2 Plain  Table Name  Post
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Analyze Table V2 Copilot Quickchat Table Analysis V2 Plain  Table Name  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /copilot/quickchat/query-static-analysis:
    post:
      tags:
      - Copilot
      summary: Analyze Query Static Endpoint
      description: 'Perform static analysis on a SQL query without executing it.


        This endpoint analyzes the query structure to identify potential issues

        such as SELECT *, functions in JOIN/filter conditions, missing LIMIT,

        and Cartesian products.


        Args:

        request: Contains the SQL query and optional dialect (default: snowflake)


        Returns:

        Analysis results with identified issues and recommendations'
      operationId: analyze_query_static_endpoint_copilot_quickchat_query_static_analysis_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaticQueryAnalysisRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticQueryAnalysisResponse'
        '400':
          description: Invalid SQL query
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Analyze Query Static Endpoint Copilot Quickchat Query Static Analysis Post
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Analyze Query Static Endpoint Copilot Quickchat Query Static Analysis Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /copilot/quickchat/table-metadata:
    post:
      tags:
      - Copilot
      summary: Get Table Metadata Endpoint
      description: 'Get comprehensive table metadata, statistics, and clustering information.


        This endpoint provides all data needed for table optimization analysis:

        - Table metadata (schema, columns, data types)

        - Table statistics (storage, read/write counts, costs)

        - Clustering information (if clustering keys exist)


        Args:

        request: Contains fully_qualified_names (list of database.schema.table)

        and optional instance_id


        Returns:

        Dictionary with table names as keys and optimization data as values'
      operationId: get_table_metadata_endpoint_copilot_quickchat_table_metadata_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableMetadataRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid table name
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Get Table Metadata Endpoint Copilot Quickchat Table Metadata Post
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Get Table Metadata Endpoint Copilot Quickchat Table Metadata Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /copilot/quickchat/query-optimization-guide:
    get:
      tags:
      - Copilot
      summary: Get Query Optimization Guide Endpoint
      description: 'Get the query optimization guide for a specific SQL dialect.


        This endpoint returns best practices, workflow guidelines, and anti-patterns

        to avoid when optimizing queries.'
      operationId: get_query_optimization_guide_endpoint_copilot_quickchat_query_optimization_guide_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: dialect
        in: query
        required: false
        schema:
          type: string
          description: SQL dialect (currently only snowflake supported)
          default: snowflake
          title: Dialect
        description: SQL dialect (currently only snowflake supported)
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Get Query Optimization Guide Endpoint Copilot Quickchat Query Optimization Guide Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    StaticQueryIssue:
      properties:
        type:
          type: string
          title: Type
        severity:
          type: string
          title: Severity
        message:
          type: string
          title: Message
        recommendation:
          type: string
          title: Recommendation
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        disclaimer:
          anyOf:
          - type: string
          - type: 'null'
          title: Disclaimer
      type: object
      required:
      - type
      - severity
      - message
      - recommendation
      title: StaticQueryIssue
      description: Individual issue found in static analysis.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    TableMetadataRequest:
      properties:
        fully_qualified_names:
          items:
            type: string
          type: array
          title: Fully Qualified Names
        instance_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Instance Id
      type: object
      required:
      - fully_qualified_names
      title: TableMetadataRequest
      description: Request schema for table metadata and statistics.
    StaticQueryAnalysisRequest:
      properties:
        sql:
          type: string
          title: Sql
        dialect:
          anyOf:
          - type: string
          - type: 'null'
          title: Dialect
          default: snowflake
      type: object
      required:
      - sql
      title: StaticQueryAnalysisRequest
      description: Request schema for static query analysis.
    StaticQueryAnalysisResponse:
      properties:
        success:
          type: boolean
          title: Success
        query:
          anyOf:
          - type: string
          - type: 'null'
          title: Query
        dialect:
          anyOf:
          - type: string
          - type: 'null'
          title: Dialect
        issues:
          items:
            $ref: '#/components/schemas/StaticQueryIssue'
          type: array
          title: Issues
          default: []
        issue_count:
          type: integer
          title: Issue Count
          default: 0
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - success
      title: StaticQueryAnalysisResponse
      description: Response schema for static query analysis.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
