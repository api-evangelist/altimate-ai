  /copilot/quickchat/query-static-analysis:
    post:
      tags:
      - Copilot
      summary: Analyze Query Static Endpoint
      description: "Perform static analysis on a SQL query without executing it.\n\nThis endpoint analyzes\
        \ the query structure to identify potential issues\nsuch as SELECT *, functions in JOIN/filter\
        \ conditions, missing LIMIT,\nand Cartesian products.\n\nArgs:\n    request: Contains the SQL\
        \ query and optional dialect (default: snowflake)\n\nReturns:\n    Analysis results with identified\
        \ issues and recommendations"
      operationId: analyze_query_static_endpoint_copilot_quickchat_query_static_analysis_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaticQueryAnalysisRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaticQueryAnalysisResponse'
        '400':
          description: Invalid SQL query
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Analyze Query Static Endpoint Copilot Quickchat Query Static Analysis
                  Post
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Analyze Query Static Endpoint Copilot Quickchat Query Static Analysis
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
