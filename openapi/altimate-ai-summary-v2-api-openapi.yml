      title: ServerlessGraphResponse
      description: 'One row of the serverless cost breakdown chart.


        Value fields mirror ``ServerlessBreakdownList`` in ``app/constants.py``

        (27 categories) plus an ``other`` catch-all. The 8 high-materiality

        categories — snowpark_container_services, trust_center, replication,

        sensitive_data_classification, data_quality_monitoring,

        reader_data_transfer, serverless_tasks, snowpipe_streaming — also get

        ``percentage_*`` siblings because they are surfaced as top-level rows

        in the FE tooltip. The remaining 13 tail categories intentionally

        omit ``percentage_*`` — they fold into the FE-derived ``other`` row

        (see altimate-frontend#2692). When the enum gains a new entry, add the

        matching ``Optional[float]`` value/estimate pair here; only add a

        ``percentage_*`` field if the FE also promotes the category to a

        top-level tooltip row.'
    ChartType:
      type: string
      enum:
      - current
      - future
      title: ChartType
