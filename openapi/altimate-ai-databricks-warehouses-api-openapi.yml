        Matches the existing Databricks response convention

        (``total_count`` / ``page`` / ``page_size`` / ``total_pages``)

        rather than ``fastapi_pagination.Page[T]`` — none of the other

        Databricks endpoints in this router use the latter.


        Shared by the job-cluster history endpoint and the all-purpose-cluster

        history endpoint (``cluster_auto_tune_api.py``). Both populate

        ``reason_detail`` from stored audit evidence; a row with nothing to

        explain carries ``reason_detail=None`` and the FE falls back to

        ``actionable_message`` / ``reason``.'
    WarehouseFilterOptions:
