        required: true
        schema:
          type: integer
          description: Tenant instance ID (workspace) the warehouse runs in
          title: Instance Id
        description: Tenant instance ID (workspace) the warehouse runs in
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          description: Required Databricks workspace_id — see the toggle/status endpoints.
          title: Workspace Id
        description: Required Databricks workspace_id — see the toggle/status endpoints.
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseAutoTuneConfigRequest'
      responses:
        '200':
          description: Successful Response
          content:
