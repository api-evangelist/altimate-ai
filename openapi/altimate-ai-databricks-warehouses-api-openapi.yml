  /api/v1/databricks/warehouses/{warehouse_id}/auto-tune/history:
    get:
      tags:
      - Databricks Warehouses
      summary: Paginated auto-tune audit history for a SQL warehouse
      description: 'Read-only audit history for the SQL-warehouse Auto Tune tab.


        Most-recent first. Each row carries a server-composed ``event_message``

        (+ optional ``reason`` accordion detail) built from the audit

        ``attributes`` via ``compose_warehouse_event_message`` so the FE renders

        one string verbatim, mirroring the jobs history + Snowflake designs.'
      operationId: get_warehouse_auto_tune_history_endpoint_api_v1_databricks_warehouses__warehouse_id__auto_tune_history_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: warehouse_id
        in: path
        required: true
        schema:
          type: string
          title: Warehouse Id
      - name: instance_id
        in: query
        required: true
        schema:
          type: integer
          description: Tenant instance ID (workspace) the warehouse runs in
          title: Instance Id
        description: Tenant instance ID (workspace) the warehouse runs in
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          description: Required Databricks workspace_id — scopes the audit query to the correct workspace (defends against cross-workspace warehouse_id collisions).
          title: Workspace Id
        description: Required Databricks workspace_id — scopes the audit query to the correct workspace (defends against cross-workspace warehouse_id collisions).
      - name: event_types
        in: query
        required: false
        schema:
          anyOf:
