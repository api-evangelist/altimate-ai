          type: integer
          title: Total Count
      type: object
      required:
      - candidates
      - total_count
      title: ServerlessCandidatesResponse
      description: Response for serverless candidates.
    app__schemas__databricks__warehouse__WarehouseCostResponse:
      properties:
        warehouse_id:
          type: string
          title: Warehouse Id
        total_dbus:
          type: number
          title: Total Dbus
          default: 0
        estimated_cost:
