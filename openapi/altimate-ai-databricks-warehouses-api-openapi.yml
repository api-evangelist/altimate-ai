components:
  schemas:
    WarehouseAutoTuneAxisStatus:
      properties:
        auto_tune_mode:
          type: string
          enum:
          - enabled
          - disabled
          title: Auto Tune Mode
        backoff_configuration:
          anyOf:
          - $ref: '#/components/schemas/WarehouseAutoTuneBackoffConfiguration'
          - type: 'null'
        current_value:
          anyOf:
          - {}
          - type: 'null'
          title: Current Value
        active_recommendation:
          anyOf:
          - $ref: '#/components/schemas/WarehouseAutoTuneAxisActiveRecommendation'
          - type: 'null'
        monitoring:
          anyOf:
          - $ref: '#/components/schemas/WarehouseAutoTuneAxisMonitoring'
          - type: 'null'
        last_event:
          anyOf:
          - $ref: '#/components/schemas/WarehouseAutoTuneLastEvent'
          - type: 'null'
        pending_apply:
          type: boolean
          title: Pending Apply
          default: false
        enable_preflight:
          anyOf:
          - $ref: '#/components/schemas/WarehouseAutoTuneEnablePreflight'
          - type: 'null'
      type: object
      required:
      - auto_tune_mode
      title: WarehouseAutoTuneAxisStatus
      description: 'One non-auto-terminate axis''s status block. No

        current_auto_stop_mins — that is warehouse-level and stays top-level

        only. ``enable_preflight`` IS axis-level: each axis is enableable only

        while it has something to apply, so the gate has to be reported per

        axis rather than folded into the warehouse-level preflight.'
    WarehouseAutoTuneAxisMonitoring:
      properties:
        applied_at:
          type: string
          format: date-time
          title: Applied At
        window_ends_at:
          type: string
          format: date-time
          title: Window Ends At
        stable_value:
          anyOf:
          - {}
          - type: 'null'
          title: Stable Value
        last_bad_value:
          anyOf:
          - {}
          - type: 'null'
          title: Last Bad Value
      type: object
      required:
      - applied_at
      - window_ends_at
      title: WarehouseAutoTuneAxisMonitoring
      description: 'Axis-generic counterpart to WarehouseAutoTuneMonitoring — same

        shape, generic field names so a resize cluster_size string and an

        auto-terminate auto_stop_mins int both fit.'
    WarehouseAutoTuneLastEvent:
      properties:
        event_type:
          type: string
          title: Event Type
        change_timestamp:
          type: string
          format: date-time
          title: Change Timestamp
      type: object
      required:
      - event_type
      - change_timestamp
      title: WarehouseAutoTuneLastEvent
      description: 'The most recent audit event for this warehouse, for a lightweight

        "last changed" display without a full audit-history fetch.'
    WarehouseStateChange:
      properties:
        warehouse_id:
          type: string
          title: Warehouse Id
        warehouse_name:
          type: string
          title: Warehouse Name
        state:
          type: string
          title: State
        change_time:
          type: string
          format: date-time
          title: Change Time
        num_clusters:
          anyOf:
          - type: integer
          - type: 'null'
          title: Num Clusters
      type: object
      required:
      - warehouse_id
      - warehouse_name
      - state
      - change_time
      title: WarehouseStateChange
      description: A single state change record.
    WarehouseCostPoint:
      properties:
        period:
          type: string
          title: Period
        total_dbus:
          type: number
          title: Total Dbus
          default: 0
        estimated_cost:
          type: number
          title: Estimated Cost
          default: 0
        avg_cluster_count:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Cluster Count
      type: object
      required:
      - period
      title: WarehouseCostPoint
      description: Single data point for warehouse cost timeseries.
    WarehouseAutoTuneEnablePreflight:
      properties:
        blocked:
          type: boolean
          title: Blocked
          default: false
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        actionable_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Actionable Message
        can_manage_blocked:
          type: boolean
          title: Can Manage Blocked
          default: false
        turn_off_allowed:
          type: boolean
          title: Turn Off Allowed
          default: false
      type: object
      title: WarehouseAutoTuneEnablePreflight
      description: 'Whether the SP can currently enable auto-tune on this warehouse.


        Surfaced on the status response so the FE can render the Auto Tune

        Switch disabled with a persistent reason (instead of a momentary toast

        on a failed enable) when the service principal lacks CAN_MANAGE.

        Fail-open: any credential/read/timeout error leaves ``blocked=False``

        (the hard enable-gate in the toggle path still protects the mutation).


        Used in two positions. Top-level it is the AUTO STOP axis''s own enable

        gate: CAN_MANAGE is folded in, plus Auto Stop''s

        ``no_active_recommendation``. It does not speak for Warehouse Sizing.

        ``can_manage_blocked`` is the only warehouse-wide half: when true the SP

        cannot edit this warehouse at all, so no axis can be enabled. A top-level

        ``blocked`` with ``can_manage_blocked`` false only means Auto Stop has

        nothing to apply; Warehouse Sizing may still be enableable. Each axis

        block''s ``enable_preflight`` is that axis''s own gate.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WarehouseAutoTuneBackoffConfiguration:
      properties:
        max_latency_percentage:
          type: number
          maximum: 1000.0
          minimum: 110.0
          title: Max Latency Percentage
          description: Backoff triggers when live p95 latency exceeds this percentage of the pre-apply baseline for the sustained-breach window.
          default: 150.0
        max_queue_time_percentage:
          type: number
          maximum: 1000.0
          minimum: 110.0
          title: Max Queue Time Percentage
          description: Backoff triggers when live p95 queue time (cold-start + at-capacity) exceeds this percentage of the pre-apply baseline.
          default: 150.0
        trigger_action:
          type: string
          const: rollback
          title: Trigger Action
          description: What a backoff does. Always 'rollback' (step back to the last config that ran clean); any other stored value reads as 'rollback'.
          default: rollback
      type: object
      title: WarehouseAutoTuneBackoffConfiguration
      description: 'User-configured backoff thresholds for the 7-day post-apply monitor.


        Mirrors Snowflake''s ``BackoffConfiguration`` shape (percentages, not

        raw ratios) but adds bounds validation Snowflake''s never had — a

        threshold below 110% would trigger backoff on ordinary noise, and an

        absurdly high one (past 1000%) defeats the monitor''s purpose

        entirely. Both default to 150 (allow up to 1.5x the baseline before

        treating it as a regression).'
    app__schemas__databricks__warehouse__WarehouseRunningStatsTrendsResponse:
      properties:
        warehouse_id:
          type: string
          title: Warehouse Id
        trends:
          items:
            $ref: '#/components/schemas/WarehouseRunningStatsPoint'
          type: array
          title: Trends
          description: Daily active/idle time data points
        granularity:
          type: string
          title: Granularity
          description: Time granularity (day)
        total_active_seconds:
          type: integer
          title: Total Active Seconds
          description: Total active time
          default: 0
        total_idle_seconds:
          type: integer
          title: Total Idle Seconds
          description: Total idle time
          default: 0
      type: object
      required:
      - warehouse_id
      - trends
      - granularity
      title: WarehouseRunningStatsTrendsResponse
      description: Response for warehouse running stats trends over time.
    ClusterAutoTuneToggleEventsResponse:
      properties:
        events:
          items:
            $ref: '#/components/schemas/ClusterAutoTuneToggleEvent'
          type: array
          title: Events
      type: object
      title: ClusterAutoTuneToggleEventsResponse
      description: List response for ``GET /auto-tune/toggle-events``.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    WarehouseAutoTuneSavingsTrendsResponse:
      properties:
        warehouse_id:
          type: string
          title: Warehouse Id
        actual:
          items:
            $ref: '#/components/schemas/WarehouseAutoTuneSavingsTrendPoint'
          type: array
          title: Actual
          default: []
        potential:
          items:
            $ref: '#/components/schemas/WarehouseAutoTuneSavingsTrendPoint'
          type: array
          title: Potential
          default: []
        granularity:
          type: string
          title: Granularity
      type: object
      required:
      - warehouse_id
      - granularity
      title: WarehouseAutoTuneSavingsTrendsResponse
      description: 'Per-period auto-tune savings for a SQL warehouse, split into realized

        and potential.


        ``actual`` holds savings while an applied auto-tune recommendation (e.g.

        a lowered auto-stop) was in effect; ``potential`` holds the savings an

        active, not-yet-applied recommendation would have earned over the same

        window. Sourced from ClickHouse ``dbx_auto_tune_cost_savings``.'
    WarehouseAutoTuneStatusResponse:
      properties:
        auto_tune_mode:
          type: string
          enum:
          - enabled
          - disabled
          title: Auto Tune Mode
        backoff_configuration:
          anyOf:
          - $ref: '#/components/schemas/WarehouseAutoTuneBackoffConfiguration'
          - type: 'null'
        current_auto_stop_mins:
          anyOf:
          - type: integer
          - type: 'null'
          title: Current Auto Stop Mins
          description: Live-read from Databricks; None on a read failure (never guessed).
        active_recommendation:
          anyOf:
          - $ref: '#/components/schemas/WarehouseAutoTuneActiveRecommendation'
          - type: 'null'
        monitoring:
          anyOf:
          - $ref: '#/components/schemas/WarehouseAutoTuneMonitoring'
          - type: 'null'
        last_event:
          anyOf:
          - $ref: '#/components/schemas/WarehouseAutoTuneLastEvent'
          - type: 'null'
        preflight:
          $ref: '#/components/schemas/WarehouseAutoTuneEnablePreflight'
        pending_apply:
          type: boolean
          title: Pending Apply
          default: false
        resize:
          anyOf:
          - $ref: '#/components/schemas/WarehouseAutoTuneAxisStatus'
          - type: 'null'
        axis_flags:
          anyOf:
          - additionalProperties:
              type: boolean
            type: object
          - type: 'null'
          title: Axis Flags
        annualized_cost_savings_usd:
          anyOf:
          - type: number
          - type: 'null'
          title: Annualized Cost Savings Usd
        realized_savings_usd:
          anyOf:
          - type: number
          - type: 'null'
          title: Realized Savings Usd
        additional_potential_savings_usd_per_month:
          anyOf:
          - type: number
          - type: 'null'
          title: Additional Potential Savings Usd Per Month
      type: object
      required:
      - auto_tune_mode
      title: WarehouseAutoTuneStatusResponse
      description: 'Response for ``GET /databricks/warehouses/{id}/auto-tune/status``.


        This is the FE''s contract for the warehouse detail page''s Auto Tune

        panel — every field is intentionally optional/nullable so a

        never-touched warehouse (no config row, no recommendation, no

        history) still returns a well-formed 200 rather than a 404.'
    WarehouseAutoTuneConfigRequest:
      properties:
        notification_config:
          $ref: '#/components/schemas/ClusterAutoTuneNotificationConfig'
      additionalProperties: false
      type: object
      title: WarehouseAutoTuneConfigRequest
      description: 'Request body for ``PATCH /databricks/warehouses/{id}/auto-tune/config``.


        Notification preferences ONLY — SQL-warehouse backoff keeps its own

        shipped storage/endpoints (``WarehouseAutoTuneBackoffConfiguration`` via

        the ``/auto-tune/toggle`` request). ``extra="forbid"`` rejects a

        ``backoff_policy`` key with a 422 instead of silently ignoring it, so a

        caller can never mistake this route for a way to touch warehouse

        backoff thresholds.'
    WarehouseRunningStatsPoint:
      properties:
        period:
          type: string
          title: Period
        active_seconds:
          type: integer
          title: Active Seconds
          default: 0
        idle_seconds:
          type: integer
          title: Idle Seconds
          default: 0
      type: object
      required:
      - period
      title: WarehouseRunningStatsPoint
      description: Single data point for warehouse running stats timeseries.
    WarehouseAutoTuneToggleRequest:
      properties:
        enabled:
          type: boolean
          title: Enabled
          description: Desired auto-tune state for the warehouse.
        instance_id:
          type: integer
          title: Instance Id
          description: Tenant instance ID (workspace) the warehouse runs in.
        workspace_id:
          type: string
          minLength: 1
          title: Workspace Id
          description: Required Databricks workspace_id. Scopes credential resolution to the correct workspace on multi-workspace tenants (defends against cross-workspace warehouse_id collisions) AND is the join key the ingestion cost-savings mart (``mrt_auto_tune_cost_savings``) uses to attribute realized savings on ``(workspace_id, entity_id)``. An empty or mismatched value silently drops all ``actual`` savings for this warehouse.
        backoff_configuration:
          anyOf:
          - $ref: '#/components/schemas/WarehouseAutoTuneBackoffConfiguration'
          - type: 'null'
          description: Backoff thresholds for this warehouse. Only meaningful on enable (or to update thresholds on an already-enabled warehouse); ignored on disable. Defaults applied when omitted.
        rec_type:
          type: string
          enum:
          - resize
          - auto_terminate
          title: Rec Type
          description: Which axis this toggle targets. Defaults to auto_terminate so every existing caller is unaffected — this is NOT a master toggle that flips both axes (contrast the all-purpose-cluster path's rec_type=None semantics).
          default: auto_terminate
      type: object
      required:
      - enabled
      - instance_id
      - workspace_id
      title: WarehouseAutoTuneToggleRequest
      description: Request body for ``POST /databricks/warehouses/{id}/auto-tune/toggle``.
    WarehouseQueryMetricsTimelineResponse:
      properties:
        warehouse_id:
          type: string
          title: Warehouse Id
        granularity:
          type: string
          title: Granularity
        timeline:
          items:
            $ref: '#/components/schemas/WarehouseQueryMetricsTimelinePoint'
          type: array
          title: Timeline
          default: []
        ch_data_through:
          anyOf:
          - type: string
          - type: 'null'
          title: Ch Data Through
        live_tail_used:
          type: boolean
          title: Live Tail Used
          default: false
      type: object
      required:
      - warehouse_id
      - granularity
      title: WarehouseQueryMetricsTimelineResponse
      description: 'Response for the SQL warehouse Monitoring page''s metrics timeline.


        ``ch_data_through`` is the observed ClickHouse-mirror freshness cutover

        used to route the query-history source between ClickHouse and a live

        Databricks-system-tables tail (``None`` if that mirror has never

        ingested a row for this tenant). ``live_tail_used`` is true if the

        query-metrics source actually pulled rows from the live tail for this

        response. Additive fields — the frontend schema tolerates extra

        optional keys.'
    ServerlessCandidate:
      properties:
        warehouse_id:
          type: string
          title: Warehouse Id
        warehouse_name:
          type: string
          title: Warehouse Name
        workspace_id:
          type: string
          title: Workspace Id
        workspace_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Name
        warehouse_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Warehouse Type
        warehouse_size:
          anyOf:
          - type: string
          - type: 'null'
          title: Warehouse Size
        auto_stop_mins:
          anyOf:
          - type: integer
          - type: 'null'
          title: Auto Stop Mins
        enable_serverless_compute:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Serverless Compute
      type: object
      required:
      - warehouse_id
      - warehouse_name
      - workspace_id
      title: ServerlessCandidate
      description: A warehouse that is a candidate for serverless migration.
    WarehouseAutoTuneSavingsSummaryResponse:
      properties:
        warehouse_id:
          type: string
          title: Warehouse Id
        realized_savings:
          $ref: '#/components/schemas/WarehouseRealizedSavings'
        estimated_annual_savings:
          type: number
          title: Estimated Annual Savings
          default: 0.0
        currency:
          type: string
          title: Currency
          default: USD
      type: object
      required:
      - warehouse_id
      - realized_savings
      title: WarehouseAutoTuneSavingsSummaryResponse
      description: 'Realised savings range + a derived annualized estimate for the two

        stat blocks shown above the SQL warehouse detail tabs.


        ``realized_savings`` sums ``actual`` savings over the caller''s

        ``start_date``/``end_date`` window. ``estimated_annual_savings`` is

        independent of that window: it annualizes a trailing 29-day

        actual+potential run-rate (capped at today), mirroring

        ``DatabricksSavingsService.get_overall_savings_estimate``''s

        methodology, scoped to this one warehouse. Sourced entirely from

        ClickHouse ``dbx_auto_tune_cost_savings`` — no Postgres insights table.'
    WarehouseAutoTuneActiveRecommendation:
      properties:
        rk:
          type: string
          title: Rk
        recommended_auto_stop_mins:
          anyOf:
          - type: integer
          - type: 'null'
          title: Recommended Auto Stop Mins
        created_on:
          type: string
          format: date-time
          title: Created On
      type: object
      required:
      - rk
      - created_on
      title: WarehouseAutoTuneActiveRecommendation
      description: The current actionable recommendation, if any.
    WarehouseRealizedSavings:
      properties:
        total:
          type: number
          title: Total
          default: 0.0
        min:
          type: number
          title: Min
          default: 0.0
        max:
          type: number
          title: Max
          default: 0.0
      type: object
      title: WarehouseRealizedSavings
      description: 'Realised (``actual``) auto-tune savings for a SQL warehouse over a

        date range: a total plus the min/max range across the underlying

        per-period estimates.'
