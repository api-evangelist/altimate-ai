        (the Monitoring page''s DBUs chart and config-change markers were

        removed) so every bucket here comes from exactly one source; there''s

        no more "billing-only bucket" concept to null-fill.'
    app__schemas__databricks__warehouse__WarehouseCostResponse:
      properties:
        warehouse_id:
          type: string
          title: Warehouse Id
        total_dbus:
          type: number
          title: Total Dbus
          default: 0
        estimated_cost:
          type: number
          title: Estimated Cost
          default: 0
        daily_average_dbus:
          type: number
          title: Daily Average Dbus
          default: 0
        daily_average_cost:
          type: number
          title: Daily Average Cost
          default: 0
        timeseries:
          items:
            $ref: '#/components/schemas/WarehouseCostPoint'
          type: array
          title: Timeseries
          default: []
      type: object
      required:
      - warehouse_id
      title: WarehouseCostResponse
      description: Response for warehouse cost data.
    WarehouseCostTrendItem:
      properties:
        period:
          type: string
          title: Period
        warehouse_type:
          type: string
          title: Warehouse Type
        total_dbus:
          type: number
          title: Total Dbus
          default: 0
        estimated_cost:
          type: number
          title: Estimated Cost
          default: 0
      type: object
      required:
      - period
      - warehouse_type
      title: WarehouseCostTrendItem
      description: Single data point for warehouse cost trends by warehouse type.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WarehouseStateHistoryResponse:
      properties:
        warehouse_id:
          type: string
          title: Warehouse Id
        history:
          items:
            $ref: '#/components/schemas/WarehouseStateChange'
          type: array
          title: History
      type: object
      required:
      - warehouse_id
      - history
      title: WarehouseStateHistoryResponse
      description: Response for warehouse state history.
    WarehousesTotalSavingsResponse:
      properties:
        realised_savings:
          $ref: '#/components/schemas/SavingsStatValue'
        estimated_annual_savings:
          $ref: '#/components/schemas/SavingsStatValue'
        total_opportunities:
          $ref: '#/components/schemas/SavingsStatValue'
      type: object
      required:
      - realised_savings
      - estimated_annual_savings
      - total_opportunities
      title: WarehousesTotalSavingsResponse
      description: 'Response for the SQL warehouses list page''s "Total Savings" section

        — the Databricks counterpart to Snowflake''s warehouse cost summary

        cards (Realised Savings / Estimated Annual Savings / Total

        Opportunities).'
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
