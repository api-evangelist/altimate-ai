        in: path
        required: true
        schema:
          type: string
          title: Warehouse Id
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Start date
          title: Start Date
        description: Start date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
          description: End date
          title: End Date
        description: End date
      - name: navigationSource
        in: query
        required: false
        schema:
