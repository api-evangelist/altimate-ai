          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/warehouses/{warehouse_id}/auto-tune/toggle:
    post:
      tags:
      - Databricks Warehouses
      summary: Enable or disable auto-tune for a SQL warehouse
      description: 'Enable or disable auto-tune for a serverless SQL warehouse.


        Applies inline and synchronously — unlike the job-cluster toggle, a

        warehouse ``/edit`` drains gracefully, so there is no async worker

        hand-off. See ``app.service.databricks.auto_tune.warehouse_toggle``

        for the full enable/disable flow (recommendation resolution,

        write-once baseline capture, and the audit trail written).'
      operationId: toggle_warehouse_auto_tune_endpoint_api_v1_databricks_warehouses__warehouse_id__auto_tune_toggle_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: warehouse_id
        in: path
        required: true
        schema:
          type: string
          title: Warehouse Id
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseAutoTuneToggleRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseAutoTuneToggleResponse'
        '403':
          description: Not authorized
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/warehouses/{warehouse_id}/auto-tune/status:
    get:
      tags:
      - Databricks Warehouses
      summary: Get auto-tune status for a SQL warehouse
      description: 'Get the current auto-tune mode, backoff thresholds, active

        recommendation, in-progress monitoring window, and most recent audit

        event for a SQL warehouse — the FE detail page''s Auto Tune panel.'
      operationId: get_warehouse_auto_tune_status_endpoint_api_v1_databricks_warehouses__warehouse_id__auto_tune_status_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: warehouse_id
        in: path
        required: true
        schema:
          type: string
          title: Warehouse Id
      - name: instance_id
        in: query
        required: true
        schema:
          type: integer
          description: Tenant instance ID (workspace) the warehouse runs in
          title: Instance Id
        description: Tenant instance ID (workspace) the warehouse runs in
      - name: workspace_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          description: Required Databricks workspace_id. Scopes credential resolution to the correct workspace on multi-workspace tenants (defends against cross-workspace warehouse_id collisions) AND is the join key the ingestion cost-savings mart uses to attribute realized savings on (workspace_id, entity_id); an empty or mismatched value silently drops all actual savings for this warehouse.
          title: Workspace Id
        description: Required Databricks workspace_id. Scopes credential resolution to the correct workspace on multi-workspace tenants (defends against cross-workspace warehouse_id collisions) AND is the join key the ingestion cost-savings mart uses to attribute realized savings on (workspace_id, entity_id); an empty or mismatched value silently drops all actual savings for this warehouse.
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarehouseAutoTuneStatusResponse'
        '403':
          description: Not authorized
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/warehouses/{warehouse_id}/auto-tune/config:
    get:
      tags:
