      description: 'Read-only Auto Tune notification preferences for the warehouse.


        Notification config ONLY — warehouse backoff thresholds stay on the

        shipped ``/auto-tune/toggle`` + ``/auto-tune/status`` storage

        (``WarehouseAutoTuneBackoffConfiguration``); this route never reads or

        writes them.'
      operationId: get_warehouse_auto_tune_config_api_v1_databricks_warehouses__warehouse_id__auto_tune_config_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
