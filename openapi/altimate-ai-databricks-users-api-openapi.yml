openapi: 3.2.0
info:
  title: Fast Databricks Users API
  version: 0.1.0
tags:
- name: Databricks Users
paths:
  /api/v1/databricks/users/service-principal-config:
    get:
      tags:
      - Databricks Users
      summary: Get service-principal classification config
      description: 'Return the tenant''s prefix/regex patterns used to classify service principals.


        The built-in application-id UUID rule is always applied in addition to

        these. Returns empty lists when no config has been saved.'
      operationId: get_service_principal_config_api_v1_databricks_users_service_principal_config_get
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabricksServicePrincipalConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Databricks Users
      summary: Upsert service-principal classification config
      description: 'Save the prefix/regex patterns used to classify Databricks service principals.


        Replaces any existing config. Invalid regexes are rejected at validation time.'
      operationId: upsert_service_principal_config_api_v1_databricks_users_service_principal_config_put
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabricksServicePrincipalConfig'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabricksServicePrincipalConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    DatabricksServicePrincipalConfig:
      properties:
        prefixes:
          items:
            type: string
          type: array
          maxItems: 20
          title: Prefixes
          description: Identifier prefixes (e.g. 'svc', 'sa_') that mark a service principal.
        regexes:
          items:
            type: string
          type: array
          maxItems: 20
          title: Regexes
          description: Regexes (RE2-compatible) that mark a service principal. The same pattern runs in Python `re` and ClickHouse `match()`, so RE2-only-incompatible syntax (lookaround, backreferences, possessive quantifiers) is rejected. Should be self-anchored if exact match is desired.
      type: object
      title: DatabricksServicePrincipalConfig
      description: 'Tenant-configured patterns for classifying service-principal identities.


        The built-in application-id UUID rule is always applied in addition to

        these. An identity is treated as SERVICE_PRINCIPAL if it matches the UUID

        pattern, starts with any of ``prefixes``, or fully matches any of

        ``regexes``.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
