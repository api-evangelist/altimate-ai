  /api/v1/databricks/sync-history:
    get:
      tags:
      - Databricks
      summary: Databricks ingestion run history (audit)
      description: 'Paginated Databricks ingestion runs for the tenant, newest activity first.


        Scoped to loader runs (``databricks_loader_*``) — the family this audit

        categorizes. Tenant-wide, with no per-connection scoping: loader runs leave

        ``global_tasks.data_store_id`` null, so nothing attributes a loader run to

        the connection that produced it and a ``data_store_id`` filter would match

        zero rows. (Only ``databricks_extractor_*`` runs carry ``data_store_id``, and

        then only recently; Last Sync in ``crud.sync`` uses those for attribution,

        but they are a different run family and outside this loader-activity feed.)


        ``status`` is enum-typed so an unknown value is a 422 from FastAPI. Left as

        free text it reaches Postgres as a cast to ``global_task_status_type`` and

        comes back as an unexplained 500.'
      operationId: get_databricks_sync_history_api_v1_databricks_sync_history_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/GlobalTaskStatusType'
          description: Filter to these global_tasks statuses (e.g. completed, ingestion_failed).
          default: []
          title: Status
        description: Filter to these global_tasks statuses (e.g. completed, ingestion_failed).
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/DatabricksSyncCategory'
          - type: 'null'
          description: Filter to one ingestion family (system_tables, cloud_cost, ...).
          title: Category
        description: Filter to one ingestion family (system_tables, cloud_cost, ...).
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Page size
          default: 50
          title: Size
        description: Page size
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_DatabricksSyncRun_'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 401 Get Databricks Sync History Api V1 Databricks Sync History Get
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Get Databricks Sync History Api V1 Databricks Sync History Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/access-rules/options:
    get:
      tags:
      - Databricks
      summary: List Databricks accounts/workspaces/tags grantable in access rules
      description: 'Return the catalog of accounts/workspaces for the access-rule picker.


        Defaults to onboarded workspaces. The raw account catalog is the whole

        Databricks account — 221 workspaces for pepsico against 95 we ingest from —

        so offering it by default listed workspaces nobody had onboarded (and BANNED

        ones) as grantable resources.'
      operationId: get_access_rule_options_api_v1_databricks_access_rules_options_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRuleOptionsResponse'
        '403':
          description: Not authorized
        '404':
          description: No ClickHouse database configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
