  /api/v1/databricks/cost/trends/by-product:
    get:
      tags:
      - DATABRICKS
      summary: Get Databricks cost trends by product over time
      description: 'Get cost trends over time, sliced for a UI category.


        Returns time series data with DBU consumption and estimated cost per

        period, with each row labelled by the category''s chosen segment. The

        ``products`` array in the response is the canonical legend for the

        category (in display order, including segments with no data) so the FE

        legend stays stable across date ranges.'
      operationId: get_cost_trends_by_product_api_v1_databricks_cost_trends_by_product_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Start date for the period
          title: Start Date
        description: Start date for the period
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
          description: End date for the period
          title: End Date
        description: End date for the period
      - name: granularity
        in: query
        required: false
        schema:
          type: string
          description: 'Time granularity: ''day'', ''week'', or ''month'''
          default: day
          title: Granularity
        description: 'Time granularity: ''day'', ''week'', or ''month'''
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by workspace ID
          title: Workspace Id
        description: Filter by workspace ID
      - name: category
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CategoryName'
          description: Which UI category the chart is for. Drives both the product filter and the per-row
            segment label. ``total`` returns the 5 spec-group stack (Clusters / SQL Warehouse / AI/ML
            / Lakehouse / Platform). ``sql_warehouse`` returns Classic / Pro / Serverless. Other values
            return the products in that spec group.
          default: total
        description: Which UI category the chart is for. Drives both the product filter and the per-row
