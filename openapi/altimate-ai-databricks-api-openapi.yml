      description: 'Static task definition entry from ``dbx_job_tasks_inventory``,

        enriched with the most-recent observed cluster spec joined from

        ``dbx_job_task_run_timeline`` × ``dbx_compute_clusters``.


        All ``current_*`` fields are optional — tasks that have never run

        (or whose latest run carried no compute_id) come back without a

        cluster spec, and the FE renders the no-change card without a

        Current panel.


        ``is_auto_scaling``, ``photon_enabled``, and

        ``estimated_cost_per_hr`` degrade to ``None`` the same way — no

        cluster history means no autoscale/Photon signal, and no active

        Auto Tune recommendation for the task means no cost estimate.'
