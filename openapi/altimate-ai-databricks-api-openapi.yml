        latest_action_event_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Action Event Type
      type: object
      required:
      - instance_id
      title: DbxAutoRecommendationItem
      description: 'A single right-sizing recommendation for a Databricks entity.


        The FE renders this directly. ``auto_tune_mode`` is the single source

        of truth for the toggle position (see PRD §6 Option A — comes from a

        LEFT JOIN on ``databricks_auto_tune_configuration``). The legacy

        ``action`` column was removed from ``dbx_auto_recommendation`` per

        team decision; all enable/disable state lives on the configuration

        table.'
    CloudCostTrendRow:
      properties:
        period:
          type: string
          title: Period
          description: Bucket start date, ``YYYY-MM-DD``.
      additionalProperties: true
      type: object
      required:
      - period
      title: CloudCostTrendRow
      description: "One stacked-bar period of cloud infrastructure cost by category.\n\nBesides ``period`` the row carries, as extra keys:\n  * one float per segment in :data:`CLOUD_COST_SEGMENTS` (e.g. ``Compute``),\n  * ``percentage_<segment>`` — % change vs the previous period (or ``None``),\n  * :data:`CLOUD_TOTAL_KEY` — the row total (sum of all segments),\n  * ``percentage_total`` — % change of the total vs the previous period."
    RollbackInfo:
      properties:
        performed:
          type: boolean
          title: Performed
          default: false
        needs_confirmation:
          type: boolean
          title: Needs Confirmation
          default: false
        active_run_ids:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Active Run Ids
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      title: RollbackInfo
      description: "Surfaced on the toggle response when the user disables an APPLIED\nrecommendation (sync rollback path, v2.5 §15).\n\n- ``performed=True`` → the cluster was reverted and audit/config were\n  updated. The toggle is now OFF.\n- ``needs_confirmation=True`` → the BE detected active runs on the\n  job. No DB writes happened. The FE should show an interstitial\n  (\"kill {N} running runs and roll back?\"); on confirm, re-call the\n  endpoint with ``force=true``."
    DeploymentTypeTrendsResponse:
      properties:
        trends:
          items:
            $ref: '#/components/schemas/DeploymentTypeTrendItem'
          type: array
          title: Trends
          description: List of trend data by deployment type
        deployment_types:
          items:
            type: string
          type: array
          title: Deployment Types
          description: Unique deployment types for chart legend
        granularity:
          type: string
          title: Granularity
          description: Time granularity (day/week/month)
      type: object
      required:
      - trends
      - deployment_types
      - granularity
      title: DeploymentTypeTrendsResponse
      description: Response model for deployment type trends endpoint.
    DatabricksConnectionUpdatePAT:
      properties:
        type:
          type: string
          title: Type
          default: databricks
        server_hostname:
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^(https?://)?[a-zA-Z0-9][a-zA-Z0-9\-]*(\.[a-zA-Z0-9\-]+)*\.(cloud\.databricks\.com|azuredatabricks\.net|gcp\.databricks\.com)/?$
          title: Server Hostname
          description: Databricks workspace hostname. Must end in cloud.databricks.com, azuredatabricks.net, or gcp.databricks.com.
        http_path:
          type: string
          maxLength: 256
          minLength: 1
          pattern: ^/sql/[0-9.]+/warehouses/[A-Za-z0-9]+$
          title: Http Path
          description: SQL warehouse HTTP path. Derived from `sql_warehouse_id` when that is supplied; still accepted directly for the pre-consolidation shape.
        workspace_url:
          anyOf:
          - type: string
            maxLength: 256
            pattern: ^(https?://)?[a-zA-Z0-9][a-zA-Z0-9\-]*(\.[a-zA-Z0-9\-]+)*\.(cloud\.databricks\.com|azuredatabricks\.net|gcp\.databricks\.com)/?$
          - type: 'null'
          title: Workspace Url
          description: Workspace URL as the customer sees it, with or without scheme (AWS *.cloud.databricks.com, Azure adb-*.azuredatabricks.net). `server_hostname` is derived from it.
        sql_warehouse_id:
          anyOf:
          - type: string
            maxLength: 64
            minLength: 1
            pattern: ^[A-Za-z0-9]+$
          - type: 'null'
          title: Sql Warehouse Id
          description: SQL warehouse id; `http_path` is derived from it.
        name:
          type: string
          maxLength: 64
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Description
        databricks_account_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Databricks Account Id
          description: Databricks account id. Verified against the account probed from the workspace; stored as instances.account_name.
        system_catalog_scope:
          anyOf:
          - type: string
            enum:
            - all
            - specific
          - type: 'null'
          title: System Catalog Scope
          description: Whether ingestion reads all system schemas or a named subset.
        system_catalog_schemas:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          title: System Catalog Schemas
          description: Comma-separated schemas; required when scope is 'specific'.
        workspace_resource_id:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Workspace Resource Id
        azure_region:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Azure Region
        storage_account_resource_id:
          anyOf:
          - type: string
            maxLength: 512
          - type: 'null'
          title: Storage Account Resource Id
        storage_account_fqdn:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
          title: Storage Account Fqdn
        s3_role_arn:
          anyOf:
          - type: string
            pattern: ^arn:aws:iam::\d{12}:role/.+$
          - type: 'null'
          title: S3 Role Arn
        s3_external_id:
          anyOf:
          - type: string
            maxLength: 1224
          - type: 'null'
          title: S3 External Id
        s3_location:
          anyOf:
          - type: string
            pattern: ^(s3|abfss)://.+$
          - type: 'null'
          title: S3 Location
        log_tenant_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Log Tenant Id
        log_client_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Log Client Id
        log_client_secret:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          title: Log Client Secret
        storage_account:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Storage Account
        container:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Container
        log_path:
          anyOf:
          - type: string
            maxLength: 512
            pattern: ^abfss://.+$
          - type: 'null'
          title: Log Path
          description: abfss://… log root
        auth_type:
          type: string
          const: pat
          title: Auth Type
          default: pat
        access_token:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Access Token
      type: object
      required:
      - server_hostname
      - http_path
      - name
      title: DatabricksConnectionUpdatePAT
    AccountOption:
      properties:
        account_id:
          type: string
          title: Account Id
        workspace_count:
          type: integer
          title: Workspace Count
      type: object
      required:
      - account_id
      - workspace_count
      title: AccountOption
      description: A grantable Databricks account (grants cover all its workspaces).
    WorkspaceActivityResponse:
      properties:
        workspaces:
          items:
            $ref: '#/components/schemas/WorkspaceActivity'
          type: array
          title: Workspaces
      type: object
      required:
      - workspaces
      title: WorkspaceActivityResponse
      description: Response for workspace activity.
    CloudCostCoverage:
      properties:
        available_from:
          type: string
          format: date
          title: Available From
          description: First day with cloud cost data
        available_to:
          type: string
          format: date
          title: Available To
          description: Last day with cloud cost data
        is_partial:
          type: boolean
          title: Is Partial
          description: True when the requested range extends beyond available data
        callout:
          anyOf:
          - type: string
          - type: 'null'
          title: Callout
          description: Human-readable coverage message; set only when is_partial
      type: object
      required:
      - available_from
      - available_to
      - is_partial
      title: CloudCostCoverage
      description: 'Coverage of the cloud-cost fact vs the requested window.


        Lets the FE render a "data available from [date]" callout when the

        selected range extends beyond the ingested cloud-cost data.'
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
