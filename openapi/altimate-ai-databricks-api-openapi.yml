        ``actual`` holds savings on runs where an applied recommendation was in

        effect; ``potential`` holds the savings those runs would have earned from

        the active recommendation had it been applied. Each series is bucketed by

        the run window (``period_start_time``).'
    EstimateSegmentItem:
      properties:
        product:
          type: string
          title: Product
          description: Segment label for this category
        cost:
          type: number
          title: Cost
          description: Actual cost for the period
          default: 0
        cost_estimate:
          type: number
          title: Cost Estimate
          description: Projected cost for the period
          default: 0
        percentage_change:
          anyOf:
          - type: number
          - type: 'null'
          title: Percentage Change
          description: Percentage change from the previous period
      type: object
      required:
      - product
      title: EstimateSegmentItem
      description: 'One segment''s actual + projected cost at a single point on the estimate

        graph. The segment is whatever the requested ``category`` resolves to —

        a spec group (``category=total``), a product (e.g. ``category=clusters``),

        or a SQL tier (``category=sql_warehouse``). ``product`` carries the same

        label semantics as ``ProductTrendItem.product``.'
    AIFunctionUsageBreakdownResponse:
      properties:
        usage:
          items:
            $ref: '#/components/schemas/AIFunctionUsageItem'
          type: array
          title: Usage
          description: List of usage sources
      type: object
      title: AIFunctionUsageBreakdownResponse
      description: Response for AI function usage breakdown.
    WarehouseStateHistoryResponse:
      properties:
        warehouse_id:
          type: string
          title: Warehouse Id
        history:
          items:
            $ref: '#/components/schemas/WarehouseStateChange'
          type: array
          title: History
      type: object
      required:
      - warehouse_id
      - history
      title: WarehouseStateHistoryResponse
      description: Response for warehouse state history.
    SparkPlanFlag:
      properties:
        sql_execution_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Sql Execution Id
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        flag_name:
          type: string
          title: Flag Name
      type: object
      required:
      - flag_name
      title: SparkPlanFlag
      description: A single plan analysis flag.
    SparkStage:
      properties:
        stage_id:
          type: integer
          title: Stage Id
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        num_tasks:
          type: integer
          title: Num Tasks
          default: 0
        submission_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Submission Time
        completion_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completion Time
        duration_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration Ms
        gc_time_ms:
          type: number
          title: Gc Time Ms
          default: 0
        shuffle_read_bytes:
          type: number
          title: Shuffle Read Bytes
          default: 0
        shuffle_write_bytes:
          type: number
          title: Shuffle Write Bytes
          default: 0
        spill_memory_bytes:
          type: number
          title: Spill Memory Bytes
          default: 0
        spill_disk_bytes:
          type: number
          title: Spill Disk Bytes
          default: 0
        failed_tasks:
          type: integer
          title: Failed Tasks
          default: 0
        skew_ratio:
          anyOf:
          - type: number
          - type: 'null'
          title: Skew Ratio
      type: object
      required:
      - stage_id
      title: SparkStage
      description: Stage information with aggregated task metrics.
    WarehousesTotalSavingsResponse:
      properties:
        realised_savings:
          $ref: '#/components/schemas/SavingsStatValue'
        estimated_annual_savings:
          $ref: '#/components/schemas/SavingsStatValue'
        total_opportunities:
          $ref: '#/components/schemas/SavingsStatValue'
      type: object
      required:
      - realised_savings
      - estimated_annual_savings
      - total_opportunities
      title: WarehousesTotalSavingsResponse
      description: 'Response for the SQL warehouses list page''s "Total Savings" section

        — the Databricks counterpart to Snowflake''s warehouse cost summary

        cards (Realised Savings / Estimated Annual Savings / Total

        Opportunities).'
    ToggleAutoTuneRequest:
      properties:
        enabled:
          type: boolean
          title: Enabled
          description: Desired auto-tune state for the recommendation.
        scope:
          anyOf:
          - type: string
            enum:
            - all_tasks
            - specific_tasks
          - type: 'null'
          title: Scope
          description: Optional whole-job cascade. 'all_tasks' cascade-writes the toggle to every (entity_id,
            task_key) row under this job. 'specific_tasks' enables the recs whose ``task_key`` appears
            in ``enabled_task_keys`` and DISABLES every other rec on the job — the config row converges
            to the exact set the user chose. When omitted, the toggle behaves per-task (legacy behavior
            — only the (job_id, task_key) row from the URL/query is mutated).
        enabled_task_keys:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Enabled Task Keys
          description: Required (and must be non-empty) when ``scope='specific_tasks'``. Rejected for
            any other scope. The list of task_keys the user has chosen to enable; every other rec on the
            job is disabled.
      type: object
      required:
      - enabled
      title: ToggleAutoTuneRequest
      description: Request body for ``PATCH /databricks/jobs/{id}/auto-tune/toggle``.
    ComputeTypeTrendItem:
      properties:
        period:
          type: string
          title: Period
          description: Period label (date or week/month)
        compute_type:
          type: string
          title: Compute Type
          description: 'Compute type: jobs, all_purpose, sql, other'
        total_dbus:
          type: number
          title: Total Dbus
          description: Total DBUs for this period+type
        estimated_cost:
          type: number
          title: Estimated Cost
          description: Estimated cost for this period+type
      type: object
      required:
      - period
      - compute_type
      - total_dbus
      - estimated_cost
      title: ComputeTypeTrendItem
      description: Single data point for compute type trends.
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
servers:
- url: https://api.myaltimate.com
  description: Base URL reconciled from apis.yml
