  /api/v1/databricks/jobs/{job_id}/auto-tune/toggle:
    patch:
      tags:
      - DATABRICKS
      summary: Toggle auto-tune on/off for a job's recommendation
      description: "Enable or disable auto-tune for a recommendation.\n\nThree flows behind one endpoint\
        \ (v2.5 §15):\n\n1. **Enable** — write APPLY_REQUESTED + flip config to enabled.\n   Worker picks\
        \ up async and calls Databricks.\n2. **Disable when never applied** — fast-path. Write APPLY_REQUESTED\n\
        \   (mode=disable) + flip the per-role cfg rows to disabled. No\n   Databricks call needed.\n\
        3. **Disable when previously APPLIED** — sync rollback.\n   BE preflight → optionally cancel active\
        \ runs (with ``force=true``)\n   → POST /api/2.2/jobs/update with attributes.from of the most\n\
        \   recent APPLIED → write APPLIED audit row + update config in one\n   Postgres tx. On Databricks\
        \ failure: NO audit row, surface error."
      operationId: toggle_job_auto_tune_api_v1_databricks_jobs__job_id__auto_tune_toggle_patch
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: instance_id
        in: query
        required: true
        schema:
          type: integer
          description: Tenant instance ID (workspace) the job runs in
          title: Instance Id
        description: Tenant instance ID (workspace) the job runs in
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional Databricks workspace_id to scope queries to a specific workspace within
            the tenant's Databricks account. Defends against cross-workspace job_id collisions. When None,
            falls back to (instance_id, entity_id) lookup.
          title: Workspace Id
        description: Optional Databricks workspace_id to scope queries to a specific workspace within
          the tenant's Databricks account. Defends against cross-workspace job_id collisions. When None,
          falls back to (instance_id, entity_id) lookup.
      - name: task_key
        in: query
        required: false
        schema:
          type: string
          description: Task key when toggling a per-task recommendation. Empty string for job-level recommendations
            (default).
          default: ''
          title: Task Key
        description: Task key when toggling a per-task recommendation. Empty string for job-level recommendations
          (default).
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          description: Only meaningful for sync rollback (disable on an applied rec). When the job has
            active runs, force=true cancels them before reverting the cluster config. Defaults to false;
            the BE returns rollback.needs_confirmation=true and the FE shows an interstitial.
