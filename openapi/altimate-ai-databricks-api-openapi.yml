      - name: resource_type
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/DatabricksResourceType'
          description: Type of resource (cluster, warehouse, job, query, user)
        description: Type of resource (cluster, warehouse, job, query, user)
      - name: resource_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional resource ID for context
          title: Resource Id
        description: Optional resource ID for context
      - name: resource_name
        in: query
        required: false
