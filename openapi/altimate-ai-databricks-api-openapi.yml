    ClusterAutoTuneBackoffPolicy:
      properties:
        restarts_after_shutdown:
          type: integer
          maximum: 10.0
          minimum: 3.0
          title: Restarts After Shutdown
          description: Premature termination→restart pairs since apply that trigger an Auto Termination backoff. 3–10.
          default: 3
        cold_start_threshold_per_day:
          type: integer
          maximum: 10.0
          minimum: 3.0
          title: Cold Start Threshold Per Day
          description: Cold starts per UTC day that trigger a Min Worker Node Sizing backoff. 3–10.
          default: 5
        cold_start_threshold_pct:
          type: integer
          maximum: 1000.0
          minimum: 100.0
          title: Cold Start Threshold Pct
          description: Backoff sensitivity as a percent of the recommendation's observed pre-tune baseline rate — applied to BOTH axes (auto-terminate restart churn and worker-resize cold starts). 150 = trip when the post-apply rate exceeds 1.5x baseline. Min 100%.
          default: 150
        trigger_action:
          type: string
          const: rollback
          title: Trigger Action
          description: What a backoff does. Always 'rollback' (step back to the last config that ran clean); any other stored value reads as 'rollback'.
          default: rollback
      type: object
      title: ClusterAutoTuneBackoffPolicy
      description: 'Cluster-wide backoff policy — the "when a change misbehaves"

        guardrail applying to every enabled optimization on the cluster.


        Stored under the ``backoff_policy`` key in

        ``databricks_auto_tune_configuration.configuration``. The integer

        defaults come straight from the backoff monitor''s own env-overridable

        constants (``backoff_constants.py``) so the form''s baselines always

        match what the pod actually enforces. Execution time and query

        latency are deliberately absent — neither signal applies to

        all-purpose clusters (no per-run baseline, no query stream). Each

        threshold belongs to one optimization axis and is editable only

        while that axis is enabled: ``restarts_after_shutdown`` to Auto

        Termination; ``cold_start_threshold_per_day`` to Min Worker Node

        Sizing. The per-step monitoring horizon is no longer configurable —

        each axis holds a fixed backoff window (``_window_days_for_axis`` in

        the monitor), so the step-down cadence is not user-tunable.'
    app__schemas__databricks__opportunities__ServerlessCandidatesResponse:
      properties:
