  /api/v1/databricks/jobs/{job_id}/auto-tune/status:
    get:
      tags:
      - Databricks
      summary: Page-level Auto Tune status for a job
      description: 'Read-only status endpoint consumed by the Auto Tune tab on mount.


        Aggregates ``auto_tune_mode`` across every (entity_id, task_key) row

        for this job: master is "enabled" if ANY task is enabled. Surfaces a

        job-level preflight result so the FE can disable the master Switch

        when the SP can''t act on the workspace, with the exact actionable

        message we''d show on a real toggle attempt. Also returns

        ``recommendation_count`` so the FE can gate the Auto Tune tab.

        Savings figures are not computed here — the FE derives its overall

        savings tiles from the per-day ``/auto-tune/savings-trends`` series

        (ClickHouse ``dbx_jobs_cost_savings``).


        No DB writes — the preflight result is a snapshot for UI gating only.'
      operationId: get_job_auto_tune_status_api_v1_databricks_jobs__job_id__auto_tune_status_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: instance_id
        in: query
        required: true
        schema:
          type: integer
          description: Tenant instance ID (workspace) the job runs in
          title: Instance Id
        description: Tenant instance ID (workspace) the job runs in
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
