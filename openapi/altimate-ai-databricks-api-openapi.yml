      summary: Get unified list of AI/ML endpoints (Model Serving + Vector Search + AI Gateway)
      description: "Get a unified list of AI/ML endpoints for the dashboard table.\n\nEach row carries:\n\
        \n- ``service`` — routing discriminator ('model_serving' | 'vector_search' |\n  'ai_gateway').\
        \ Used by the FE to pick the detail page on row-click; **not**\n  a filter input. The legacy ``service``\
        \ query param was intentionally\n  dropped (commit ad00d32) — it is no longer read here, so a\
        \ stray\n  ``?service=...`` is ignored rather than filtering. Use ``entity_type``\n  to narrow\
        \ rows.\n- ``entity_type`` — leaf type rendered in the Type column / filtered on\n  via the ``entity_type``\
        \ query param.\n\nFields that don't apply to a row's service are null. Pagination is applied\n\
        over the merged result set so the top spenders surface first.\n\nQuery Parameters:\n\n- entity_type:\
        \ comma-separated leaf entity_type values (optional)\n- endpoint_name: exact endpoint name(s),\
        \ repeatable, any-of match (optional)\n- start_date: Start date (YYYY-MM-DD), defaults to 30 days\
        \ ago\n- end_date: End date (YYYY-MM-DD), defaults to today\n- workspace_id: Comma-separated workspace\
        \ IDs or 'all' (default)\n- limit: Max rows to return (default: 50, max: 1000)\n- offset: Pagination\
        \ offset (default: 0)\n- sort_by: see above\n- sort_order: 'asc' | 'desc' (default: 'desc')"
      operationId: get_model_serving_endpoints_api_v1_databricks_ai_ml_services_endpoints_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: entity_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Comma-separated leaf entity_types to filter the rows. One of FOUNDATION_MODEL,
            CUSTOM_MODEL, AI_FUNCTION, EXTERNAL_MODEL, FEATURE_SPEC, VECTOR_SEARCH, AI_GATEWAY. Omit to
            return all rows.
          title: Entity Type
        description: Comma-separated leaf entity_types to filter the rows. One of FOUNDATION_MODEL, CUSTOM_MODEL,
