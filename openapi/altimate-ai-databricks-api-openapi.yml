            ``sql_warehouse`` → Classic / Pro / Serverless; other values → the products of that spec group.
            Mirrors ``/cost/trends/by-product``.
          default: total
        description: Which UI category to segment the projection by. ``total`` → the 6 spec groups; ``sql_warehouse``
