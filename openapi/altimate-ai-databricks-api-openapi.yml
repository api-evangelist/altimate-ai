      title: WarehouseAutoTuneEnablePreflight
      description: 'Whether the SP can currently enable auto-tune on this warehouse.


        Surfaced on the status response so the FE can render the Auto Tune

        Switch disabled with a persistent reason (instead of a momentary toast

        on a failed enable) when the service principal lacks CAN_MANAGE.

        Fail-open: any credential/read/timeout error leaves ``blocked=False``

        (the hard enable-gate in the toggle path still protects the mutation).


        Used in two positions. Top-level it is the AUTO STOP axis''s own enable

        gate: CAN_MANAGE is folded in, plus Auto Stop''s

        ``no_active_recommendation``. It does not speak for Warehouse Sizing.

        ``can_manage_blocked`` is the only warehouse-wide half: when true the SP

        cannot edit this warehouse at all, so no axis can be enabled. A top-level

        ``blocked`` with ``can_manage_blocked`` false only means Auto Stop has

        nothing to apply; Warehouse Sizing may still be enableable. Each axis

        block''s ``enable_preflight`` is that axis''s own gate.'
