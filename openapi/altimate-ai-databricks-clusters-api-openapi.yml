openapi: 3.1.0
info:
  title: Fast ACCOUNT_COSTS Databricks Clusters API
  version: 0.1.0
tags:
- name: Databricks Clusters
paths:
  /api/v1/databricks/clusters/filters:
    get:
      tags:
      - Databricks Clusters
      summary: Get filter options for clusters
      description: Get distinct filter values for cluster filtering.
      operationId: get_cluster_filters_api_v1_databricks_clusters_filters_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: prefix
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search prefix for name filters
          title: Prefix
        description: Search prefix for name filters
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Workspace ID to filter by
          title: Workspace Id
        description: Workspace ID to filter by
      - name: compute_type
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: 'Filter by compute type(s): ''all_purpose'', ''jobs'', ''dlt'''
          title: Compute Type
        description: 'Filter by compute type(s): ''all_purpose'', ''jobs'', ''dlt'''
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 1-indexed page for the dropdown's load-more; offsets results by (page - 1) * size.
          default: 1
          title: Page
        description: 1-indexed page for the dropdown's load-more; offsets results by (page - 1) * size.
      - name: size
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 100
            minimum: 1
          - type: 'null'
          description: Maximum number of filter options to return.
          title: Size
        description: Maximum number of filter options to return.
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterFilterOptions'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/clusters/filters/cluster_names:
