      - Databricks Clusters
      summary: Get paginated distinct cluster names for filtering
      description: Get a paginated list of distinct cluster-name filter options.
      operationId: get_cluster_name_filters_api_v1_databricks_clusters_filters_cluster_names_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: prefix
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search substring for cluster names (case-insensitive)
          title: Prefix
        description: Search substring for cluster names (case-insensitive)
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Workspace ID to filter by
          title: Workspace Id
        description: Workspace ID to filter by
      - name: compute_type
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: 'Filter by compute type(s): ''all_purpose'', ''jobs'', ''dlt'''
          title: Compute Type
        description: 'Filter by compute type(s): ''all_purpose'', ''jobs'', ''dlt'''
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Inclusive start of the metrics window. Defaults to 30 days before end_date.
          title: Start Date
        description: Inclusive start of the metrics window. Defaults to 30 days before end_date.
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Inclusive end. Defaults to today.
          title: End Date
        description: Inclusive end. Defaults to today.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed)
          default: 1
          title: Page
        description: Page number (1-indexed)
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 20
          title: Size
        description: Items per page
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
