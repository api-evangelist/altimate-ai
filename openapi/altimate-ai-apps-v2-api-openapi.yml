  /api/v2/charts/{name}/query:
    post:
      tags:
      - APPS_V2
      summary: Query Chart Endpoint
      description: 'Run a chart''s underlying dataset query.


        Returns the chart descriptor plus a chart-shaped envelope

        (`columns`/`rows`/`meta`). `timezone` is threaded through exactly like

        `apps.api.datasets.query_dataset_endpoint` — see that endpoint''s

        docstring.


        ONE execution path, per-endpoint PROJECTION: this endpoint never runs

        its own query — it calls the exact same `run_dataset_query` a plain

        dataset query uses, then reshapes that result''s `DatasetEnvelope` into

        a `ChartEnvelope` (`chart_columns` instead of `columns_descriptors`,

        `ChartMeta` instead of `DatasetMeta`). A chart and its dataset can never

        disagree about RBAC, filters, or row data — only presentation differs.'
      operationId: query_chart_endpoint_api_v2_charts__name__query_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      - name: x-user-group-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Group-Id
      - name: x-timezone
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Timezone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChartQueryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartEnvelope'
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Query Chart Endpoint Api V2 Charts  Name  Query Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
