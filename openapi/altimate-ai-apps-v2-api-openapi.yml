  /api/v2/filters/{key}/options:
    get:
      tags:
      - APPS_V2
      summary: Filter Options Endpoint
      description: 'List distinct values for one of a dataset''s (or a summary''s PRIMARY

        dataset''s) filters, paginated.


        `search` is a case-insensitive prefix match applied server-side in SQL.

        Exactly one of `dataset`/`summary` is required (same rule as

        `list_filters_endpoint`). Unknown `dataset`/`summary` -> 404.


        For `summary`, `key` is checked against `summary.filters` — the

        summary''s OWN published vocabulary, not the resolved dataset''s —

        BEFORE anything else runs: a key the summary never declared must 400

        `UNKNOWN_FILTER_KEY` even if it happens to also be a valid filter on

        the summary''s primary dataset, mirroring the same-named gate in

        `apps.engine.service.run_summary_query`. Once past that gate, options

        are listed from the PRIMARY dataset via the existing

        `distinct_filter_options` — the primary is authoritative because its

        own RBAC gate (`apps.rbac.resolve_dataset_rbac`, applied inside that

        call) scopes the option list, so the dropdown can never show a value

        the caller may not see.


        `filters` is a JSON object of the same shape the dataset query''s own

        `filters` body field takes (`{"warehouse_id": ["abc"]}`) — a query

        param rather than a body because this is a GET. Only the dataset''s

        `required=True` filters are applied from it (see

        `distinct_filter_options`); the rest are accepted and ignored so the

        caller can send one filter map to both endpoints. Malformed JSON, a

        non-object, or a value that is not a list of strings -> 400

        `FILTER_PARAM_INVALID`; a MISSING required filter -> 400

        `FILTER_REQUIRED` from the engine.


        `timezone` (the `x-timezone` header, default `"UTC"`) cuts the option

        scan''s window at the caller''s midnights — the same header the dataset

        query honours, so both see the same rows.'
      operationId: filter_options_endpoint_api_v2_filters__key__options_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          title: Key
      - name: dataset
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Dataset
      - name: summary
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Start Date
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date
          title: End Date
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Size
      - name: filters
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Filters
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      - name: x-user-group-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Group-Id
      - name: x-timezone
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Timezone
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterOptionsEnvelope'
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Filter Options Endpoint Api V2 Filters  Key  Options Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
