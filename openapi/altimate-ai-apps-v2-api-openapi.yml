    GroupFreshness:
      properties:
        key:
          type: string
          title: Key
        label:
          type: string
          title: Label
        dataset_count:
          type: integer
          title: Dataset Count
        retired_count:
          type: integer
          title: Retired Count
          default: 0
        last_refreshed_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Refreshed At
        watermark_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Watermark At
        oldest_watermark_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Oldest Watermark At
        stalest_dataset_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Stalest Dataset Type
        has_failures:
          type: boolean
          title: Has Failures
          default: false
        datasets:
          items:
            $ref: '#/components/schemas/DatasetFreshnessItem'
          type: array
          title: Datasets
          default: []
      type: object
      required:
      - key
      - label
      - dataset_count
      title: GroupFreshness
      description: 'One tenant-facing bucket of dataset freshness.


        `last_refreshed_at` (MAX over members) is the tile''s headline: when this

        group last received data. `oldest_watermark_at` (MIN over members) plus

        `stalest_dataset_type` expose the laggiest member so a client can show a

        lag warning, WITHOUT that member''s age becoming the headline — a

        decommissioned loader''s final run sits in `global_tasks` forever, so

        gating the tile on it reports a retired pipeline as a stale one.


        Every field except `retired_count` describes the group''s LIVE members

        only. Retired ones are counted and otherwise ignored, so a group cannot

        report the age, watermark, or failure of a pipeline that is no longer

        scheduled. `dataset_count` is therefore what the tenant actually has

        today, not what they have ever had.'
    DecorationDescriptor:
      properties:
        display:
          type: string
          title: Display
        tone:
          anyOf:
          - type: string
          - type: 'null'
          title: Tone
        values:
          items:
            $ref: '#/components/schemas/ValueStyleDescriptor'
          type: array
          title: Values
        thresholds:
          items:
            $ref: '#/components/schemas/ThresholdDescriptor'
          type: array
          title: Thresholds
        hash_column:
          anyOf:
          - type: string
          - type: 'null'
          title: Hash Column
      type: object
      required:
      - display
      - values
      - thresholds
      title: DecorationDescriptor
      description: 'Wire form of `apps.specs.decorations.Decoration` — see that module''s

        docstring for the core design rule (semantic `Tone`, never a colour)

        this descriptor carries onto the wire unchanged.'
    InternalDatasetFreshness:
      properties:
        dataset_type:
          type: string
          title: Dataset Type
        group_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Key
        group_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Label
        excluded:
          type: boolean
          title: Excluded
          default: false
        retired:
          type: boolean
          title: Retired
          default: false
        last_refreshed_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Refreshed At
        last_attempt_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Last Attempt At
        watermark_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Watermark At
        last_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Status
        failed:
          type: boolean
          title: Failed
          default: false
      type: object
      required:
      - dataset_type
      title: InternalDatasetFreshness
      description: 'One `dataset_type`, with the classification the tenant view hides.


        `group_key` is `None` for dataset_types the taxonomy deliberately excludes

        (ingestion-plumbing sentinels, config-sync jobs). The tenant-facing feed

        drops those rows entirely; the internal view keeps them and flags them via

        `excluded`, because "why is this dataset missing from the panel" is the

        question this dashboard exists to answer.


        `excluded` does not cover every way a dataset can be absent from the

        tenant panel: a dataset can be classified (`excluded=False`) into a group

        that is itself in `apps.freshness.grouping.HIDDEN_FROM_TENANT_GROUPS`

        (e.g. `snowflake_dbt_all`, `group_key="altimate_transforms"`), which the

        tenant feed also never renders. A staff reader must check `group_key`

        against `HIDDEN_FROM_TENANT_GROUPS`, not just `excluded`, to know whether

        a tenant actually sees this dataset''s group.


        `retired` marks a pipeline that is no longer scheduled, derived from

        `last_attempt_at` rather than `last_refreshed_at`. These rows are kept

        (an operator asking "where did this dataset go" needs to find it) but they

        are not stale and must not be counted or coloured as such — `failed` is

        likewise the LIVE failure flag, false for a retired pipeline whose final

        attempt happened to fail.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
