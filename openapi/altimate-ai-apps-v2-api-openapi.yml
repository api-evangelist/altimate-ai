          title: Name
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      - name: x-user-group-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Group-Id
      - name: x-timezone
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Timezone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetQueryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryEnvelope'
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Query Summary Endpoint Api V2 Summaries  Name  Query Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/freshness/groups:
    get:
      tags:
      - APPS_V2
      summary: Get Grouped Freshness
      description: 'Tenant''s datasets bucketed into UI display groups.


        Every timestamp is unix epoch seconds; `generated_at` carries the server

        clock so the client can render relative times against it. Internal

        pipeline dataset_types (ingestion-plumbing sentinels, config-sync jobs)

        are excluded from the response entirely; dbt transform runs classify to

        "altimate_transforms", which is hidden from this feed. A databricks

        tenant always gets `groups: []` —

        the databricks taxonomy classifies every dataset_type to `None` until it

        is authored. Groups in `HIDDEN_FROM_TENANT_GROUPS` are omitted from this

        feed and remain visible only on the internal dashboard.


        Gated by the `enableSystemStatus` tenant_info flag: a tenant without it

        gets 404, not an empty payload, so a disabled feature is indistinguishable

        from one that was never built.'
      operationId: get_grouped_freshness_api_v2_freshness_groups_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      - name: x-user-group-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Group-Id
      - name: x-timezone
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Timezone
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupedFreshnessResponse'
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Get Grouped Freshness Api V2 Freshness Groups Get
        '404':
          description: System Status is not enabled for this tenant
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Get Grouped Freshness Api V2 Freshness Groups Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
