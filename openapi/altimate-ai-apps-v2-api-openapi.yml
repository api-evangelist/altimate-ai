openapi: 3.2.0
info:
  title: Fast APPS V2 API
  version: 0.1.0
tags:
- name: APPS_V2
paths:
  /api/v2/freshness/internal/tenants:
    get:
      tags:
      - APPS_V2
      summary: List Internal Tenants
      description: 'Tenants the dashboard can inspect, for the selector.


        Reads the company registry, not the freshness view: the registry is a

        small table while a fleet-wide `DISTINCT` over the view is a full rollup

        (~10s measured on prod).'
      operationId: list_internal_tenants_api_v2_freshness_internal_tenants_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalTenantListResponse'
        '403':
          description: Internal dashboard — Altimate staff only
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 List Internal Tenants Api V2 Freshness Internal Tenants Get
        '404':
          description: Unknown tenant
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 List Internal Tenants Api V2 Freshness Internal Tenants Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/freshness/internal/detail:
    get:
      tags:
      - APPS_V2
      summary: Get Internal Freshness Detail
      description: 'Both freshness grains for one tenant, in a single call.


        `groups` is the FULL rollup, including the groups in

        `apps.freshness.grouping.HIDDEN_FROM_TENANT_GROUPS`; the tenant-facing

        feed filters those out at the endpoint, so this response is a superset of

        what the tenant panel renders. `datasets` is every `dataset_type` behind

        it, including the ones the taxonomy excludes (flagged `excluded`, with a

        null `group_key`).'
      operationId: get_internal_freshness_detail_api_v2_freshness_internal_detail_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: tenant_name
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Tenant to inspect. NOT named `tenant` — see module docstring.
          title: Tenant Name
        description: Tenant to inspect. NOT named `tenant` — see module docstring.
      - name: x-tenant
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalFreshnessDetailResponse'
        '403':
          description: Internal dashboard — Altimate staff only
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Get Internal Freshness Detail Api V2 Freshness Internal Detail Get
        '404':
          description: Unknown tenant
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Get Internal Freshness Detail Api V2 Freshness Internal Detail Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/datasets:
    get:
      tags:
      - APPS_V2
      summary: List Datasets Endpoint
      description: 'List datasets visible on the requesting tenant''s platform whose

        feature flag (if any) is on for the tenant.'
      operationId: list_datasets_endpoint_api_v2_datasets_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      - name: x-user-group-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Group-Id
      - name: x-timezone
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Timezone
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetDescriptor'
                title: Response List Datasets Endpoint Api V2 Datasets Get
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 List Datasets Endpoint Api V2 Datasets Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/datasets/{name}:
    get:
      tags:
      - APPS_V2
      summary: Get Dataset Endpoint
      description: 'Return a single dataset''s descriptor.


        Resolved via `visible_dataset` — the SAME platform-visibility (and

        feature-flag) gate `POST /datasets/{name}/query` uses — so a dataset

        registered for another platform 404s (`DATASET_NOT_FOUND`), and a

        flag-gated dataset with its flag off 404s (`FEATURE_NOT_ENABLED`),

        rather than either confirming its existence to a caller who should not

        see it. Route ordering matters here: this route is declared AFTER `GET

        /datasets` (the bare-path list endpoint) but that is not what prevents

        shadowing — `/datasets/{name}` requires an extra path segment that a

        request for plain `/datasets` never supplies, so the two can never

        collide regardless of registration order. Verified by the throwaway

        script''s `TestClient` check that both still resolve.'
      operationId: get_dataset_endpoint_api_v2_datasets__name__get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      - name: x-user-group-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Group-Id
      - name: x-timezone
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Timezone
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetDescriptor'
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Get Dataset Endpoint Api V2 Datasets  Name  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/datasets/{name}/query:
    post:
      tags:
      - APPS_V2
      summary: Query Dataset Endpoint
      description: 'Run a dataset query and return the engine''s column/row envelope.


        `timezone` (from the `x-timezone` header, default `"UTC"`) buckets any

        `granularity`-based trend in the caller''s timezone, matching v1''s `GET

        /warehouse/cost/v2/` — see `apps.engine.sql_builder.SqlBuilder.date_trunc`

        for how it stays a bound parameter rather than an interpolated value.'
      operationId: query_dataset_endpoint_api_v2_datasets__name__query_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      - name: x-user-group-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Group-Id
      - name: x-timezone
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Timezone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetQueryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetEnvelope'
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Query Dataset Endpoint Api V2 Datasets  Name  Query Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v2/datasets/{name}/export:
    post:
      tags:
      - APPS_V2
      summary: Export Dataset Endpoint
      description: 'Export a dataset''s full RBAC-scoped result as a CSV download.


        Reuses the exact query pipeline `POST /datasets/{name}/query` runs

        (`apps.engine.service.run_dataset_export`, via `run_dataset_query(...,

        export_mode=True)`) — same RBAC resolve, same filter/sort/search

        normalization — so an export can never disagree with what the table

        endpoint would have shown for an identical request. No separate

        freshness endpoint or field here: freshness is delivered on the query

        endpoints'' own response metas, not on a one-shot CSV download.'
      operationId: export_dataset_endpoint_api_v2_datasets__name__export_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      - name: x-user-group-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Group-Id
      - name: x-timezone
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Timezone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetQueryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Export Dataset Endpoint Api V2 Datasets  Name  Export Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
