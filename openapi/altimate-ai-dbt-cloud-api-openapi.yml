openapi: 3.1.0
info:
  title: Fast ACCOUNT_COSTS DBT_CLOUD API
  version: 0.1.0
tags:
- name: DBT_CLOUD
paths:
  /api/v1/dbt/cloud/connections:
    post:
      tags:
      - DBT_CLOUD
      summary: Create Connection
      description: 'Create a new dbt Cloud connection.


        This will:

        1. Validate the API token

        2. Create the connection record

        3. Discover all projects and environments

        4. Create DBTCoreIntegration records for each project'
      operationId: create_connection_api_v1_dbt_cloud_connections_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DbtCloudConnectionCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtCloudConnectionResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Create Connection Api V1 Dbt Cloud Connections Post
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Create Connection Api V1 Dbt Cloud Connections Post
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Create Connection Api V1 Dbt Cloud Connections Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - DBT_CLOUD
      summary: List Connections
      description: List all dbt Cloud connections.
      operationId: list_connections_api_v1_dbt_cloud_connections_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtCloudConnectionListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 List Connections Api V1 Dbt Cloud Connections Get
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 List Connections Api V1 Dbt Cloud Connections Get
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 List Connections Api V1 Dbt Cloud Connections Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dbt/cloud/connections/{connection_id}:
    get:
      tags:
      - DBT_CLOUD
      summary: Get Connection
      description: Get a dbt Cloud connection with all projects and environments.
      operationId: get_connection_api_v1_dbt_cloud_connections__connection_id__get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: integer
          title: Connection Id
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtCloudConnectionResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Get Connection Api V1 Dbt Cloud Connections  Connection Id  Get
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Get Connection Api V1 Dbt Cloud Connections  Connection Id  Get
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Get Connection Api V1 Dbt Cloud Connections  Connection Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - DBT_CLOUD
      summary: Delete Connection
      description: 'Delete a dbt Cloud connection.


        This will permanently delete the connection and all associated records:

        - dbt Cloud projects and environments

        - Associated DBTCoreIntegration records

        - Associated DBTCoreIntegrationEnvironment records

        - Periodic sync tasks'
      operationId: delete_connection_api_v1_dbt_cloud_connections__connection_id__delete
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: integer
          title: Connection Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Delete Connection Api V1 Dbt Cloud Connections  Connection Id  Delete
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Delete Connection Api V1 Dbt Cloud Connections  Connection Id  Delete
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Delete Connection Api V1 Dbt Cloud Connections  Connection Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - DBT_CLOUD
      summary: Update Connection
      description: 'Update an existing dbt Cloud connection.


        Allows updating:

        - name: Connection display name

        - api_token: Service token (will be validated)

        - api_base_url: API base URL


        If api_token is provided, it will be validated against dbt Cloud API.'
      operationId: update_connection_api_v1_dbt_cloud_connections__connection_id__patch
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: integer
          title: Connection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DbtCloudConnectionUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtCloudConnectionResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Update Connection Api V1 Dbt Cloud Connections  Connection Id  Patch
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Update Connection Api V1 Dbt Cloud Connections  Connection Id  Patch
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Update Connection Api V1 Dbt Cloud Connections  Connection Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dbt/cloud/connections/{connection_id}/refresh:
    post:
      tags:
      - DBT_CLOUD
      summary: Refresh Connection
      description: 'Re-discover projects and environments from dbt Cloud.


        Use this to sync new projects/environments that were added in dbt Cloud.'
      operationId: refresh_connection_api_v1_dbt_cloud_connections__connection_id__refresh_post
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: integer
          title: Connection Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtCloudDiscoveryResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Refresh Connection Api V1 Dbt Cloud Connections  Connection Id  Refresh
                  Post
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Refresh Connection Api V1 Dbt Cloud Connections  Connection Id  Refresh
                  Post
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Refresh Connection Api V1 Dbt Cloud Connections  Connection Id  Refresh
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dbt/cloud/projects/{project_id}:
    patch:
      tags:
      - DBT_CLOUD
      summary: Update Project
      description: Enable or disable sync for a dbt Cloud project.
      operationId: update_project_api_v1_dbt_cloud_projects__project_id__patch
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DbtCloudProjectUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtCloudProjectResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Update Project Api V1 Dbt Cloud Projects  Project Id  Patch
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Update Project Api V1 Dbt Cloud Projects  Project Id  Patch
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Update Project Api V1 Dbt Cloud Projects  Project Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dbt/cloud/environments/{environment_id}:
    patch:
      tags:
      - DBT_CLOUD
      summary: Update Environment
      description: Enable or disable sync for a dbt Cloud environment.
      operationId: update_environment_api_v1_dbt_cloud_environments__environment_id__patch
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: environment_id
        in: path
        required: true
        schema:
          type: integer
          title: Environment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DbtCloudEnvironmentUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtCloudEnvironmentResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Update Environment Api V1 Dbt Cloud Environments  Environment Id  Patch
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Update Environment Api V1 Dbt Cloud Environments  Environment Id  Patch
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Update Environment Api V1 Dbt Cloud Environments  Environment Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dbt/cloud/connections/{connection_id}/sync:
    post:
      tags:
      - DBT_CLOUD
      summary: Trigger Sync
      description: "Trigger a manual sync for all enabled projects/environments.\n\nThis will queue a\
        \ background task to:\n1. Fetch new runs from dbt Cloud\n2. Download artifacts\n3. Upload to S3\n\
        4. Trigger ingestion pipeline\n\nArgs:\n    force: If True, resets processed runs to force re-download\
        \ of all artifacts"
      operationId: trigger_sync_api_v1_dbt_cloud_connections__connection_id__sync_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: integer
          title: Connection Id
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Force
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtCloudSyncResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Trigger Sync Api V1 Dbt Cloud Connections  Connection Id  Sync Post
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Trigger Sync Api V1 Dbt Cloud Connections  Connection Id  Sync Post
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Trigger Sync Api V1 Dbt Cloud Connections  Connection Id  Sync Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dbt/cloud/connections/{connection_id}/sync-history:
    get:
      tags:
      - DBT_CLOUD
      summary: Get Sync History
      description: Get sync history for a connection with pagination.
      operationId: get_sync_history_api_v1_dbt_cloud_connections__connection_id__sync_history_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: integer
          title: Connection Id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Size
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtCloudSyncHistoryResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Get Sync History Api V1 Dbt Cloud Connections  Connection Id  Sync
                  History Get
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Get Sync History Api V1 Dbt Cloud Connections  Connection Id  Sync
                  History Get
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Get Sync History Api V1 Dbt Cloud Connections  Connection Id  Sync
                  History Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dbt/cloud/connections/{connection_id}/schedule:
    patch:
      tags:
      - DBT_CLOUD
      summary: Update Schedule
      description: Update the sync schedule for a connection.
      operationId: update_schedule_api_v1_dbt_cloud_connections__connection_id__schedule_patch
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: integer
          title: Connection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DbtCloudScheduleUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DbtCloudScheduleResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Update Schedule Api V1 Dbt Cloud Connections  Connection Id  Schedule
                  Patch
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Update Schedule Api V1 Dbt Cloud Connections  Connection Id  Schedule
                  Patch
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
