openapi: 3.1.0
info:
  title: Fast ACCOUNT_COSTS langfuse API
  version: 0.1.0
tags:
- name: langfuse
paths:
  /api/langfuse/queries:
    get:
      tags:
      - langfuse
      summary: Get Clickhouse Queries
      description: 'Get ClickHouse queries from Langfuse observations.


        Fetches observations with name ''mcp__altimate__clickhouse_query'' from Langfuse

        within the specified date range. Returns paginated results.'
      operationId: get_clickhouse_queries_api_langfuse_queries_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Start date in ISO format
          title: Start Date
        description: Start date in ISO format
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: End date in ISO format
          title: End Date
        description: End date in ISO format
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Results per page
          default: 20
          title: Limit
        description: Results per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LangfuseQueriesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/langfuse/prompts:
    get:
      tags:
      - langfuse
      summary: Get Prompts
      description: 'Get prompts from Langfuse.


        Fetches prompt configurations from Langfuse, optionally filtered by name, label, or tag.'
      operationId: get_prompts_api_langfuse_prompts_get
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by prompt name
          title: Name
        description: Filter by prompt name
      - name: label
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by label
          title: Label
        description: Filter by label
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by tag
          title: Tag
        description: Filter by tag
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LangfusePromptsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ClickHouseQueryDetail:
      properties:
        id:
          type: string
          title: Id
          description: Observation ID
        query:
          type: string
          title: Query
          description: SQL query text
        tables:
          items:
            type: string
          type: array
          title: Tables
          description: Tables referenced
        session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Session Id
          description: Session ID if available
        trace_id:
          type: string
          title: Trace Id
          description: Trace ID
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
          description: User ID
        tenant:
          type: string
          title: Tenant
          description: Tenant name
        executed_at:
          type: string
          format: date-time
          title: Executed At
          description: Execution timestamp
        duration_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration Ms
          description: Execution duration in ms
        status:
          type: string
          title: Status
          description: Execution status
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Error message if failed
        result_preview:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Result Preview
          description: Preview of query results
      type: object
      required:
      - id
      - query
      - trace_id
      - tenant
      - executed_at
      - status
      title: ClickHouseQueryDetail
      description: Details of a single ClickHouse query from Langfuse.
    LangfusePromptConfig:
      properties:
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
          description: Model name
        temperature:
          anyOf:
          - type: number
          - type: 'null'
          title: Temperature
          description: Temperature setting
        max_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Tokens
          description: Max tokens
        top_p:
          anyOf:
          - type: number
          - type: 'null'
          title: Top P
          description: Top P setting
        frequency_penalty:
          anyOf:
          - type: number
          - type: 'null'
          title: Frequency Penalty
          description: Frequency penalty
        presence_penalty:
          anyOf:
          - type: number
          - type: 'null'
          title: Presence Penalty
          description: Presence penalty
      type: object
      title: LangfusePromptConfig
      description: Configuration for a Langfuse prompt.
    LangfuseQueriesResponse:
      properties:
        queries:
          items:
            $ref: '#/components/schemas/ClickHouseQueryDetail'
          type: array
          title: Queries
          description: List of queries
        total_pages:
          type: integer
          title: Total Pages
          description: Total number of pages
        current_page:
          type: integer
          title: Current Page
          description: Current page number
        has_more:
          type: boolean
          title: Has More
          description: Whether there are more pages
          default: false
        langfuse_project_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Langfuse Project Id
          description: Langfuse project ID for constructing trace links
      type: object
      required:
      - total_pages
      - current_page
      title: LangfuseQueriesResponse
      description: Response containing ClickHouse queries.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LangfusePromptsResponse:
      properties:
        prompts:
          items:
            $ref: '#/components/schemas/LangfusePrompt'
          type: array
          title: Prompts
          description: List of prompts
        total:
          type: integer
          title: Total
          description: Total number of prompts
      type: object
      required:
      - total
      title: LangfusePromptsResponse
      description: Response containing list of Langfuse prompts.
    LangfusePrompt:
      properties:
        name:
          type: string
          title: Name
          description: Prompt name
        version:
          type: integer
          title: Version
          description: Version number
        prompt:
          type: string
          title: Prompt
          description: Prompt text or template
        type:
          type: string
          title: Type
          description: Prompt type (text, chat)
        labels:
          items:
            type: string
          type: array
          title: Labels
          description: Labels
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Tags
        config:
          anyOf:
          - $ref: '#/components/schemas/LangfusePromptConfig'
          - type: 'null'
          description: Configuration
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Last update timestamp
      type: object
      required:
      - name
      - version
      - prompt
      - type
      - created_at
      - updated_at
      title: LangfusePrompt
      description: Details of a Langfuse prompt.
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
