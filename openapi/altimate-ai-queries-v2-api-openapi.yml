  /query/v2/filters/custom-tag-values/:
    get:
      tags:
      - QUERIES_V2
      summary: Get Custom Tag Values
      description: 'Get distinct values for a custom tag key from the query_tag JSON column.


        This endpoint extracts distinct values for a specified JSON key from the query_tag

        column in the query usage data. It supports optional search filtering and pagination.


        Use cases:

        - Get all distinct values for ''dbt_snowflake_query_tags_version''

        - Get distinct values matching a search pattern (e.g., values starting with ''2.5'')

        - Retrieve entities/values for a custom tag key for filtering purposes


        Example usage:

        - GET /filters/custom-tag-values/?tag_key=dbt_snowflake_query_tags_version

        - GET /filters/custom-tag-values/?tag_key=dbt_snowflake_query_tags_version&search=2.5

        - GET /filters/custom-tag-values/?tag_key=project_name&prefix=custom_tags'
      operationId: get_custom_tag_values_query_v2_filters_custom_tag_values__get
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: tag_key
        in: query
        required: true
        schema:
          type: string
          description: The JSON key to extract values from query_tag
          title: Tag Key
        description: The JSON key to extract values from query_tag
      - name: prefix
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional prefix path in the query_tag JSON (for nested JSON structures)
          title: Prefix
        description: Optional prefix path in the query_tag JSON (for nested JSON structures)
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional search string to filter values (ILIKE pattern)
          title: Search
        description: Optional search string to filter values (ILIKE pattern)
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed)
          default: 1
          title: Page
        description: Page number (1-indexed)
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Number of items per page
          default: 50
          title: Size
        description: Number of items per page
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomTagValuesResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Get Custom Tag Values Query V2 Filters Custom Tag Values  Get
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Get Custom Tag Values Query V2 Filters Custom Tag Values  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
