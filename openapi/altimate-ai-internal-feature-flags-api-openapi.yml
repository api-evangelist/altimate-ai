openapi: 3.2.0
info:
  title: Fast INTERNAL FEATURE FLAGS API
  version: 0.1.0
tags:
- name: INTERNAL_FEATURE_FLAGS
paths:
  /internal/feature-flags/tenants:
    get:
      tags:
      - INTERNAL_FEATURE_FLAGS
      summary: List Tenants
      operationId: list_tenants_internal_feature_flags_tenants_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Search
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/app__api__internal_feature_flags__InternalTenant'
                title: Response List Tenants Internal Feature Flags Tenants Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/feature-flags/tenants/{tenant_name}:
    get:
      tags:
      - INTERNAL_FEATURE_FLAGS
      summary: Get Tenant Flags
      operationId: get_tenant_flags_internal_feature_flags_tenants__tenant_name__get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: tenant_name
        in: path
        required: true
        schema:
          type: string
          title: Tenant Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantFlags'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - INTERNAL_FEATURE_FLAGS
      summary: Update Tenant Flags
      description: Apply the requested set/reset operations; returns the committed state.
      operationId: update_tenant_flags_internal_feature_flags_tenants__tenant_name__patch
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: tenant_name
        in: path
        required: true
        schema:
          type: string
          title: Tenant Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagChangeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantFlags'
        '400':
          description: No IdP is configured for this login host
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Update Tenant Flags Internal Feature Flags Tenants  Tenant Name  Patch
        '422':
          description: Unknown flag, invalid value or login host
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 422 Update Tenant Flags Internal Feature Flags Tenants  Tenant Name  Patch
        '503':
          description: Could not verify the identity provider configuration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 503 Update Tenant Flags Internal Feature Flags Tenants  Tenant Name  Patch
  /internal/feature-flags/tenants/{tenant_name}/history:
    get:
      tags:
      - INTERNAL_FEATURE_FLAGS
      summary: Get Tenant Flag History
      description: Newest first. Page with ``before_id`` = the last ``id`` received.
      operationId: get_tenant_flag_history_internal_feature_flags_tenants__tenant_name__history_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: tenant_name
        in: path
        required: true
        schema:
          type: string
          title: Tenant Name
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: before_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Before Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlagAuditEntry'
                title: Response Get Tenant Flag History Internal Feature Flags Tenants  Tenant Name  History Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    app__api__internal_feature_flags__InternalTenant:
      properties:
        name:
          type: string
          title: Name
        tenant_alias:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Alias
        provider:
          type: string
          title: Provider
        status:
          type: string
          title: Status
      type: object
      required:
      - name
      - provider
      - status
      title: InternalTenant
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    FlagChangeRequest:
      properties:
        changes:
          additionalProperties: true
          type: object
          minProperties: 1
          title: Changes
        host:
          anyOf:
          - type: string
          - type: 'null'
          title: Host
        reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Reason
      additionalProperties: false
      type: object
      required:
      - changes
      title: FlagChangeRequest
    TenantFlags:
      properties:
        tenant_name:
          type: string
          title: Tenant Name
        hosts:
          items:
            type: string
          type: array
          title: Hosts
        flags:
          items:
            $ref: '#/components/schemas/TenantFlag'
          type: array
          title: Flags
      type: object
      required:
      - tenant_name
      - hosts
      - flags
      title: TenantFlags
    TenantFlag:
      properties:
        key:
          type: string
          title: Key
        type:
          type: string
          title: Type
        default:
          title: Default
        editable:
          type: boolean
          title: Editable
        host_scoped:
          type: boolean
          title: Host Scoped
        overridden:
          type: boolean
          title: Overridden
        override:
          title: Override
        effective:
          title: Effective
      type: object
      required:
      - key
      - type
      - editable
      - host_scoped
      - overridden
      title: TenantFlag
    FlagAuditEntry:
      properties:
        id:
          type: integer
          title: Id
        created_at:
          title: Created At
        flag_key:
          type: string
          title: Flag Key
        host:
          anyOf:
          - type: string
          - type: 'null'
          title: Host
        old_present:
          type: boolean
          title: Old Present
        old_value:
          title: Old Value
        new_present:
          type: boolean
          title: New Present
        new_value:
          title: New Value
        actor_email:
          type: string
          title: Actor Email
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      required:
      - id
      - created_at
      - flag_key
      - old_present
      - new_present
      - actor_email
      title: FlagAuditEntry
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
