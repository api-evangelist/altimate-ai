openapi: 3.2.0
info:
  title: Fast Semantic Metrics API
  version: 0.1.0
tags:
- name: Semantic Metrics
paths:
  /copilot/semantic-metrics/list:
    get:
      tags:
      - Semantic Metrics
      summary: List Metrics
      description: List all available semantic metrics with dimensions.
      operationId: list_metrics_copilot_semantic_metrics_list_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
      - HTTPBearer: []
  /copilot/semantic-metrics/details:
    post:
      tags:
      - Semantic Metrics
      summary: Get Details
      description: Get detailed metric definitions including dimensions and measures.
      operationId: get_details_copilot_semantic_metrics_details_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricDetailsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
      - HTTPBearer: []
  /copilot/semantic-metrics/query:
    post:
      tags:
      - Semantic Metrics
      summary: Execute Query
      description: 'Compile and execute a semantic metric query with the caller''s row scope.


        ``user_group_id`` is the team the caller selected (``x-user-group-id``)

        after membership validation; ``rbac_scope_enabled`` is the tenant RBAC

        decision for this caller (False for owners with no team, True for

        non-owners and for anyone who selected a team). Both are threaded into

        the request context so ``query_metric`` executes through the same

        row-policy settings as the Studio MCP path. ``require_team_or_owner_scope``

        refuses a non-owner with no team before this body runs.'
      operationId: execute_query_copilot_semantic_metrics_query_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricQueryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    MetricDetailsRequest:
      properties:
        metric_names:
          items:
            type: string
          type: array
          title: Metric Names
      type: object
      required:
      - metric_names
      title: MetricDetailsRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    MetricQueryRequest:
      properties:
        metrics:
          items:
            type: string
          type: array
          title: Metrics
        group_by:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Group By
        where:
          anyOf:
          - type: string
          - type: 'null'
          title: Where
        order_by:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Order By
        limit:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      type: object
      required:
      - metrics
      title: MetricQueryRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: Altimate AI
  source: https://api.myaltimate.com/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
