openapi: 3.2.0
info:
  title: Fast Databricks Jobs API
  version: 0.1.0
tags:
- name: Databricks Jobs
paths:
  /api/v1/databricks/jobs/failing:
    get:
      tags:
      - Databricks Jobs
      summary: Get jobs with high failure rates
      description: Get jobs with high failure rates.
      operationId: get_failing_jobs_api_v1_databricks_jobs_failing_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: min_failure_rate
        in: query
        required: false
        schema:
          type: number
          description: Minimum failure rate percentage
          default: 20.0
          title: Min Failure Rate
        description: Minimum failure rate percentage
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Start date for statistics
          title: Start Date
        description: Start date for statistics
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
          description: End date for statistics
          title: End Date
        description: End date for statistics
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by workspace ID
          title: Workspace Id
        description: Filter by workspace ID
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailingJobsResponse'
        '403':
          description: Not authorized
        '404':
          description: No ClickHouse database configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/jobs/recent-failures:
    get:
      tags:
      - Databricks Jobs
      summary: Get recent job failures
      description: Get recent job failures.
      operationId: get_recent_failures_api_v1_databricks_jobs_recent_failures_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 720
          exclusiveMinimum: 0
          description: Hours to look back (1-720).
          default: 24
          title: Hours
        description: Hours to look back (1-720).
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by workspace ID
          title: Workspace Id
        description: Filter by workspace ID
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentFailuresResponse'
        '403':
          description: Not authorized
        '404':
          description: No ClickHouse database configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/jobs/{job_id}:
    get:
      tags:
      - Databricks Jobs
      summary: Get job details
      description: Get detailed information for a specific job.
      operationId: get_job_detail_api_v1_databricks_jobs__job_id__get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
        '403':
          description: Not authorized
        '404':
          description: Job not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/jobs/{job_id}/trends:
    get:
      tags:
      - Databricks Jobs
      summary: Get job run trends over time
      description: Get run trends over time for a specific job.
      operationId: get_single_job_run_trends_api_v1_databricks_jobs__job_id__trends_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Start date
          title: Start Date
        description: Start date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
          description: End date
          title: End Date
        description: End date
      - name: granularity
        in: query
        required: false
        schema:
          type: string
          description: 'Time granularity: ''day'', ''week'', or ''month'''
          default: day
          title: Granularity
        description: 'Time granularity: ''day'', ''week'', or ''month'''
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunTrendsResponse'
        '403':
          description: Not authorized
        '404':
          description: No ClickHouse database configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/jobs/{job_id}/auto-tune/savings-trends:
    get:
      tags:
      - Databricks Jobs
      summary: Get per-day auto-tune savings (realized + potential) for a job
      description: 'Get realized and potential auto-tune savings per day for a job,

        each split into DBU and infra components and scoped to the run window.'
      operationId: get_job_auto_tune_savings_trends_api_v1_databricks_jobs__job_id__auto_tune_savings_trends_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: instance_id
        in: query
        required: true
        schema:
          type: integer
          description: Databricks instance id
          title: Instance Id
        description: Databricks instance id
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Start date
          title: Start Date
        description: Start date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
          description: End date
          title: End Date
        description: End date
      - name: granularity
        in: query
        required: false
        schema:
          type: string
          description: 'Time granularity: ''day'', ''week'', or ''month'''
          default: day
          title: Granularity
        description: 'Time granularity: ''day'', ''week'', or ''month'''
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoTuneSavingsTrendsResponse'
        '403':
          description: Not authorized
        '404':
          description: No ClickHouse database configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/jobs/{job_id}/auto-tune/infra-cost-trends:
    get:
      tags:
      - Databricks Jobs
      summary: Per-period Infra-mode cost/savings series for a job
      description: 'Cost Savings chart data for Infra mode: cloud cost from

        ``dbx_cloud_cost_daily`` plus the savings mart''s infra-savings leg, in

        the same response shape as the DBU-mode savings-trends endpoint.

        Empty series when the tenant has no cloud-cost feed.'
      operationId: get_job_auto_tune_infra_cost_trends_api_v1_databricks_jobs__job_id__auto_tune_infra_cost_trends_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: instance_id
        in: query
        required: true
        schema:
          type: integer
          description: Databricks instance id
          title: Instance Id
        description: Databricks instance id
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional Databricks workspace_id to scope the lookup.
          title: Workspace Id
        description: Optional Databricks workspace_id to scope the lookup.
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Start date
          title: Start Date
        description: Start date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
          description: End date
          title: End Date
        description: End date
      - name: granularity
        in: query
        required: false
        schema:
          type: string
          description: 'Time granularity: ''day'', ''week'', or ''month'''
          default: day
          title: Granularity
        description: 'Time granularity: ''day'', ''week'', or ''month'''
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoTuneSavingsTrendsResponse'
        '403':
          description: Not authorized
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/jobs/{job_id}/task-runs:
    get:
      tags:
      - Databricks Jobs
      summary: Get the job-level task summary (one row per task on the DAG)
      description: 'Job-level task list: one aggregated row per task on the job''s DAG.'
      operationId: get_job_tasks_api_v1_databricks_jobs__job_id__task_runs_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Start date
          title: Start Date
        description: Start date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
          description: End date
          title: End Date
        description: End date
      - name: sortAttribute
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Column name to sort by. Valid columns: task_key, result_state, start_time, total_duration_seconds, cost_cents.'
          title: Sortattribute
        description: 'Column name to sort by. Valid columns: task_key, result_state, start_time, total_duration_seconds, cost_cents.'
      - name: sortOrder
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Sort direction: ''asc'' or ''desc'' (defaults to ''desc'').'
          title: Sortorder
        description: 'Sort direction: ''asc'' or ''desc'' (defaults to ''desc'').'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed)
          default: 1
          title: Page
        description: Page number (1-indexed)
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 20
          title: Page Size
        description: Items per page
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTaskRunsResponse'
        '403':
          description: Not authorized
        '404':
          description: No ClickHouse database configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/jobs/{job_id}/task-runs/detail:
    get:
      tags:
      - Databricks Jobs
      summary: Get run/task-scoped task runs (requires run_id or task_key)
      description: 'Run/task-scoped task runs: one row per ``(task_key, job_run_id)``.


        Requires ``run_id`` (the tasks of a specific run) or ``task_key`` (one

        task''s runs over time).'
      operationId: get_job_task_run_detail_api_v1_databricks_jobs__job_id__task_runs_detail_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Start date
          title: Start Date
        description: Start date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
          description: End date
          title: End Date
        description: End date
      - name: run_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by specific run ID
          title: Run Id
        description: Filter by specific run ID
      - name: task_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by specific task key
          title: Task Key
        description: Filter by specific task key
      - name: sortAttribute
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Column name to sort by. Valid columns: task_key, result_state, start_time, total_duration_seconds, cost_cents.'
          title: Sortattribute
        description: 'Column name to sort by. Valid columns: task_key, result_state, start_time, total_duration_seconds, cost_cents.'
      - name: sortOrder
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Sort direction: ''asc'' or ''desc'' (defaults to ''desc'').'
          title: Sortorder
        description: 'Sort direction: ''asc'' or ''desc'' (defaults to ''desc'').'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed)
          default: 1
          title: Page
        description: Page number (1-indexed)
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 20
          title: Page Size
        description: Items per page
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobTaskRunsResponse'
        '400':
          description: run_id or task_key required
        '403':
          description: Not authorized
        '404':
          description: No ClickHouse database configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/jobs/{job_id}/tasks/{task_key}/runs-graph:
    get:
      tags:
      - Databricks Jobs
      summary: Get chart-ready time series of runs for a single task
      description: 'Return one chart point per run of ``task_key`` on this job.


        Shape mirrors ``/query/v2/snowflake_jobs/runs_graph/{workflow_id}``

        so the FE chart component is reusable: ``query_cost`` is USD and

        ``execution_time`` is milliseconds. Annotations are intentionally

        omitted for the Databricks chart.'
      operationId: get_task_runs_graph_api_v1_databricks_jobs__job_id__tasks__task_key__runs_graph_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: task_key
        in: path
        required: true
        schema:
          type: string
          title: Task Key
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Start date (inclusive)
          title: Start Date
        description: Start date (inclusive)
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
          description: End date (inclusive)
          title: End Date
        description: End date (inclusive)
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatabricksTaskRunGraphPoint'
                title: Response Get Task Runs Graph Api V1 Databricks Jobs  Job Id  Tasks  Task Key  Runs Graph Get
        '403':
          description: Not authorized
        '404':
          description: No ClickHouse database configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/jobs/{job_id}/tasks/{task_key}/stats:
    get:
      tags:
      - Databricks Jobs
      summary: Get aggregate run stats for a single task in a date window
      description: 'Return total/succeeded/failed run counts and mean duration for

        ``task_key`` on this job. Counts ignore pagination.'
      operationId: get_task_stats_api_v1_databricks_jobs__job_id__tasks__task_key__stats_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: task_key
        in: path
        required: true
        schema:
          type: string
          title: Task Key
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Start date (inclusive)
          title: Start Date
        description: Start date (inclusive)
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
          description: End date (inclusive)
          title: End Date
        description: End date (inclusive)
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabricksTaskStatsResponse'
        '403':
          description: Not authorized
        '404':
          description: No ClickHouse database configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/jobs/{job_id}/runs/{run_id}/spark-ui:
    get:
      tags:
      - Databricks Jobs
      summary: Get the Databricks Spark UI URL for a job run
      description: 'Build the deep link to the Databricks Spark UI for a job run.


        Thin pass-through to ``DatabricksJobService.resolve_databricks_spark_ui``; that

        method does the lookup → cred-resolve → runs/get → URL-compose flow

        and maps the expected failure modes to ``state`` values on the

        always-200 response.'
      operationId: get_job_run_spark_ui_api_v1_databricks_jobs__job_id__runs__run_id__spark_ui_get
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: task_run_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: When set, return the Spark UI for this specific task run (matched against tasks[*].run_id in the Databricks runs/get response). Use the top-level run's driver UI when omitted.
          title: Task Run Id
        description: When set, return the Spark UI for this specific task run (matched against tasks[*].run_id in the Databricks runs/get response). Use the top-level run's driver UI when omitted.
      - name: task_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Match against tasks[*].task_key in the Databricks runs/get response. Alternative to task_run_id — use this when only task_key is known (e.g. the job-level Tasks tab). Ignored when task_run_id is set.
          title: Task Key
        description: Match against tasks[*].task_key in the Databricks runs/get response. Alternative to task_run_id — use this when only task_key is known (e.g. the job-level Tasks tab). Ignored when task_run_id is set.
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Workspace ID — required for multi-workspace tenants to route credential lookup to the correct workspace.
          title: Workspace Id
        description: Workspace ID — required for multi-workspace tenants to route credential lookup to the correct workspace.
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunSparkUiResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/jobs/{job_id}/tasks-inventory:
    get:
      tags:
      - Databricks Jobs
      summary: Get the static task list for a Databricks job
      description: 'Return every task defined on the job''s workflow DAG (regardless

        of whether the task has been run or has an Auto Tune

        recommendation). Sourced from ``dbx_job_tasks_inventory``.


        The Auto Tune drawer DAG and the overview "Tasks" tile use this as

        the authoritative task list so they don''t depend on the recs feed

        or task-runs windowing for the denominator.


