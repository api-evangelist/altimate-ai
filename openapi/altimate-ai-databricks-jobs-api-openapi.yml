openapi: 3.1.0
info:
  title: Fast ACCOUNT_COSTS Databricks Jobs API
  version: 0.1.0
tags:
- name: Databricks Jobs
paths:
  /api/v1/databricks/jobs/filters:
    get:
      tags:
      - Databricks Jobs
      summary: Get filter options for jobs
      description: Get distinct filter values for job filtering.
      operationId: get_job_filters_api_v1_databricks_jobs_filters_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: prefix
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search prefix for name filters
          title: Prefix
        description: Search prefix for name filters
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Workspace ID to filter by
          title: Workspace Id
        description: Workspace ID to filter by
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobFilterOptions'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/jobs/filters/job_names:
    get:
      tags:
      - Databricks Jobs
