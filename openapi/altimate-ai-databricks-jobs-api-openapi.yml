            format: date-time
          - type: 'null'
          title: Last Failure Time
      type: object
      required:
      - job_id
      - job_name
      - workspace_id
      - total_runs
      - failed_runs
      - failure_rate
      title: FailingJob
      description: A job with high failure rate.
    ToggleAutoTunePreflight:
      properties:
        blocked:
          type: boolean
          title: Blocked
          default: false
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        actionable_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Actionable Message
        can_manage_blocked:
          type: boolean
          title: Can Manage Blocked
          default: false
        turn_off_allowed:
          type: boolean
          title: Turn Off Allowed
          default: false
      type: object
      title: ToggleAutoTunePreflight
      description: 'Surfaced to the FE so it can render an actionable error inline.


        When ``blocked=False`` the toggle pipeline ran. When ``blocked=True``

        no DB writes happened and ``actionable_message`` should be shown to

        the user verbatim (e.g. "ask your workspace admin to add r5.xlarge

        to the policy allowlist").'
    ValidationError:
      properties:
        loc:
          items:
