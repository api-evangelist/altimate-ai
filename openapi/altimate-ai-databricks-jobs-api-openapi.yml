      description: 'Enable/disable events across every task under this job, for the

        Cost Savings chart''s vertical markers.


        Each user toggle click writes one job-level ``JOB_AUTO_TUNE_ENABLED`` /

        ``JOB_AUTO_TUNE_DISABLED`` row, which is the marker for that click (one

        per click and direction, however many tasks it touched). History

        written before those rows existed has no such row: its human

        ``APPLY_REQUESTED`` (enable) and ``REVERTED`` (disable) rows, one PER

        TASK, are returned as markers instead. Slot rows stamped with

        ``toggle_audit_id`` are skipped so a click is never marked twice;

        system re-arms, recovery requeues, and unattributed legacy requests are

        not toggle markers.

