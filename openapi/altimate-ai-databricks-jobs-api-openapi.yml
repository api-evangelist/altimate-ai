  /api/v1/databricks/jobs/{job_id}/runs:
    get:
      tags:
      - Databricks Jobs
      summary: Get job runs
      description: Get runs for a specific job.
      operationId: get_job_runs_api_v1_databricks_jobs__job_id__runs_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Start date
          title: Start Date
        description: Start date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
          description: End date
          title: End Date
        description: End date
      - name: result_state
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: 'Filter by result state. Repeat the query param to pass multiple values (e.g. ?result_state=FAILED&result_state=TIMED_OUT). Valid values: SUCCEEDED, FAILED, SKIPPED, CANCELLED, TIMED_OUT, ERROR, BLOCKED.'
          title: Result State
        description: 'Filter by result state. Repeat the query param to pass multiple values (e.g. ?result_state=FAILED&result_state=TIMED_OUT). Valid values: SUCCEEDED, FAILED, SKIPPED, CANCELLED, TIMED_OUT, ERROR, BLOCKED.'
