  /api/v1/databricks/jobs:
    get:
      tags:
      - Databricks Jobs
      summary: Get all Databricks jobs
      description: Get list of all jobs with run statistics.
      operationId: get_jobs_api_v1_databricks_jobs_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by workspace ID
          title: Workspace Id
        description: Filter by workspace ID
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Start date for run statistics
          title: Start Date
        description: Start date for run statistics
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
          description: End date for run statistics
          title: End Date
        description: End date for run statistics
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed)
          default: 1
          title: Page
        description: Page number (1-indexed)
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 20
          title: Page Size
        description: Items per page
      - name: sortAttribute
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Sort column name. Valid columns: job_name, workspace_name, total_runs, successful_runs, failed_runs, success_rate, avg_duration_seconds, last_run_time, total_dbus, total_cost, annualized_total_cost, auto_tune_savings.'
          title: Sortattribute
        description: 'Sort column name. Valid columns: job_name, workspace_name, total_runs, successful_runs, failed_runs, success_rate, avg_duration_seconds, last_run_time, total_dbus, total_cost, annualized_total_cost, auto_tune_savings.'
      - name: sortOrder
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Sort direction: ''asc'' or ''desc'''
          title: Sortorder
        description: 'Sort direction: ''asc'' or ''desc'''
      - name: job_names
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter by job names
          title: Job Names
        description: Filter by job names
      - name: creators
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter by creator user names
          title: Creators
        description: Filter by creator user names
      - name: workspaces
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter by workspace display names
          title: Workspaces
        description: Filter by workspace display names
      - name: auto_tune_enabled
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 'Filter by Auto Tune state: true for On, false for Off'
          title: Auto Tune Enabled
        description: 'Filter by Auto Tune state: true for On, false for Off'
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsResponse'
        '403':
          description: Not authorized
        '404':
          description: No ClickHouse database configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/databricks/jobs/summary:
    get:
      tags:
      - Databricks Jobs
      summary: Get aggregate cost summary for the Jobs list
      description: 'Aggregate cost summary feeding the Jobs page hero cards.


        Returns Total Cost, Total DBU Cost (equal to Total Cost — DBU is the

        only cost component), Total Cloud Cost (``null`` — infrastructure cost

        is not ingested), and Total Realized Savings (summed from the

        ``dbx_jobs_cost_savings`` cost mart).'
      operationId: get_jobs_summary_api_v1_databricks_jobs_summary_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date
          description: Start date for the cost window
          title: Start Date
        description: Start date for the cost window
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
          description: End date for the cost window
          title: End Date
        description: End date for the cost window
      - name: workspace_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by workspace ID
          title: Workspace Id
        description: Filter by workspace ID
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsSummaryResponse'
        '403':
          description: Not authorized
        '404':
          description: No ClickHouse database configured
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
