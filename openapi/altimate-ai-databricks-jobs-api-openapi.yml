          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Enabled Task Keys
          description: Required (and must be non-empty) when ``scope='specific_tasks'``. Rejected for any other scope. The list of task_keys the user has chosen to enable; every other rec on the job is disabled.
