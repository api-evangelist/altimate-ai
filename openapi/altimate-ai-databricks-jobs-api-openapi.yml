      title: AutoTuneSavingsTrendPoint
      description: One day's auto-tune savings, split into DBU and infra components.
    JobRunSparkUiResponse:
      properties:
        state:
          type: string
          title: State
        spark_ui_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Spark Ui Url
        workspace_host:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Host
        cluster_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Cluster Id
        spark_context_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Spark Context Id
        run_page_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Page Url
        task_run_page_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Run Page Url
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
      type: object
      required:
      - state
      title: JobRunSparkUiResponse
      description: "Deep link to the Databricks Spark UI for a job run.\n\nEndpoint always returns 200; ``state`` is the discriminator. Real\nHTTP errors (auth failures, server crashes) still surface as their\nnatural status codes and bypass this shape.\n\n``state`` values:\n\n- ``available``: happy path — render the link.\n- ``no_spark_context``: serverless / SQL warehouse / queued run — no\n  Spark UI to deep-link to. FE disables the action with a tooltip.\n- ``not_found``: job or ``task_run_id`` does not exist. FE hides the\n  action.\n- ``workspace_mismatch``: caller-supplied ``workspace_id`` does not\n  match the workspace that owns this job. FE surfaces a toast.\n- ``permission_denied``: the workspace's Service Principal lacks\n  View / Manage Run / Admin permission on this specific job. Won't\n  resolve until an admin grants permission, so FE should surface a\n  toast distinct from the transient upstream-error one.\n- ``upstream_error``: Databricks credentials missing, or the upstream\n  ``runs/get`` call failed for any other reason. FE surfaces a toast.\n\n``spark_ui_url``/``workspace_host``/``cluster_id``/``spark_context_id`` are\npresent **only** when ``state == \"available\"``. ``run_page_url`` and\n``task_run_page_url`` are populated whenever the upstream ``runs/get``\ncall succeeds — independent of the ``no_spark_context``/``available``\nsplit, which only gates the Spark UI fields. ``task_run_page_url`` is\nadditionally gated on the task being found by ``task_key``/\n``task_run_id``; it is ``None`` when no ``task_key``/``task_run_id`` was\nsupplied or no matching task was found. ``message`` carries a\nhuman-readable detail for the error states. ``spark_context_id`` is\nfetched live from the Databricks Jobs API (``runs/get``) because it is\nnot ingested into ClickHouse."
