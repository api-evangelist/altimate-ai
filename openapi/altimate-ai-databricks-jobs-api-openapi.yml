      type: object
      required:
      - state
      title: JobRunSparkUiResponse
      description: "Deep link to the Databricks Spark UI for a job run.\n\nEndpoint always returns 200; ``state`` is the discriminator. Real\nHTTP errors (auth failures, server crashes) still surface as their\nnatural status codes and bypass this shape.\n\n``state`` values:\n\n- ``available``: happy path — render the link.\n- ``no_spark_context``: serverless / SQL warehouse / queued run — no\n  Spark UI to deep-link to. FE disables the action with a tooltip.\n- ``not_found``: job or ``task_run_id`` does not exist. FE hides the\n  action.\n- ``workspace_mismatch``: caller-supplied ``workspace_id`` does not\n  match the workspace that owns this job. FE surfaces a toast.\n- ``permission_denied``: the workspace's Service Principal lacks\n  View / Manage Run / Admin permission on this specific job. Won't\n  resolve until an admin grants permission, so FE should surface a\n  toast distinct from the transient upstream-error one.\n- ``upstream_error``: Databricks credentials missing, or the upstream\n  ``runs/get`` call failed for any other reason. FE surfaces a toast.\n\nThe four URL fields are present **only** when ``state == \"available\"``.\n``message`` carries a human-readable detail for the error states.\n``spark_context_id`` is fetched live from the Databricks Jobs API\n(``runs/get``) because it is not ingested into ClickHouse."
