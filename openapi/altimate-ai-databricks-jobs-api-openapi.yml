          - type: string
          - type: 'null'
          description: 'Sort column name. Valid columns: run_id, start_time, duration_seconds, trigger_type, result_state, cost_cents.'
          title: Sortattribute
        description: 'Sort column name. Valid columns: run_id, start_time, duration_seconds, trigger_type, result_state, cost_cents.'
      - name: sortOrder
        in: query
        required: false
        schema:
          anyOf:
