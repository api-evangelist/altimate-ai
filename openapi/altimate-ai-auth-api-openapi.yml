    patch:
      tags:
      - Auth
      summary: Patch Tenant Info
      description: 'Deprecated: write tenant flags through ``PATCH /internal/feature-flags/

        tenants/{tenant_name}`` (AI-9365), which validates against the flag

        catalog, preserves concurrent edits and records an audit log.


        Kept unchanged so existing callers (Settings > Beta Features, the

        teammates toggle) keep working until they move to the new routes.'
      operationId: patch_tenant_info_auth_tenant_info_patch
      deprecated: true
      security:
      - HTTPBearer: []
      - HTTPBearer: []
