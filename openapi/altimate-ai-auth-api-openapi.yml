  /auth/social/exchange:
    post:
      tags:
      - Auth
      summary: Social Login Exchange
      description: 'Exchange a short-lived social ``login_token`` for the app user, so the

        instance subdomain can establish a session after the fixed public OAuth

        callback verified the identity. Runs on the instance subdomain, so

        ``tenant`` (from the subdomain) must match the token''s company.'
      operationId: social_login_exchange_auth_social_exchange_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialExchangeIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginOut'
        '400':
          description: Invalid token
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Social Login Exchange Auth Social Exchange Post
        '401':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 401 Social Login Exchange Auth Social Exchange Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/social/connect-token:
    post:
      tags:
      - Auth
      summary: Social Connect Token
      description: 'Mint a short-lived, one-time ``login_token`` for an already-authenticated

        user so a client (e.g. the CLI) can obtain the session/auth_token via

        /auth/social/exchange — reusing the same machinery as the Google flow.


        The raw auth_token is never handed to the client over a loopback URL; the

        exchanged token is one-time (its jti is consumed off the user row) and

        short-lived.'
      operationId: social_connect_token_auth_social_connect_token_post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Social Connect Token Auth Social Connect Token Post
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 401 Social Connect Token Auth Social Connect Token Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
