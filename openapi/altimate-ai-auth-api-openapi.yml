openapi: 3.1.0
info:
  title: Fast ACCOUNT_COSTS AUTH API
  version: 0.1.0
tags:
- name: AUTH
paths:
  /auth/login:
    post:
      tags:
      - AUTH
      summary: Auth Login
      operationId: auth_login_auth_login_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginOut'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Auth Login Auth Login Post
        '403':
          description: User not activated or User not verified yet
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Auth Login Auth Login Post
        '401':
          description: Incorrect username or password
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 401 Auth Login Auth Login Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
