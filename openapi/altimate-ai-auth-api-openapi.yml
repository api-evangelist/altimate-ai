            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/UserLoginOut'
                - $ref: '#/components/schemas/SupertokensUserInfo'
                title: Response Supertokens User Info Auth Supertokens User Info Get
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Supertokens User Info Auth Supertokens User Info Get
        '403':
          description: User not activated or User not verified yet
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Supertokens User Info Auth Supertokens User Info Get
        '401':
