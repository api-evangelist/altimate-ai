openapi: 3.2.0
info:
  title: Fast AUTH API
  version: 0.1.0
tags:
- name: Auth
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Auth Login
      operationId: auth_login_auth_login_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginOut'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Auth Login Auth Login Post
        '403':
          description: User not activated or User not verified yet
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Auth Login Auth Login Post
        '401':
          description: Incorrect username or password
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 401 Auth Login Auth Login Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/google-login:
    post:
      tags:
      - Auth
      summary: Google Staff Login
      description: 'Staff sign-in on the root domain with a Google Workspace account.


        Returns the same payload as ``/login`` for the staff member''s

        ``public_users`` row, which is created on their first sign-in. Tenant

        subdomains keep their own login flows, so this is the public tenant only.'
      operationId: google_staff_login_auth_google_login_post
      security:
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleStaffLoginIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginOut'
        '401':
          description: Not a verified Altimate staff Google account
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 401 Google Staff Login Auth Google Login Post
        '404':
          description: Only available on the root domain
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 404 Google Staff Login Auth Google Login Post
        '503':
          description: Google sign-in is not configured
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 503 Google Staff Login Auth Google Login Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
