      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: Start Date
          default: '2026-06-17T12:35:27.097497'
          title: Start Date
        description: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: End Date
          default: '2026-07-17T12:35:27.097568'
          title: End Date
        description: End Date
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Page size
          default: 50
          title: Size
        description: Page size
      - name: x-tenant
        in: header
        required: false
        schema:
          type: string
          title: X-Tenant
