            application/json:
              schema:
                $ref: '#/components/schemas/Page_CreditTransaction_'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Get My Usage Credits My Usage Table Data Get
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Get My Usage Credits My Usage Table Data Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
