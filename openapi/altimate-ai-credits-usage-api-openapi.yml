      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: filter_period
        in: query
        required: false
        schema:
          type: string
          description: 'Filter period: this_month, this_year, all_time'
          default: this_month
          title: Filter Period
        description: 'Filter period: this_month, this_year, all_time'
      - name: export_type
        in: query
        required: false
