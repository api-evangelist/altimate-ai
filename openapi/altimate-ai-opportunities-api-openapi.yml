        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_GetOpportunitiesDataResponse_'
        '400':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Get Opportunities Data Opportunities  Get
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Get Opportunities Data Opportunities  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - OPPORTUNITIES
      summary: Put Opportunities Data
      description: "Update opportunities data in both PostgreSQL and ClickHouse databases and OS(TODO:\
        \ to be removed).\n\nArgs:\n    db: Database session for PostgreSQL access\n    auth: Authentication\
        \ token containing user info\n    tenant: Tenant identifier\n    tenant_alias: Alias for the tenant\n\
        \    opportunities_data_request: Request containing opportunity changes\n    client: OpenSearch\
        \ client for legacy updates (TODO: to be removed)\n    clickhouse_client: ClickHouse client for\
        \ updating global_opportunities_aggregated table\n    is_operation_allowed: Flag indicating if\
        \ operation is allowed for tenant\n\nReturns:\n    StandardResponse with status and optional message"
      operationId: put_opportunities_data_opportunities__post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutOpportunitiesDataRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Put Opportunities Data Opportunities  Post
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Put Opportunities Data Opportunities  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
