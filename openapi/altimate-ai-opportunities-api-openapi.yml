  /opportunities/priority:
    get:
      tags:
      - Opportunities
      summary: Get Priority Opportunities Data
      description: 'Top-N curated priority opportunities for the tenant (read-only).


        AI-7715: honors the same Discover chip vocabulary as GET /opportunities/

        (all params optional; dates accepted-but-ignored per Q1 Option A).'
      operationId: get_priority_opportunities_data_opportunities_priority_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: effort
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Effort
      - name: resource_name
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Resource Name
      - name: resource_type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Resource Type
      - name: owner
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          title: Owner
      - name: user
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: User
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: 'Opportunity statuses (multi-value: repeat the param, ?status=active&status=closed). Accepted, case-insensitive: active, implemented, closed, dismissed (legacy alias: discarded). Omitted → the listing defaults to [''active''] when omitted; pass the param explicitly to include other statuses. A selection that matches no known status returns no rows.'
          title: Status
        description: 'Opportunity statuses (multi-value: repeat the param, ?status=active&status=closed). Accepted, case-insensitive: active, implemented, closed, dismissed (legacy alias: discarded). Omitted → the listing defaults to [''active''] when omitted; pass the param explicitly to include other statuses. A selection that matches no known status returns no rows.'
      - name: opportunity_name
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Opportunity Name
      - name: secondary_resource
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Secondary Resource
      - name: warehouse
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Warehouse
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Accepted for Discover URL parity but NOT applied to the curated list — enforcing the FE's 28-day default window would change the tab's default no-chip view (AI-7715 Q1 Option A).
          title: Start Date
        description: Accepted for Discover URL parity but NOT applied to the curated list — enforcing the FE's 28-day default window would change the tab's default no-chip view (AI-7715 Q1 Option A).
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Accepted for Discover URL parity but NOT applied to the curated list — see start_date (AI-7715 Q1 Option A).
          title: End Date
        description: Accepted for Discover URL parity but NOT applied to the curated list — see start_date (AI-7715 Q1 Option A).
      - name: workspace_id
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Databricks workspace IDs (multi-value). Sourced from the More-Filters Workspace chip; ignored on non-Databricks tenants.
          title: Workspace Id
        description: Databricks workspace IDs (multi-value). Sourced from the More-Filters Workspace chip; ignored on non-Databricks tenants.
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriorityOpportunityResponse'
                title: Response Get Priority Opportunities Data Opportunities Priority Get
        '400':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Get Priority Opportunities Data Opportunities Priority Get
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Get Priority Opportunities Data Opportunities Priority Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
