      description: 'Body for ``PUT /studio/opportunities`` — edit an ALREADY-PUBLISHED

        opportunity in place.


        Unlike submit, this carries no ``session_id``: you are editing a published

        opportunity, not a draft anchored to a conversation. The published

        ``opportunity_id`` is derived from the primary resource, and ClickHouse

        ``opportunity_comments`` is keyed on it, so an edit that would change the

        primary resource is rejected (``primary_resource_immutable``) rather than

        silently orphaning comments, audit rows and implemented-snapshots.'
