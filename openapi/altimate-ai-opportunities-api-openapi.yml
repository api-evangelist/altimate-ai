openapi: 3.2.0
info:
  title: Fast OPPORTUNITIES API
  version: 0.1.0
tags:
- name: Opportunities
paths:
  /opportunities/:
    get:
      tags:
      - Opportunities
      summary: Get Opportunities Data
      description: 'Get opportunities data.

        :param db: The database session for accessing the database.

        :param auth: The authorization token for the request.

        :param opportunities_data_request: opportunities data request.

        :return: ok status and optional message.'
      operationId: get_opportunities_data_opportunities__get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: true
        schema:
          type: integer
          title: Page
      - name: size
        in: query
        required: true
        schema:
          type: integer
          title: Size
      - name: override_global_opportunties_fetch_size
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Override Global Opportunties Fetch Size
      - name: effort
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Effort
      - name: resource_name
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Resource Name
      - name: resource_type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Resource Type
      - name: owner
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          title: Owner
      - name: user
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: User
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Status
      - name: opportunity_name
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Opportunity Name
      - name: secondary_resource
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Secondary Resource
      - name: warehouse
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Warehouse
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Start date for filtering opportunities (ISO format)
          title: Start Date
        description: Start date for filtering opportunities (ISO format)
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: End date for filtering opportunities (ISO format)
          title: End Date
        description: End date for filtering opportunities (ISO format)
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: cost_savings_max
          title: Sort
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          default: desc
          title: Sort Order
      - name: instance_id
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Instance Id
      - name: workspace_id
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Databricks workspace IDs (multi-value). Sourced from the More-Filters Workspace chip; ignored on non-Databricks tenants.
          title: Workspace Id
        description: Databricks workspace IDs (multi-value). Sourced from the More-Filters Workspace chip; ignored on non-Databricks tenants.
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_GetOpportunitiesDataResponse_'
        '400':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Get Opportunities Data Opportunities  Get
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Get Opportunities Data Opportunities  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Opportunities
      summary: Put Opportunities Data
      description: 'Update opportunities data in both PostgreSQL and ClickHouse databases and OS(TODO: to be removed).


        Args:

        db: Database session for PostgreSQL access

        auth: Authentication token containing user info

        tenant: Tenant identifier

        tenant_alias: Alias for the tenant

        opportunities_data_request: Request containing opportunity changes

        client: OpenSearch client for legacy updates (TODO: to be removed)

        clickhouse_client: ClickHouse client for updating global_opportunities_aggregated table

        is_operation_allowed: Flag indicating if operation is allowed for tenant


        Returns:

        StandardResponse with status and optional message'
      operationId: put_opportunities_data_opportunities__post
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutOpportunitiesDataRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 400 Put Opportunities Data Opportunities  Post
        '403':
          description: Not supported for public user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response 403 Put Opportunities Data Opportunities  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /opportunities/implemented:
    get:
      tags:
      - Opportunities
      summary: Get Implemented Opportunities Data
      description: 'List opportunities that were marked IMPLEMENTED.


        Reads from the dedicated `implemented_opportunities` ClickHouse table

        that survives the 1-month TTL on `individual_opportunities`. The main

        GET `/opportunities/` endpoint is untouched — it still serves the

        Active/Dismissed view from the original tables.'
      operationId: get_implemented_opportunities_data_opportunities_implemented_get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: true
        schema:
          type: integer
          title: Page
      - name: size
        in: query
        required: true
        schema:
          type: integer
          title: Size
      - name: effort
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Effort
      - name: resource_name
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Resource Name
      - name: resource_type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Resource Type
      - name: owner
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          title: Owner
      - name: opportunity_name
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Opportunity Name
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Start Date
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: End Date
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: cost_savings_max
          title: Sort
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          default: desc
          title: Sort Order
      - name: instance_id
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Instance Id
      - name: user
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: User
      - name: warehouse
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Warehouse
      - name: database
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Database
      - name: schema
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Schema
      - name: workspace_id
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Databricks workspace IDs (multi-value). Sourced from the More-Filters Workspace chip; ignored on non-Databricks tenants.
          title: Workspace Id
        description: Databricks workspace IDs (multi-value). Sourced from the More-Filters Workspace chip; ignored on non-Databricks tenants.
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
