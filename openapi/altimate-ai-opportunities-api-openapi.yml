      - timestamp
      title: CommentResponse
    CreateStudioOpportunityResponse:
      properties:
        opportunity_id:
          type: string
          title: Opportunity Id
        instance_id:
          type: integer
          title: Instance Id
        already_existed:
          type: boolean
          title: Already Existed
          default: false
      type: object
      required:
      - opportunity_id
      - instance_id
      title: CreateStudioOpportunityResponse
    Page_GetOpportunitiesDataResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/GetOpportunitiesDataResponse'
          type: array
