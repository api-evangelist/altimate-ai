openapi: 3.1.0
info:
  title: Fast ACCOUNT_COSTS OPPORTUNITIES API
  version: 0.1.0
tags:
- name: OPPORTUNITIES
paths:
  /opportunities/:
    get:
      tags:
      - OPPORTUNITIES
      summary: Get Opportunities Data
      description: 'Get opportunities data.

        :param db: The database session for accessing the database.

        :param auth: The authorization token for the request.

        :param opportunities_data_request: opportunities data request.

        :return: ok status and optional message.'
      operationId: get_opportunities_data_opportunities__get
      security:
      - HTTPBearer: []
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: true
        schema:
          type: integer
          title: Page
      - name: size
        in: query
        required: true
        schema:
          type: integer
          title: Size
      - name: override_global_opportunties_fetch_size
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Override Global Opportunties Fetch Size
      - name: effort
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Effort
      - name: resource_name
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Resource Name
      - name: resource_type
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Resource Type
      - name: owner
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          title: Owner
      - name: user
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: User
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Status
      - name: opportunity_name
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Opportunity Name
      - name: secondary_resource
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Secondary Resource
      - name: warehouse
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Warehouse
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Start date for filtering opportunities (ISO format)
          title: Start Date
        description: Start date for filtering opportunities (ISO format)
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: End date for filtering opportunities (ISO format)
          title: End Date
        description: End date for filtering opportunities (ISO format)
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: cost_savings_max
          title: Sort
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          default: desc
          title: Sort Order
      - name: instance_id
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          title: Instance Id
      - name: workspace_id
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          description: Databricks workspace IDs (multi-value). Sourced from the More-Filters Workspace
            chip; ignored on non-Databricks tenants.
          title: Workspace Id
        description: Databricks workspace IDs (multi-value). Sourced from the More-Filters Workspace chip;
          ignored on non-Databricks tenants.
      - name: navigationSource
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Navigationsource
      - name: x-tenant
        in: header
        required: true
        schema:
          type: string
          title: X-Tenant
