overlay: 1.0.0
info:
  title: API Evangelist enhancements for Altimate AI
  version: 1.0.0
extends: openapi/altimate-ai-openapi-original.json
# The harvested spec is a generic FastAPI export (title "FastAPI", version 0.1.0, no
# servers[]). This overlay records our enhancements without mutating the original.
actions:
  - target: $.info
    update:
      title: Altimate AI Platform API
      x-apievangelist-rating: 3
      x-apievangelist-notes: >-
        1004 operations across data-engineering products (dbt, Databricks, Snowflake,
        query cost, lineage, contracts, governance). Bearer (HTTPBearer) auth. SOC 2 Type II.
  - target: $
    update:
      servers:
        - url: https://api.myaltimate.com
          description: Altimate AI production API
