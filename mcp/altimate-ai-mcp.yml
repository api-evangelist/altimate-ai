# Altimate's core product is delivered as an MCP server (the "Altimate MCP Engine" /
# Datamate). It runs locally on the engineer's machine (or as a hosted endpoint behind
# OAuth) and exposes 30+ data-engineering tool integrations (Snowflake, Databricks, dbt,
# Airflow, Jira, etc.) to coding agents. The engine bridges to the platform API at
# api.myaltimate.com using the user's Altimate API key + instance name.
server:
  name: datamate
  product: Altimate MCP Engine
  package: "@altimateai/datamate"
  transport: sse
  local_endpoint: http://localhost:7700/sse
  start_command: datamate start --datamate <id> --client <client> --config-file <path>
  quick_add: "claude mcp add --transport sse datamate http://localhost:7700/sse"
  hosted: >-
    Also supported as a remote/hosted MCP endpoint behind OAuth (custom headers or
    OAuth 2.0 client_id/authorization_url/token_url) per the MCP servers configuration docs.
  auth:
    method: api-key
    config_keys: [altimateUrl, altimateInstanceName, altimateApiKey]
    platform_api: https://api.myaltimate.com
  vscode_extension: https://open-vsx.org/extension/altimateai/vscode-altimate-mcp-server
  docs:
    - https://help.altimate.ai/datamates/user-guide/home/
    - https://help.altimate.ai/code/configure/mcp-servers/
integrations:
  - Snowflake
  - Databricks
  - dbt
  - dbt Cloud
  - Airflow
  - Jira
  - Metabase
  - Tableau
  - Cursor
  - GitHub Copilot
  - Windsurf
  - Claude Code
  - Gemini CLI
notes: >-
  Tool surface is delivered by the engine, not a static list; it maps onto the
  api.myaltimate.com REST operations catalogued in openapi/altimate-ai-openapi-original.json.
