source: https://help.altimate.ai/datamates/user-guide/setup/claude-code-setup/
# Altimate ships two first-party CLIs. Binaries are catalogued in packages/.
clis:
  - name: datamate
    package: "@altimateai/datamate"
    registry: npm
    install:
      - npm install -g @altimateai/datamate
    description: >-
      The Datamate / Altimate MCP Engine CLI. Starts a local MCP server that
      bridges IDEs and coding agents (Claude Code, Cursor, VS Code) to the
      Altimate platform at api.myaltimate.com.
    config:
      file_keys: [altimateUrl, altimateInstanceName, altimateApiKey]
      altimateUrl: https://api.myaltimate.com
    commands:
      - command: datamate start --datamate <id> --client <client> --config-file <path>
        description: Start the local Datamate MCP server (default SSE endpoint http://localhost:7700/sse).
  - name: altimate-code
    package: altimate-code
    registry: npm
    install:
      - npm install -g altimate-code
    description: The AI-native data engineering agent for the terminal — an agentic harness for dbt, SQL, and cloud warehouses.
    repository: https://github.com/AltimateAI/altimate-code
  - name: datapilot
    package: altimate-datapilot-cli
    registry: pypi
    install:
      - pip install altimate-datapilot-cli
    description: DataPilot CLI — the AI teammate for engineers; SQL and dbt best-practice checks.
    repository: https://github.com/AltimateAI/datapilot-cli
